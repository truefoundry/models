name: Verify stale

# Daily bookkeeping for review time: lists the open `fast-lane` bot PRs older than 24 h and the open
# `gate:escalate` PRs older than 72 h in ONE tracking issue, "Bot PR review queue" (created when
# missing, body edited in place, one comment per day while something is overdue).
# Runs the default branch's code only. It reads PRs and writes nothing but that issue: it never
# labels, comments on or edits a PR. Re-running it the same day changes nothing.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  queue:
    name: Update the review queue issue
    # a manual run on another branch would execute that branch's code with a write token
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # check out the default branch's tool code
      pull-requests: read   # list open PRs and their labels
      issues: write         # the tracking issue and its comment, nothing else is written
    concurrency:
      group: verify-stale
      cancel-in-progress: false

    steps:
      - name: Checkout trusted tool code (default branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Update the Bot PR review queue issue
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m verify.queue
