name: Test Changed Models (Impl)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      comment_id:
        required: false
        type: string
        default: ''
      # GitHub OIDC sub is ref:refs/heads/* for issue_comment / push-like runs,
      # but pull_request for pull_request and pull_request_target. Match the
      # Tailscale federated identity (TS_CI_APPLY_* vs TS_CI_PR_*).
      tailscale_role:
        description: 'Tailscale CI role: apply (ref) or pr (pull_request)'
        required: false
        type: string
        default: 'apply'
    secrets:
      TFY_API_KEY:
        required: true
      TFY_HOST:
        required: true
      GATEWAY_TEST_JOB_V2_FQN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  test-changed-models:
    name: Trigger gateway tests for changed models
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TFY_API_KEY: ${{ secrets.TFY_API_KEY }}
      TFY_HOST: ${{ secrets.TFY_HOST }}
      GATEWAY_TEST_JOB_V2_FQN: ${{ secrets.GATEWAY_TEST_JOB_V2_FQN }}
      PR_NUMBER: ${{ inputs.pr_number }}
      COMMENT_ID: ${{ inputs.comment_id }}

    steps:
      - name: React eyes to commentg
        if: inputs.comment_id != ''
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes'

      - name: Checkout trusted base (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install truefoundry
        run: pipx install truefoundry

      - name: Join tailnet
        # TFY_HOST is tailnet-only. GitHub OIDC → Tailscale; no secret.
        # apply = refs/heads/*; pr = pull_request (incl. pull_request_target).
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ inputs.tailscale_role == 'pr' && vars.TS_CI_PR_CLIENT_ID || vars.TS_CI_APPLY_CLIENT_ID }}
          audience: ${{ inputs.tailscale_role == 'pr' && vars.TS_CI_PR_AUDIENCE || vars.TS_CI_APPLY_AUDIENCE }}
          tags: tag:ci-internal
          hostname: gh-${{ github.event.repository.name }}-${{ github.run_id }}

      - name: Login to TrueFoundry
        run: tfy login --api-key "$TFY_API_KEY" --host "$TFY_HOST"

      - name: Trigger gateway tests for changed PR files
        id: trigger
        run: python ./.github/scripts/trigger_changed_model_tests.py

      - name: Comment - no models to test
        if: success() && steps.trigger.outputs.triggered == '0'
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="No provider yaml changes detected in this PR. Nothing to test."

      - name: React rocket on success
        if: success() && inputs.comment_id != '' && steps.trigger.outputs.triggered != '0'
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket' || true

      - name: React confused on failure
        if: failure() && inputs.comment_id != ''
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='confused' || true
