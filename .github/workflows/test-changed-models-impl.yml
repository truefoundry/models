name: Test Changed Models (Impl)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      comment_id:
        required: false
        type: string
        default: ''
    secrets:
      TFY_API_KEY:
        required: true
      TFY_HOST:
        required: true
      GATEWAY_TEST_JOB_V2_FQN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-changed-models:
    name: Trigger gateway tests for changed models
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TFY_API_KEY: ${{ secrets.TFY_API_KEY }}
      TFY_HOST: ${{ secrets.TFY_HOST }}
      GATEWAY_TEST_JOB_V2_FQN: ${{ secrets.GATEWAY_TEST_JOB_V2_FQN }}
      PR_NUMBER: ${{ inputs.pr_number }}
      COMMENT_ID: ${{ inputs.comment_id }}

    steps:
      - name: React eyes to commentg
        if: inputs.comment_id != ''
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes'

      - name: Checkout trusted base (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install truefoundry
        run: pipx install truefoundry

      - name: Login to TrueFoundry
        run: tfy login --api-key "$TFY_API_KEY" --host "$TFY_HOST"

      - name: Trigger gateway tests for changed PR files
        id: trigger
        run: python ./.github/scripts/trigger_changed_model_tests.py

      - name: Comment - no models to test
        if: success() && steps.trigger.outputs.triggered == '0'
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body="No provider yaml changes detected in this PR. Nothing to test."

      - name: React rocket on success
        if: success() && inputs.comment_id != '' && steps.trigger.outputs.triggered != '0'
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='rocket' || true

      - name: React confused on failure
        if: failure() && inputs.comment_id != ''
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='confused' || true
