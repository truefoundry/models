name: SDK live model tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'providers/**/*.yaml'
      - '.github/scripts/sdk-live-test/**'
      - '.github/workflows/sdk-live-test.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  sdk-live:
    name: SDK live feature checks
    runs-on: ubuntu-latest
    # Same-repo only (fork PRs get no provider secrets). /test-models: OWNER/MEMBER/COLLABORATOR.
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/test-models') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      MISTRAL_AI_API_KEY: ${{ secrets.MISTRAL_AI_API_KEY }}
      PERPLEXITY_AI_API_KEY: ${{ secrets.PERPLEXITY_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve PR ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr="${{ github.event.issue.number }}"
            meta=$(gh api "repos/${{ github.repository }}/pulls/${pr}")
            head_repo=$(echo "$meta" | jq -r .head.repo.full_name)
            if [ "$head_repo" != "${{ github.repository }}" ]; then
              echo "::error::Refusing /test-models on fork PR ($head_repo)"
              exit 1
            fi
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "head=$(echo "$meta" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
            echo "base=$(echo "$meta" | jq -r .base.sha)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.head }}
          fetch-depth: 0

      - name: Checkout base for significance diff
        if: steps.ref.outputs.pr != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.base }}
          path: .base-checkout
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repo + build catalogue
        run: |
          npm ci
          npm run build:json

      - name: List changed model yamls
        id: changed
        run: |
          if [ -z "${{ steps.ref.outputs.pr }}" ]; then
            echo "No PR context; pass models via workflow_dispatch locally."
            touch changed-files.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ steps.ref.outputs.pr }}/files" \
            --jq '.[].filename' \
            | grep -E '^providers/.+\.yaml$' \
            | grep -vE '/(default|provider-config)\.yaml$' \
            > changed-files.txt || true
          # Drop deleted paths
          tmp=$(mktemp)
          while IFS= read -r f; do
            [ -f "$f" ] && echo "$f" >> "$tmp"
          done < changed-files.txt
          mv "$tmp" changed-files.txt
          count=$(wc -l < changed-files.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed files ($count):"
          cat changed-files.txt || true

      - name: Install SDK live harness
        if: steps.changed.outputs.count != '0'
        working-directory: .github/scripts/sdk-live-test
        run: npm ci

      - name: Run unit checks
        if: steps.changed.outputs.count != '0'
        working-directory: .github/scripts/sdk-live-test
        run: npm run test:unit

      - name: Run SDK live scenarios
        id: live
        if: steps.changed.outputs.count != '0'
        working-directory: .github/scripts/sdk-live-test
        run: |
          npm run test:live -- \
            --catalogue "${{ github.workspace }}/dist/ai-models.json" \
            --files-list "${{ github.workspace }}/changed-files.txt" \
            --base-dir "${{ github.workspace }}/.base-checkout"
