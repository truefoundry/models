name: SDK live model tests

on:
  # Actions → SDK live model tests → Run workflow (optional models= "openai/gpt-4o-mini …")
  workflow_dispatch:
    inputs:
      models:
        description: >-
          Optional space-separated provider/modelId overrides. Leave empty to smoke
          one cheap model per registered provider that has its API key secret set.
        required: false
        default: ''
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'providers/**/*.yaml'
      - '.github/scripts/sdk-live-test/**'
      - '.github/workflows/sdk-live-test.yml'

permissions:
  contents: read

jobs:
  sdk-live:
    name: SDK live feature checks
    runs-on: ubuntu-latest
    # Same-repo only (fork PRs get no provider secrets).
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      MISTRAL_AI_API_KEY: ${{ secrets.MISTRAL_AI_API_KEY }}
      PERPLEXITY_AI_API_KEY: ${{ secrets.PERPLEXITY_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      AI21_API_KEY: ${{ secrets.AI21_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}

    steps:
      - name: Resolve PR ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.head }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repo + build catalogue
        run: |
          npm ci
          npm run build:json

      - name: List changed model yamls
        id: changed
        run: |
          if [ -z "${{ steps.ref.outputs.pr }}" ]; then
            echo "No PR context — workflow_dispatch smoke via --model inputs."
            touch changed-files.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR file set without the REST API: fetch base, then three-dot diff
          # (merge-base…head). ACMR = added/copied/modified/renamed (no deletes).
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR \
            "${{ steps.ref.outputs.base }}...${{ steps.ref.outputs.head }}" \
            -- providers \
            | grep -E '^providers/.+\.yaml$' \
            | grep -vE '/(default|provider-config)\.yaml$' \
            > changed-files.txt || true
          count=$(wc -l < changed-files.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed files ($count):"
          cat changed-files.txt || true

      - name: Install SDK live harness
        working-directory: .github/scripts/sdk-live-test
        run: npm ci

      - name: Run unit checks
        working-directory: .github/scripts/sdk-live-test
        run: npm run test:unit

      # PR: full scenario matrix for every changed model YAML.
      - name: Run SDK live scenarios (PR changed models)
        id: live
        if: steps.changed.outputs.count != '0'
        working-directory: .github/scripts/sdk-live-test
        run: |
          npm run test:live -- \
            --catalogue "${{ github.workspace }}/dist/ai-models.json" \
            --files-list "${{ github.workspace }}/changed-files.txt"

      # Manual: one baseline per provider with a secret, or explicit --model list.
      - name: Run SDK live smoke (secrets)
        if: github.event_name == 'workflow_dispatch'
        working-directory: .github/scripts/sdk-live-test
        run: |
          models="${{ github.event.inputs.models }}"
          args=(--catalogue "${{ github.workspace }}/dist/ai-models.json")
          if [ -n "$models" ]; then
            for m in $models; do
              args+=(--model "$m")
            done
            echo "Smoke models (override): $models"
          else
            args+=(--smoke-with-secrets)
            echo "Smoke: one model per provider with a set API key secret"
          fi
          npm run test:live -- "${args[@]}"
