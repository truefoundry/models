name: TMP OpenRouter clairic probe

on:
  pull_request:
    paths:
      - .github/workflows/tmp-openrouter-clairic-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Probe cloudflare/clairic routes
        run: |
          BODY='{"model":"cloudflare/clairic","state":"Listing: vintage red bicycle, light scratches on the frame","questions":{"is_bike":{"type":"noul","instructions":"Is the listed item a bicycle?","criteria":{"true":"yes","false":"no"}}}}'
          for p in /api/v1/systemone /api/alpha/decisions /api/alpha/extractions; do
            echo "=== POST $p"
            curl -sS -w "\nHTTP %{http_code}\n" "https://openrouter.ai$p" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -d "$BODY" | head -c 1500
            echo
          done
