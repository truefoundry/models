name: Trigger Updation Job on Provider Change

on:
  push:
    branches:
      - main
    paths:
      - 'providers/**'

jobs:
  trigger-updation:
    name: Trigger updation job for changed models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed model YAML files
        id: changes
        run: |
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'providers/**/*.yaml' | grep -v '/default\.yaml' || true)

          if [ -z "$changed" ]; then
            echo "No model YAML files changed, skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install truefoundry
        if: steps.changes.outputs.has_changes == 'true'
        run: pipx install truefoundry

      - name: Login to TrueFoundry
        if: steps.changes.outputs.has_changes == 'true'
        env:
          TFY_API_KEY: ${{ secrets.TFY_API_KEY }}
          TFY_HOST: ${{ secrets.TFY_HOST }}
        run: tfy login --api-key "$TFY_API_KEY" --host "$TFY_HOST"

      - name: Trigger updation job
        if: steps.changes.outputs.has_changes == 'true'
        env:
          TFY_JOB_FQN: ${{ secrets.TFY_JOB_FQN }}
        run: |
          tfy job trigger \
            --fqn "$TFY_JOB_FQN" \
            --command "python job.py"
