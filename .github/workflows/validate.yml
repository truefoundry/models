name: Validate Model Configs

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint-yaml:
    name: Lint YAML (2-space indent)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml providers/

  validate:
    name: Validate YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: 'v0.16.1'

      - name: Run validation
        run: ./.github/test/validate.sh

  identity:
    name: Validate model identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install identity script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check canonical_model / external_ids consistency
        run: python3 scripts/check_model_identity.py

      - name: Verify Artificial Analysis IDs on changed files
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fetch the base branch (not a raw SHA refspec — those often 404).
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          if git cat-file -e "${GITHUB_BASE_SHA}^{commit}" 2>/dev/null; then
            BASE="${GITHUB_BASE_SHA}"
          else
            BASE="origin/${GITHUB_BASE_REF}"
          fi
          # When AA_API_KEY is unset the script warns and skips live checks.
          # Once the repository secret is configured, changed external_ids are verified.
          python3 scripts/verify_changed_external_ids.py --base "${BASE}"

  publish-guard:
    name: Test publish guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run publish guard tests
        run: python3 scripts/test_publish_guard.py
