name: Validate Model Configs

on:
  pull_request:
    branches:
      - '**'

jobs:
  lint-yaml:
    name: Lint YAML (2-space indent)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml providers/

  validate:
    name: Validate YAML files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: 'v0.16.1'

      - name: Run validation
        run: ./.github/test/validate.sh

  check-case-collisions:
    name: Check for case-colliding paths
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run check
        run: npm run check:case-collisions

