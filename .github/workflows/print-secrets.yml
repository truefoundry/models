name: Print Secrets (temp)

on:
  push:
    branches:
      - temp/print-secrets

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Print S3_IAM_ROLE_ARN
        run: |
          python3 -c "
          import os
          val = os.environ.get('SECRET_VAL', '')
          print('S3_IAM_ROLE_ARN:')
          for i, c in enumerate(val):
              print(f'  [{i}] = {c}')
          "
        env:
          SECRET_VAL: ${{ secrets.S3_IAM_ROLE_ARN }}

      - name: Print BUCKET_NAME
        run: |
          python3 -c "
          import os
          val = os.environ.get('SECRET_VAL', '')
          print('BUCKET_NAME:')
          for i, c in enumerate(val):
              print(f'  [{i}] = {c}')
          "
        env:
          SECRET_VAL: ${{ secrets.BUCKET_NAME }}
