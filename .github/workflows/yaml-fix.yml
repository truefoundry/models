# On every push: run yamlfix on providers/. If it changes files, commit and push.
name: YAML Fix

on:
  push:
    branches:
      - '**'

jobs:
  fix:
    name: Fix YAML and commit if changed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamlfix
        run: pip install yamlfix

      - name: Fix YAML
        run: yamlfix providers/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add providers/
          git diff --staged --quiet || (git commit -m "chore: fix YAML format" && git push)