name: Auto Comment /test-models on Bot PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-comment:
    name: Comment /test-models when PR title is from add-models bot
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.title, 'add new models [bot]')
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Post /test-models comment
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -f body='/test-models'
