name: Validate rejected.yaml

on:
  pull_request:
    paths:
      - 'rejected.yaml'
      - 'scripts/validate_rejected.py'
      - 'scripts/test_validate_rejected.py'
      - '.github/workflows/validate-rejected.yml'

permissions:
  contents: read

jobs:
  validate-rejected:
    name: Validate rejected.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyYAML==6.0.2 pytest==8.3.4

      - name: Validate rejected.yaml
        run: python3 scripts/validate_rejected.py

      - name: Test the validator
        run: python3 -m pytest -q scripts/test_validate_rejected.py
