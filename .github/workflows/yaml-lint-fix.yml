# On every push: run yamllint on all providers/ YAML; if it fails, fix and push a commit.
name: YAML Lint and Auto-Fix

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-fix:
    name: Lint YAML, fix and commit if needed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint and yamlfix
        run: pip install yamllint yamlfix

      - name: Run yamllint
        id: yamllint
        run: bash scripts/run-yamllint-all.sh
        continue-on-error: true

      - name: Fix YAML
        if: steps.yamllint.outputs.lint_failed == 'true'
        run: yamlfix providers/

      - name: Commit and push if fixed
        if: steps.yamllint.outputs.lint_failed == 'true'
        run: bash scripts/commit-yaml-fix.sh
