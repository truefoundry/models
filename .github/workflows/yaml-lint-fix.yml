# On every push: run YAML formatter and commit if changed.
name: YAML Lint and Auto-Fix

on:
  push:
    branches:
      - '**'

jobs:
  lint-and-fix:
    name: Fix YAML and commit if changed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run YAML fix
        run: npm run lint:yaml:fix

      - name: Validate (yamllint)
        run: pip install yamllint && yamllint -c .yamllint.yml providers/

      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.1
      - name: Validate (CUE)
        run: ./test/validate.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add providers/
          if ! git diff --staged --quiet; then
            git commit -m "chore: fix YAML format" && git push
          fi
