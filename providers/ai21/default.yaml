documentation:
    - https://docs.ai21.com
    - https://www.ai21.com/pricing
    - https://docs.ai21.com/docs/jamba-foundation-models
messages:
    options:
        - system
        - user
        - assistant
params:
    -
        defaultValue: 256
        key: max_tokens
        maxValue: 8192
        minValue: 1
    -
        defaultValue: 0.7
        key: temperature
        maxValue: 1
        minValue: 0
    -
        defaultValue: null
        key: stop
        skipValues:
            - null
            - []
        type: array-of-strings
    -
        defaultValue: 1
        key: top_p
        maxValue: 1
        minValue: 0
    -
        defaultValue: 1
        key: top_k
        maxValue: 1
        minValue: 0
    -
        defaultValue: 1
        key: "n"
        maxValue: 10
        minValue: 1
    -
        defaultValue: 0
        key: frequency_penalty
        maxValue: 500
        minValue: 0
    -
        defaultValue: 0
        key: presence_penalty
        maxValue: 5
        minValue: 0
    -
        defaultValue: true
        key: stream
        type: boolean
type:
    primary: chat
    supported: []
