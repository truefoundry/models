costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 256000
    max_output_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: jamba-large-1.7
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.4
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: n
      maxValue: 16
      minValue: 1
removeParams:
    - top_k
sources:
    - https://docs.ai21.com/docs/function-calling
    - https://docs.ai21.com/reference/jamba-1-6-api-ref
status: active
