{
  "model": "jamba-large-1.7",
  "mode": "chat",
  "costs": [
    {
      "region": "*",
      "input_cost_per_token": 0.000002,
      "output_cost_per_token": 0.000008
    }
  ],
  "limits": {
    "context_window": 256000,
    "max_output_tokens": 4096
  },
  "features": [
    "function_calling",
    "tool_choice",
    "structured_output",
    "json_output",
    "prompt_caching"
  ],
  "modalities": {
    "input": [
      "text"
    ],
    "output": [
      "text"
    ]
  }
}
