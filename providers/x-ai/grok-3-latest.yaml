model: grok-3-latest
costs:
    - region: us-east-1
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 7.5e-7
    - region: eu-west-1
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 7.5e-7
    - region: "*"
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 7.5e-7
limits:
    max_tokens: 4096
    max_input_tokens: 131072
    max_output_tokens: 131072
features: [function_calling, chat, tool_choice]
mode: chat
