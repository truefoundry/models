costs:
    -
        input_cost_per_token: 0.000005
        output_cost_per_token: 0.000015
        region: '*'
features: [chat, function_calling, vision, tool_choice]
limits:
    max_input_tokens: 131072
    max_output_tokens: 131072
mode: chat
model: grok-beta
params:
    -
        key: max_tokens
        maxValue: 4096
