model: grok-code-fast
costs:
    - region: "*"
      input_cost_per_token: 2e-7
      output_cost_per_token: 0.0000015
      cache_read_input_token_cost: 2e-8
limits:
    max_tokens: 4096
    max_input_tokens: 256000
    max_output_tokens: 256000
features: [chat, function_calling, tool_choice]
mode: chat
