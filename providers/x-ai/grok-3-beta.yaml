model: grok-3-beta
costs:
    -
        region: '*'
        input_cost_per_token: 0.000003
        output_cost_per_token: 0.000015
        cache_read_input_token_cost: 7.5e-7
limits:
    max_tokens: 4096
    max_input_tokens: 131072
    max_output_tokens: 131072
features: [chat, function_calling, tool_choice]
mode: chat
