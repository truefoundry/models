documentation:
    - https://docs.perplexity.ai/docs/sonar/models
    - https://docs.perplexity.ai/docs/agent-api/models
    - https://docs.perplexity.ai/docs/getting-started/pricing
messages:
    options:
        - system
        - user
        - assistant
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 32768
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: top_k
      maxValue: 2048
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: 0
      key: frequency_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: 0
      key: presence_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: null
      key: stop
      skipValues:
          - null
          - []
      type: array-of-strings
    - defaultValue: true
      key: stream
      type: boolean
type:
    primary: chat
    supported: []
