canonical_model: anthropic/claude-haiku-5-5
costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 5e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-8
                from: 100000
          input:
              - cost_per_token: 5e-7
                from: 100000
          output:
              - cost_per_token: 2.5e-6
                from: 100000
          pricing_mode: cumulative
external_ids:
    artificial_analysis_id: 7d064a11-6e78-4030-b535-cdf940615041
    artificial_analysis_slug: claude-haiku-5-5
features:
    - function_calling
    - mid_conversation_system_messages
    - structured_output
    - system_messages
limits:
    # Perplexity publishes no separate context limit; this is Anthropic's model specification.
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: anthropic/claude-haiku-5-5
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://platform.claude.com/docs/en/models/haiku-5-5/overview
    - https://docs.perplexity.ai/docs/agent-api/models
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
status: active
supportedModes:
    - chat
thinking: true
