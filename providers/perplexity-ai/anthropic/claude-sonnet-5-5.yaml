canonical_model: anthropic/claude-sonnet-5-5
costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      region: "*"
external_ids:
    artificial_analysis_id: b171d979-5ec1-45de-b8b9-db1ee65e77ec
    artificial_analysis_slug: claude-sonnet-5-5
features:
    - function_calling
    - structured_output
    - prompt_caching
    - system_messages
limits:
    # Perplexity publishes no separate context limit; this is Anthropic's model specification.
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: anthropic/claude-sonnet-5-5
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://platform.claude.com/docs/en/models/sonnet-5-5/overview
    - https://docs.perplexity.ai/docs/agent-api/models
    - https://www.anthropic.com/claude-sonnet-5-5
supportedModes:
    - chat
thinking: true
