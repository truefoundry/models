canonical_model: anthropic/claude-sonnet-4-5
costs:
    - cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
limits:
    # Perplexity publishes no separate context limit; this is Anthropic's model specification.
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
mode: chat
model: anthropic/claude-sonnet-4-5
provisioning: serverless
sources:
    - https://platform.claude.com/docs/en/models/sonnet-4-5/overview
    - https://docs.perplexity.ai/docs/resources/changelog
supportedModes:
    - chat
thinking: true
