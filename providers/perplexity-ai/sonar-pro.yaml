costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - structured_output
    - system_messages
limits:
    context_window: 200000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: sonar-pro
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - stop
sources:
    - https://docs.perplexity.ai/docs/sonar/models/sonar-pro
    - https://docs.perplexity.ai/docs/sonar/features
status: active
supportedModes:
    - chat
