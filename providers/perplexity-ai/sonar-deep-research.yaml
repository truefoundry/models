costs:
    - input_cost_per_query: 0.005
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - structured_output
    - system_messages
    - json_output
limits:
    context_window: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: sonar-deep-research
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
retirementDate: "2026-09-27"
sources:
    - https://docs.perplexity.ai/docs/sonar/models/sonar-deep-research
    - https://docs.perplexity.ai/docs/sonar/features
status: active
supportedModes:
    - chat
thinking: true
