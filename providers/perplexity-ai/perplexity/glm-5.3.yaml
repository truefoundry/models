costs:
    - cache_read_input_token_cost: 2.6e-7
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: perplexity/glm-5.3
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://docs.z.ai/guides/llm/glm-5.3
status: active
supportedModes:
    - chat
thinking: true
