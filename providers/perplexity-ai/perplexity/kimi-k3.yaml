canonical_model: perplexity/kimi-k3
costs:
    - cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - prompt_caching
limits:
    context_window: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: perplexity/kimi-k3
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://docs.perplexity.ai/docs/cookbook/examples/data-story-kimi-k3/README.md
status: active
supportedModes:
    - chat
thinking: true
