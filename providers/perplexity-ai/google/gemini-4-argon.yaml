costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - structured_output
    - code_execution
    - system_messages
limits:
    # Perplexity's Agent API page publishes no limits; values below are from the upstream Google model page
    context_window: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
        - pdf
    output:
        - text
mode: chat
model: google/gemini-4-argon
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-4-argon
supportedModes:
    - chat
thinking: true
