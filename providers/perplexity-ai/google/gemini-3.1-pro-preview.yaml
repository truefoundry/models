costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000012
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000018
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - structured_output
    - json_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
        - pdf
    output:
        - text
mode: chat
model: google/gemini-3.1-pro-preview
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
status: preview
supportedModes:
    - chat
thinking: true
