costs:
    - cache_read_input_token_cost: 6.25e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - chat
    - response_schema
    - prompt_caching
limits:
    context_window: 128000
    max_input_tokens: 128000
mode: chat
model: sonar
removeParams:
    - stop
sources:
    - https://docs.perplexity.ai/docs/getting-started/models/models/sonar
    - https://docs.perplexity.ai/docs/sonar/features.md
