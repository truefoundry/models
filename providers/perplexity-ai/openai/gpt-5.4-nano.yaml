# Costs from LiteLLM perplexity/openai/gpt-5.4-nano.
costs:
    - cache_read_input_token_cost: 2e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 1.25e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.4-nano
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-nano
status: active
supportedModes:
    - chat
    - responses
thinking: true
