costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.00001
                from: 272000
          output:
              - cost_per_token: 0.000045
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - json_output
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5
status: active
supportedModes:
    - chat
thinking: true
