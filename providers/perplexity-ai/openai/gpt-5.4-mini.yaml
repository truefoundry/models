features:
    - function_calling
    - structured_output
    - prompt_caching
    - json_output
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.4-mini
provisioning: serverless
# costs not found in official Perplexity Agent API documentation
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-mini
supportedModes:
    - chat
thinking: true
