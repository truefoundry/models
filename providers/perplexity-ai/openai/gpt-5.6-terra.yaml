costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000012
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 272000
          input:
              - cost_per_token: 0.000004
                from: 272000
          output:
              - cost_per_token: 0.000018
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.6-terra
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://docs.perplexity.ai/docs/router/models
    - https://docs.perplexity.ai/api-reference/models-get
    - https://docs.perplexity.ai/llms.txt
    - https://developers.openai.com/api/docs/models/gpt-5.6-terra
status: active
supportedModes:
    - chat
thinking: true
