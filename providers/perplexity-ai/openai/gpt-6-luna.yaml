costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 5e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2e-8
                from: 272000
          input:
              - cost_per_token: 2e-7
                from: 272000
          output:
              - cost_per_token: 7.5e-7
                from: 272000
          pricing_mode: cumulative
features:
    - prompt_caching
    - structured_output
    - system_messages
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-6-luna
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-6-luna
status: active
supportedModes:
    - chat
thinking: true
