costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2e-7
                from: 272000
          input:
              - cost_per_token: 0.000004
                from: 272000
          output:
              - cost_per_token: 0.000015
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - prompt_caching
    - system_messages
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-6.1-sol
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-6.1-sol
status: active
supportedModes:
    - chat
thinking: true
