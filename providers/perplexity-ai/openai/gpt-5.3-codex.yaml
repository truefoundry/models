costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 1.75e-6
      output_cost_per_token: 1.4e-5
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - prompt_caching
    - system_messages
limits:
    context_window: 400000
    max_input_tokens: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.3-codex
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.3-codex
status: active
supportedModes:
    - chat
thinking: true
