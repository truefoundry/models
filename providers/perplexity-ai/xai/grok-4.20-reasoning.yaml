costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 2.5e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 2.5e-6
                from: 200000
          output:
              - cost_per_token: 5e-6
                from: 200000
          pricing_mode: cumulative
features:
    - prompt_caching
limits:
    context_window: 1000000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: xai/grok-4.20-reasoning
provisioning: serverless
sources:
    - https://docs.perplexity.ai/api-reference/models-get
    - https://docs.x.ai/developers/models
supportedModes:
    - chat
thinking: true
