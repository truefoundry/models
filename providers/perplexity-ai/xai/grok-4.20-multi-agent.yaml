costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 199999
          input:
              - cost_per_token: 0.0000025
                from: 199999
          output:
              - cost_per_token: 0.000005
                from: 199999
features:
    - function_calling
    - prompt_caching
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: xai/grok-4.20-multi-agent
provisioning: serverless
sources:
    - https://docs.x.ai/developers/models
    - https://vercel.com/ai-gateway/models/grok-4.20-multi-agent
status: active
supportedModes:
    - chat
