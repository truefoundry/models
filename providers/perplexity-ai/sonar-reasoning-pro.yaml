costs:
    - input_cost_per_request: 0.006
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - json_output
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: sonar-reasoning-pro
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - stop
sources:
    - https://docs.perplexity.ai/docs/sonar/models/sonar-reasoning-pro
status: active
supportedModes:
    - chat
thinking: true
