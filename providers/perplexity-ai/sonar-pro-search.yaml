costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - vision
    - image_input
    - pdf_input
    - pdf
    - doc
    - system_messages
    - response_schema
limits:
    context_window: 200000
mode: chat
model: sonar-pro-search
sources:
    - https://docs.perplexity.ai/docs/sonar/models/sonar-pro
    - https://docs.perplexity.ai/docs/sonar/features
    - https://docs.perplexity.ai/docs/sonar/media
    - https://docs.perplexity.ai/docs/sonar/pro-search/quickstart
