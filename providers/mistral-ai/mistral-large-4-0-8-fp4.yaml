# CUE validation could not run (cue not installed in environment)
features:
    - function_calling
limits:
    context_window: 1048576
modalities:
    input:
        - image
        - text
mode: chat
model: mistral-large-4-0-8-fp4
params:
    - defaultValue: 1.0
      key: temperature
# costs: not found in official docs for the fp4 variant (the mistral-large-4-0 page lists a different model ID)
sources:
    - https://docs.mistral.ai/models/mistral-large-4-0
status: active
supportedModes:
    - chat
