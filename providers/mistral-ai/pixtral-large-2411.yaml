costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - assistant_prefill
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: pixtral-large-2411
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
sources:
    - https://docs.mistral.ai/models/pixtral-large-24-11
