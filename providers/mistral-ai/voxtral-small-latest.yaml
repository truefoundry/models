costs:
    - input_cost_per_second: 0.0000666667
      input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - structured_output
    - assistant_prefill
    - tool_choice
    - tools
    - system_messages
limits:
    context_window: 32000
modalities:
    input:
        - audio
        - doc
        - image
        - pdf
mode: completion
model: voxtral-small-latest
sources:
    - https://docs.mistral.ai/models/voxtral-small-25-07
