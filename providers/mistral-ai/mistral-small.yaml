model: mistral-small
costs:
    -
        region: '*'
        input_cost_per_token: 1.e-7
        output_cost_per_token: 3.e-7
limits:
    max_input_tokens: 32000
    max_output_tokens: 8191
features: [chat, function_calling, tool_choice, response_schema, assistant_prefill]
params:
    -
        key: max_tokens
        maxValue: 32768
mode: chat
