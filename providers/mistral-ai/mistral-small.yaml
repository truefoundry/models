costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - assistant_prefill
limits:
    max_input_tokens: 32000
    max_output_tokens: 8191
mode: chat
model: mistral-small
params:
    - key: max_tokens
      maxValue: 32768
