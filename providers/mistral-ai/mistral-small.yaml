model: mistral-small
costs:
  - input_cost_per_token: 1.e-7
    output_cost_per_token: 3.e-7
    input_cost_per_million_tokens: 0.1
    output_cost_per_million_tokens: 0.3
limits:
  max_input_tokens: 32000
  max_output_tokens: 8191
features: [function_calling, chat]
params:
  - key: max_tokens
    maxValue: 32768
mode: chat
original_provider: mistral
