costs:
    - input_cost_per_token: 1.5e-7
      input_cost_per_token_batches: 7.5e-8
      region: "*"
limits:
    context_window: 8192
    max_input_tokens: 8192
mode: embedding
model: codestral-embed
removeParams:
    - max_tokens
    - temperature
    - top_p
    - seed
    - stop
    - safe_prompt
    - stream
sources:
    - https://mistral.ai/news/codestral-embed
