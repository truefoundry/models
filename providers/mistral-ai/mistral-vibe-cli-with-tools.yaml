costs:
    - input_cost_per_token: 4e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - structured_output
    - assistant_prefill
    - json_output
limits:
    context_window: 131072
modalities:
    input:
        - text
        - image
        - doc
    output:
        - text
mode: chat
model: mistral-vibe-cli-with-tools
params:
    - defaultValue: 0.3
      key: temperature
    - key: reasoning_effort
      supportedValues:
          - none
          - high
provisioning: serverless
sources:
    - https://docs.mistral.ai/models/devstral-2-25-12
    - https://mistral.ai/news/devstral-2-vibe-cli
    - https://docs.mistral.ai/mistral-vibe/introduction
    - https://docs.mistral.ai/mistral-vibe/introduction/configuration
    - https://docs.mistral.ai/vibe/code/cli/work-with-cli
status: active
supportedModes:
    - chat
thinking: true
