costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
    - system_messages
    - tool_choice
limits:
    context_window: 256000
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: mistral-code-latest
params:
    - defaultValue: 0.3
      key: temperature
removeParams:
    - reasoning_effort
sources:
    - https://mistral.ai/news/mistral-code/
    - https://mistral.ai/news/codestral-25-08/
    - https://docs.mistral.ai/models/overview
    - https://docs.mistral.ai/models/codestral-25-08
status: active
supportedModes:
    - completion
    - chat
