costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - chat
    - system_messages
    - tool_choice
    - tools
    - response_schema
    - assistant_prefill
limits:
    context_window: 128000
modalities:
    input:
        - text
        - image
        - pdf
        - doc
        - code
    output:
        - text
        - code
mode: chat
model: mistral-medium-2508
sources:
    - https://docs.mistral.ai/models/mistral-medium-3-1-25-08
