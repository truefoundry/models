costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
    - tool_choice
    - system_messages
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
        - pdf
        - doc
    output:
        - text
mode: chat
model: mistral-small-2603
params:
    - defaultValue: 0.3
      key: temperature
    - key: reasoning_effort
      supportedValues:
          - none
          - high
provisioning: serverless
sources:
    - https://docs.mistral.ai/models/mistral-small-4-0-26-03
    - https://docs.mistral.ai/capabilities/reasoning
status: active
supportedModes:
    - chat
thinking: true
