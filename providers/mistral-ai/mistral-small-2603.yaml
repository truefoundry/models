costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 256000
modalities:
    input:
        - text
        - image
        - audio
        - pdf
    output:
        - text
mode: chat
model: mistral-small-2603
sources:
    - https://docs.mistral.ai/models/mistral-small-4-0-26-03
