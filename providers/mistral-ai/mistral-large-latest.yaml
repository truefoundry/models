costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_token: 0.0000015
      output_cost_per_token_batches: 7.5e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
    - prompt_caching
    - system_messages
    - tool_choice
    - assistant_prefill
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
        - pdf
        - doc
    output:
        - text
mode: chat
model: mistral-large-latest
params:
    - defaultValue: 0.3
      key: temperature
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.mistral.ai/models/mistral-large-3-25-12
    - https://docs.mistral.ai/studio-api/conversations/advanced/prompt-caching
status: active
supportedModes:
    - chat
