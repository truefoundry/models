costs:
    - input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 256000
    max_input_tokens: 256000
    max_output_tokens: 256000
    max_tokens: 256000
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
mode: chat
model: mistral-large-latest
params:
    - defaultValue: 256000
      key: max_tokens
      maxValue: 256000
      minValue: 1
sources:
    - https://docs.mistral.ai/models/mistral-large-3-25-12
supportedModes:
    - chat
