model: mistral-large-latest
costs:
    - region: "*"
      input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000015
limits:
    max_tokens: 4096
    max_input_tokens: 128000
    max_output_tokens: 128000
features:
    [
        function_calling,
        vision,
        chat,
        tool_choice,
        response_schema,
        assistant_prefill,
    ]
mode: chat
