canonical_model: mistral/ministral-3b
costs:
    - input_cost_per_token: 1e-7
      input_cost_per_token_batches: 5e-8
      output_cost_per_token: 1e-7
      output_cost_per_token_batches: 5e-8
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - json_output
    - tool_choice
    - system_messages
    - assistant_prefill
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: ministral-3b-latest
params:
    - defaultValue: 0.3
      key: temperature
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.mistral.ai/models/ministral-3-3b-25-12
status: active
supportedModes:
    - chat
