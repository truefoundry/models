costs:
    - input_cost_per_token: 4e-7
      input_cost_per_token_batches: 2e-7
      output_cost_per_token: 0.000002
      output_cost_per_token_batches: 0.000001
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
    - tool_choice
limits:
    context_window: 131072
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: mistral-medium-latest
params:
    - defaultValue: 0.3
      key: temperature
provisioning: serverless
sources:
    - https://docs.mistral.ai/models/mistral-medium-3-1-25-08
status: active
supportedModes:
    - chat
