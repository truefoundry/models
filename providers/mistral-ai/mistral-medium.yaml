model: mistral-medium
costs:
  - region: '*'
    input_cost_per_token: 0.0000027
    output_cost_per_token: 0.0000081
limits:
  max_input_tokens: 32000
  max_output_tokens: 8191
features: [chat, tool_choice, response_schema, assistant_prefill]
params:
  - key: max_tokens
    maxValue: 32768
mode: chat
