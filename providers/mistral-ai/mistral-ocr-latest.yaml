costs:
    - input_cost_per_annotated_page: 0.005
      input_cost_per_page: 0.004
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
limits:
    context_window: 16384
modalities:
    input:
        - text
        - image
        - pdf
        - doc
    output:
        - text
mode: unknown # ocr is the correct mode, but is not supported yet
model: mistral-ocr-latest
params:
    - defaultValue: 0
      key: temperature
sources:
    - https://docs.mistral.ai/models/ocr-3-25-12
    - https://docs.mistral.ai/capabilities/document_ai/basic_ocr
    - https://docs.mistral.ai/api/endpoint/ocr
    - https://mistral.ai/pricing/api
status: active
