    - function_calling
    - vision
    - image_input
    - system_messages
    - response_schema
    - tool_choice
    - pdf
    - doc
limits:
    context_window: 128000
mode: chat
model: mistral-large-pixtral-2411
sources:
    - https://docs.mistral.ai/models/pixtral-large-24-11
