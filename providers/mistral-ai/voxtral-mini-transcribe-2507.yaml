costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - audio_input
    - text
limits:
    context_window: 40000
model: voxtral-mini-transcribe-2507
removeParams:
    - max_tokens
    - temperature
    - top_p
    - seed
    - stop
    - safe_prompt
    - stream
sources:
    - https://docs.mistral.ai/capabilities/audio_transcription/offline_transcription
