costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: "*"
features:
    - function_calling
    - prompt_caching
limits:
    context_window: 256000
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: mistral-code-fim-latest
params:
    - defaultValue: 0.3
      key: temperature
removeParams:
    - reasoning_effort
sources:
    - https://docs.mistral.ai/api/endpoint/fim
status: active
supportedModes:
    - completion
    - chat
