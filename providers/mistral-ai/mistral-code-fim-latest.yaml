costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
limits:
    context_window: 256000
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: mistral-code-fim-latest
params:
    - defaultValue: 0.3
      key: temperature
removeParams:
    - reasoning_effort
sources:
    - https://docs.mistral.ai/api/endpoint/fim
    - https://docs.mistral.ai/models/codestral
status: active
supportedModes:
    - completion
    - chat
