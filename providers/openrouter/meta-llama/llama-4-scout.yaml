costs:
    - input_cost_per_token: 8.e-8
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - tool_choice
    - tools
    - response_schema
limits:
    context_window: 327680
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
        - code
    output:
        - text
        - code
mode: chat
model: meta-llama/llama-4-scout
sources:
    - https://openrouter.ai/meta-llama/llama-4-scout/api
