costs:
    - input_cost_per_token: 8.e-8
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 327680
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta-llama/llama-4-scout
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-4-scout/api
