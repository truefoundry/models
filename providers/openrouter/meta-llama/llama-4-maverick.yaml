costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - system_messages
    - structured_output
limits:
    context_window: 1048576
    max_output_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta-llama/llama-4-maverick
sources:
    - https://openrouter.ai/meta-llama/llama-4-maverick/api
