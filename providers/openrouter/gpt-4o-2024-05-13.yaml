costs:
    - input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - vision
    - image_input
    - tool_choice
    - response_schema
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-4o-2024-05-13
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-4o-2024-05-13/api
