modalities:
    input:
        - text
    output:
        - text
mode: chat
model: meta-llama/llama-3.1-70b-instruct
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-3.1-70b-instruct/api
