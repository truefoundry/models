costs:
    - input_cost_per_token: 5.1e-8
      output_cost_per_token: 3.4e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - tools
limits:
    context_window: 80000
mode: completion
model: llama-3.2-3b-instruct
params:
    - key: max_tokens
      maxValue: 20000
sources:
    - https://openrouter.ai/meta-llama/llama-3.2-3b-instruct/api
