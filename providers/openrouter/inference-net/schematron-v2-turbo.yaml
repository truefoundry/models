costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 3e-8
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inference-net/schematron-v2-turbo
provisioning: serverless
sources:
    - https://openrouter.ai/inference-net/schematron-v2-turbo
supportedModes:
    - chat
