costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000004
      region: "*"
features:
    - function_calling
    - tools
    - tool_choice
    - structured_output
limits:
    context_window: 16385
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-3.5-turbo-16k
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo-16k/api
