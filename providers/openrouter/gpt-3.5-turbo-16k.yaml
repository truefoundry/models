costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000004
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - response_schema
limits:
    context_window: 16385
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-3.5-turbo-16k
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo-16k/api
