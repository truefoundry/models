costs:
    - input_cost_per_token: 6.e-8
      output_cost_per_token: 2.4e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 300000
    max_input_tokens: 294880
    max_output_tokens: 5120
    max_tokens: 5120
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: amazon/nova-lite-v1
params:
    - key: top_k
sources:
    - https://openrouter.ai/amazon/nova-lite-v1/api
