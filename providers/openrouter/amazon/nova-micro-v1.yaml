costs:
    - input_cost_per_token: 3.5e-8
      output_cost_per_token: 1.4e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 5120
    max_tokens: 5120
mode: completion
model: amazon/nova-micro-v1
sources:
    - https://openrouter.ai/amazon/nova-micro-v1/api
