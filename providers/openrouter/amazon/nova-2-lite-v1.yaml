costs:
    - input_cost_per_token: 3.e-7
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - function_calling
    - tool_choice
    - tools
limits:
    context_window: 1000000
    max_output_tokens: 65535
    max_tokens: 65535
modalities:
    input:
        - text
        - image
        - video
        - pdf
    output:
        - text
mode: chat
model: amazon/nova-2-lite-v1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 65535
      minValue: 1
sources:
    - https://openrouter.ai/amazon/nova-2-lite-v1/api
thinking: true
