costs:
    - input_cost_per_token: 8.e-7
      output_cost_per_token: 0.0000032
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - text
    - system_messages
    - tool_choice
limits:
    context_window: 300000
    max_input_tokens: 294880
    max_output_tokens: 5120
    max_tokens: 5120
mode: chat
model: amazon/nova-pro-v1
sources:
    - https://openrouter.ai/amazon/nova-pro-v1/api
