costs:
    - input_cost_per_token: 2.e-8
      output_cost_per_token: 4.e-8
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
limits:
    context_window: 131072
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: mistral-nemo
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
sources:
    - https://openrouter.ai/mistralai/mistral-nemo/api
