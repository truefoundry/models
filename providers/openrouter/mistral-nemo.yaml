costs:
    - input_cost_per_token: 2.e-8
      output_cost_per_token: 4.e-8
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - structured_output
limits:
    context_window: 131072
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistral-nemo
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/mistralai/mistral-nemo/api
