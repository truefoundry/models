canonical_model: zai/glm-5-3-prime
costs:
    - cache_read_input_token_cost: 5.6e-7
      input_cost_per_token: 2.8e-6
      output_cost_per_token: 8.8e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.3-prime
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.3-prime
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
