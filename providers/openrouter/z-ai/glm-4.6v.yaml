costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
    - system_messages
limits:
    context_window: 131072
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - image
        - text
        - video
    output:
        - text
mode: chat
model: z-ai/glm-4.6v
params:
    - defaultValue: 0.6
      key: top_p
    - defaultValue: 128
      key: max_tokens
      maxValue: 131072
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-4.6v
    - https://openrouter.ai/z-ai/glm-4.6v/api
status: active
supportedModes:
    - chat
thinking: true
