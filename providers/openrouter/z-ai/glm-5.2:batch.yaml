costs:
    - cache_read_input_token_cost: 1.3e-7
      input_cost_per_token: 7e-7
      output_cost_per_token: 2.2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 512000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.2:batch
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.2:batch
status: active
supportedModes:
    - chat
thinking: true
