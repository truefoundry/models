costs:
    - cache_read_input_token_cost: 1.69e-7
      input_cost_per_token: 9.1e-7
      output_cost_per_token: 2.86e-6
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1310720
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.3
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.3
supportedModes:
    - chat
thinking: true
