costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 1.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - text
    - tools
limits:
    context_window: 128000
    max_output_tokens: 4095
    max_tokens: 4095
mode: chat
model: z-ai/glm-4-32b
params:
    - defaultValue: 0.75
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 4095
      key: max_tokens
      maxValue: 4095
      minValue: 1
removeParams:
    - stop
    - "n"
    - frequency_penalty
    - presence_penalty
    - response_format
sources:
    - https://openrouter.ai/z-ai/glm-4-32b/api
