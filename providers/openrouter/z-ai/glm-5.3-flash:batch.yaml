canonical_model: zai/glm-5-3-flash:batch
costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 943717
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: z-ai/glm-5.3-flash:batch
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.3-flash:batch
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
