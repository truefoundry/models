costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
limits:
    context_window: 128000
    max_output_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.2:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
thinking: true
