costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 256000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.2:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.2
status: active
supportedModes:
    - chat
thinking: true
