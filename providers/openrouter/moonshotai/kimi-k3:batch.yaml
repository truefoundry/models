canonical_model: kimi/kimi-k3:batch
costs:
    - cache_read_input_token_cost: 3e-7
      input_cost_per_token: 3e-6
      output_cost_per_token: 1.5e-5
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 943718
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: moonshotai/kimi-k3:batch
params:
    - defaultValue: 0.95
      key: top_p
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/moonshotai/kimi-k3:batch
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
