costs:
    - input_cost_per_token: 2.5e-7
      output_cost_per_token: 0.000001
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - tool_choice
    - response_schema
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: mercury-coder
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
sources:
    - https://openrouter.ai/inception/mercury-coder/api
