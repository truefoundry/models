costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: mercury-coder
sources:
    - https://openrouter.ai/inception/mercury-coder-small-beta/api
