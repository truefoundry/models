costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 7.4e-7
      output_cost_per_token: 3.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: ~moonshotai/kimi-latest
sources:
    - https://openrouter.ai/~moonshotai/kimi-latest
supportedModes:
    - chat
thinking: true
