costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 192000
    max_output_tokens: 64000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: cohere/command-a-plus
provisioning: serverless
sources:
    - https://openrouter.ai/cohere/command-a-plus
status: active
supportedModes:
    - chat
thinking: true
