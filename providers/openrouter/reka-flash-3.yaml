costs:
    - input_cost_per_image: 0.01
      input_cost_per_token: 8e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    max_output_tokens: 4096
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: reka-flash-3
params:
    - defaultValue: 0.4
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 1024
      key: top_k
pricing:
    - standard:
          - input_cost_per_image: 0.01
            input_cost_per_token: 8e-7
            output_cost_per_token: 0.000002
            region: "*"
sources:
    - https://openrouter.ai/reka-ai/reka-flash-3/api
    - https://docs.reka.ai/pricing
    - https://docs.reka.ai/chat/models
    - https://docs.reka.ai/chat/api-reference/create
status: deprecated
