costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 80000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: arcee-ai/trinity-large-thinking:free
params:
    - defaultValue: 0.3
      key: temperature
    - defaultValue: 0.8
      key: top_p
thinking: true
