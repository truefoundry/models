costs:
    - cache_read_input_token_cost: 6.e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 9.e-7
      region: "*"
limits:
    context_window: 262144
    max_output_tokens: 80000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: arcee-ai/trinity-large-thinking
params:
    - defaultValue: 0.3
      key: temperature
    - defaultValue: 0.8
      key: top_p
