costs:
    - cache_read_input_token_cost: 6e-8
      input_cost_per_token: 2.2e-7
      output_cost_per_token: 8.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: arcee-ai/trinity-large-thinking
params:
    - defaultValue: 0.3
      key: temperature
    - defaultValue: 0.8
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/arcee-ai/trinity-large-thinking
status: active
supportedModes:
    - chat
thinking: true
