costs:
    - cache_creation_input_token_cost: 1.875e-6
      cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 1.5e-6
      output_cost_per_token: 7.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-sonnet-4.6:batch
thinking: true
