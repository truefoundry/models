costs:
    - cache_creation_input_token_cost: 6.25e-7
      cache_read_input_token_cost: 5e-8
      input_cost_per_token: 5e-7
      output_cost_per_token: 2.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-haiku-4.5:batch
thinking: true
