costs:
    - cache_creation_input_token_cost: 6.25e-8
      cache_read_input_token_cost: 5e-9
      input_cost_per_token: 5e-8
      output_cost_per_token: 2.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-haiku-5.5:batch
thinking: true
