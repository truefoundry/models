        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-fable-5:batch
provisioning: serverless
sources:
    - https://openrouter.ai/anthropic/claude-fable-5:batch
status: active
supportedModes:
    - chat
thinking: true
