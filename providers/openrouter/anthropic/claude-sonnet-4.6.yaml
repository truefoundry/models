costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 3.e-7
      input_cost_per_query: 0.01
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 6.e-7
                from: 200000
          cache_write:
              - cost_per_token: 0.0000075
                from: 200000
          input:
              - cost_per_token: 0.000006
                from: 200000
          output:
              - cost_per_token: 0.0000225
                from: 200000
features:
    - chat
    - function_calling
    - vision
    - image_input
    - tool_choice
    - response_schema
    - system_messages
    - tools
    - text
    - code
    - prompt_caching
    - cache_control
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: anthropic/claude-sonnet-4.6
sources:
    - https://openrouter.ai/anthropic/claude-sonnet-4.6/api
thinking: true
