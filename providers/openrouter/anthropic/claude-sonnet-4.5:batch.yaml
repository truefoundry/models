costs:
    - cache_creation_input_token_cost: 1.875e-6
      cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 1.5e-6
      output_cost_per_token: 7.5e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 3e-7
                from: 200000
          cache_write:
              - cost_per_token: 3.75e-6
                from: 200000
          input:
              - cost_per_token: 3e-6
                from: 200000
          output:
              - cost_per_token: 1.125e-5
                from: 200000
          pricing_mode: marginal
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-sonnet-4.5:batch
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 1
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/anthropic/claude-sonnet-4.5:batch
supportedModes:
    - chat
thinking: true
