costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 6e-7
                from: 200000
          cache_write:
              - cost_per_token: 0.0000075
                from: 200000
          input:
              - cost_per_token: 0.000006
                from: 200000
          output:
              - cost_per_token: 0.0000225
                from: 200000
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: anthropic/claude-sonnet-4.5
provisioning: serverless
sources:
    - https://openrouter.ai/anthropic/claude-sonnet-4.5/api
    - https://openrouter.ai/anthropic/claude-sonnet-4.5
status: active
supportedModes:
    - chat
thinking: true
