costs:
    - cache_creation_input_token_cost: 0.00000125
      cache_read_input_token_cost: 1.e-7
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: anthropic/claude-haiku-4.5
params:
    - key: max_tokens
      maxValue: 64000
provisioning: serverless
sources:
    - https://openrouter.ai/anthropic/claude-haiku-4.5/api
    - https://openrouter.ai/anthropic/claude-haiku-4.5
supportedModes:
    - chat
thinking: true
