costs:
    - input_cost_per_token: 3.75e-8
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - function_calling
    - system_messages
limits:
    context_window: 1000000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gemini-flash-1.5-8b
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemini-flash-1.5-8b/api
