costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 5e-7
      output_cost_per_token: 2.5e-6
      region: "*"
features:
    - prompt_caching
    - system_messages
    - cache_control
limits:
    context_window: 262144
    max_output_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: nex-agi/nex-n2-pro
params:
    - defaultValue: 0.7
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 40
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/nex-agi/nex-n2-pro
status: active
supportedModes:
    - chat
thinking: true
