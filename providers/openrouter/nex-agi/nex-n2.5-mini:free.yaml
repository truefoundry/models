      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 40
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/nex-agi/nex-n2.5-mini:free
status: active
supportedModes:
    - chat
thinking: true
