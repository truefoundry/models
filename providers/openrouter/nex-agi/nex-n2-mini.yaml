costs:
    - cache_read_input_token_cost: 2.5e-9
      input_cost_per_token: 2.5e-8
      output_cost_per_token: 1e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
isDeprecated: true
limits:
    context_window: 262144
    max_output_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: nex-agi/nex-n2-mini
params:
    - defaultValue: 0.7
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 40
      key: top_k
provisioning: serverless
retirementDate: "2026-09-08"
sources:
    - https://openrouter.ai/nex-agi/nex-n2-mini
status: active
supportedModes:
    - chat
thinking: true
