costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 7.5e-8
      output_cost_per_token: 2.5e-7
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 235929
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: nex-agi/nex-n2.5-pro
params:
    - defaultValue: 0.7
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 40
      key: top_k
thinking: true
