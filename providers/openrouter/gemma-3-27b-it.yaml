costs:
    - input_cost_per_token: 3.e-8
      output_cost_per_token: 1.1e-7
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tool_choice
    - tools
    - response_schema
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 65536
    max_tokens: 65536
mode: chat
model: gemma-3-27b-it
params:
    - key: max_tokens
      maxValue: 65536
sources:
    - https://openrouter.ai/google/gemma-3-27b-it/api
