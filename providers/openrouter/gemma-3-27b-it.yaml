costs:
    - input_cost_per_token: 4.e-8
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - chat
    - vision
    - function_calling
    - response_schema
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 65536
    max_tokens: 65536
mode: chat
model: gemma-3-27b-it
params:
    - key: max_tokens
      maxValue: 65536
sources:
    - https://openrouter.ai/google/gemma-3-27b-it/api
