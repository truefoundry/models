costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - response_schema
    - system_messages
limits:
    context_window: 256000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: jamba-1.6-large
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/ai21/jamba-1.6-large
    - https://docs.ai21.com/reference/jamba-1-6-api-ref
