costs:
    - input_cost_per_token: 0.000001875
      output_cost_per_token: 0.000005625
      region: "*"
features:
    - chat
    - vision
    - image_input
    - tools
    - function_calling
limits:
    context_window: 2000000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gemini-pro-1.5
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemini-pro-1.5/api
    - https://openrouter.ai/google/gemini-pro-1.5
    - https://ai.google.dev/gemini-api/docs/models
