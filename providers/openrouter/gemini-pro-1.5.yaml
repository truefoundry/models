costs:
    - input_cost_per_token: 0.00000125
      output_cost_per_token: 0.000005
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.0000025
                from: 128000
          output:
              - cost_per_token: 0.00001
                from: 128000
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tools
    - tool_choice
    - system_messages
    - response_schema
    - text
    - code
limits:
    context_window: 2000000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gemini-pro-1.5
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemini-pro-1.5/api
