canonical_model: elorian/glimpse
costs:
    - cache_read_input_token_cost: 6e-8
      input_cost_per_token: 6e-7
      output_cost_per_token: 3e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 256000
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: elorian/glimpse
provisioning: serverless
sources:
    - https://openrouter.ai/elorian/glimpse
supportedModes:
    - chat
thinking: true
