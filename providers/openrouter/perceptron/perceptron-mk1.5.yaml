costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 1.5e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
limits:
    context_window: 36864
    max_output_tokens: 8192
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
mode: chat
model: perceptron/perceptron-mk1.5
provisioning: serverless
sources:
    - https://openrouter.ai/perceptron/perceptron-mk1.5
supportedModes:
    - chat
thinking: true
