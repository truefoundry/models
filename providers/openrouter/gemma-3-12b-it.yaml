costs:
    - input_cost_per_token: 4.e-8
      output_cost_per_token: 1.3e-7
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tool_choice
    - response_schema
limits:
    context_window: 131072
mode: chat
model: gemma-3-12b-it
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemma-3-12b-it/api
