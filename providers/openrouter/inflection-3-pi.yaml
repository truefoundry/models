costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - chat
    - tool_choice
limits:
    context_window: 8000
    max_output_tokens: 1024
    max_tokens: 1024
mode: completion
model: inflection-3-pi
params:
    - key: max_tokens
      maxValue: 1024
sources:
    - https://openrouter.ai/inflection/inflection-3-pi/api
