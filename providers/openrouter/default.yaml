documentation:
    - https://openrouter.ai/docs
    - https://openrouter.ai/models
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      skipValues:
          - null
          - []
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: 0
      key: frequency_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: 0
      key: presence_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
      skipValues:
          - null
      type: string
type:
    primary: chat
    supported:
        - tools
        - image
