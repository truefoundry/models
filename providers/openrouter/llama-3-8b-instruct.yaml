costs:
    - input_cost_per_token: 3.e-8
      output_cost_per_token: 4.e-8
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - structured_output
    - json_output
limits:
    context_window: 8192
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: llama-3-8b-instruct
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-3-8b-instruct/api
