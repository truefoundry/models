    max_input_tokens: 30720
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: qwen-max
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/qwen/qwen-max/api
