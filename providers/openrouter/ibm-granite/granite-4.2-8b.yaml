costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 131072
    max_output_tokens: 117964
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ibm-granite/granite-4.2-8b
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
thinking: true
