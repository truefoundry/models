costs:
    - cache_read_input_token_cost: 6e-9
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 384000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: deepseek/deepseek-v4.1-flash
provisioning: serverless
sources:
    - https://openrouter.ai/deepseek/deepseek-v4.1-flash
supportedModes:
    - chat
thinking: true
