costs:
    - cache_read_input_token_cost: 1.45e-7
      input_cost_per_token: 1.74e-6
      output_cost_per_token: 3.48e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 384000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek/deepseek-v4-pro
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 1
      key: top_p
thinking: true
