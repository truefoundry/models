costs:
    - input_cost_per_token: 7e-7
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 64000
    max_output_tokens: 16000
    max_tokens: 16000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek/deepseek-r1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16000
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/deepseek/deepseek-r1/api
    - https://openrouter.ai/deepseek/deepseek-r1
supportedModes:
    - chat
thinking: true
