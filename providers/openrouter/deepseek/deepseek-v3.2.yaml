costs:
    - cache_read_input_token_cost: 2.52e-8
      input_cost_per_token: 2.52e-7
      output_cost_per_token: 3.78e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 163840
    max_input_tokens: 163840
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek/deepseek-v3.2
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/deepseek/deepseek-v3.2/api
    - https://openrouter.ai/deepseek/deepseek-v3.2
    - https://api-docs.deepseek.com/quick_start/pricing
status: active
supportedModes:
    - chat
thinking: true
