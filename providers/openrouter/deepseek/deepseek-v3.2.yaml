costs:
    - input_cost_per_token: 2.6e-7
      output_cost_per_token: 3.8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 163840
    max_input_tokens: 163840
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek/deepseek-v3.2
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
sources:
    - https://openrouter.ai/deepseek/deepseek-v3.2/api
    - https://api-docs.deepseek.com/quick_start/pricing
thinking: true
