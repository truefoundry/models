costs:
    - cache_read_input_token_cost: 7e-9
      input_cost_per_token: 2.2e-7
      output_cost_per_token: 6.6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 384000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: deepseek/deepseek-v4-flash-vision-exp
thinking: true
