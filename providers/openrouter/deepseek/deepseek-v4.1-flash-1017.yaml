costs:
    - cache_read_input_token_cost: 3e-9
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 393216
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: deepseek/deepseek-v4.1-flash-1017
thinking: true
