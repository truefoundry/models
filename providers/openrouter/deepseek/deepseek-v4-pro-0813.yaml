costs:
    - cache_read_input_token_cost: 3.625e-9
      input_cost_per_token: 4.35e-7
      output_cost_per_token: 8.7e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 384000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek/deepseek-v4-pro-0813
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 1
      key: top_p
thinking: true
