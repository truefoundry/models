costs:
    - cache_read_input_token_cost: 0.0000075
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.00006
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tools
    - tool_choice
    - response_schema
    - text
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: o1
params:
    - key: max_tokens
      maxValue: 100000
sources:
    - https://openrouter.ai/openai/o1/api
thinking: false
