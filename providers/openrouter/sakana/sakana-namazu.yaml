costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 9.5e-7
      output_cost_per_token: 4e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: sakana/sakana-namazu
thinking: true
