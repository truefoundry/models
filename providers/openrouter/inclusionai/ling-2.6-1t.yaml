costs:
    - cache_read_input_token_cost: 6e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 2.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inclusionai/ling-2.6-1t
