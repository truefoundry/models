costs:
    - cache_read_input_token_cost: 1.2e-8
      input_cost_per_token: 6e-8
      output_cost_per_token: 1.8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 235929
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inclusionai/ling-3.0-flash-fin
thinking: true
