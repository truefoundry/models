costs:
    - cache_read_input_token_cost: 1.2e-8
      input_cost_per_token: 6e-8
      output_cost_per_token: 1.8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 131072
    max_output_tokens: 32768
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: inclusionai/ling-3.0-flash-vl
thinking: true
