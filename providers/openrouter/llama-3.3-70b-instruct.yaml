costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.2e-7
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - tool_choice
    - response_schema
limits:
    context_window: 131072
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: llama-3.3-70b-instruct
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-3.3-70b-instruct/api
