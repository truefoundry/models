features:
    - tools
limits:
    context_window: 1000000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gemini-flash-1.5
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemini-flash-1.5/api
