costs:
    - input_cost_per_token: 3.9e-7
      output_cost_per_token: 9.7e-7
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 235929
modalities:
    input:
        - image
        - text
        - video
    output:
        - text
mode: chat
model: google/gemma-4-31b-it:batch
params:
