      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/google/gemma-4-31b-it:batch
supportedModes:
    - chat
thinking: true
