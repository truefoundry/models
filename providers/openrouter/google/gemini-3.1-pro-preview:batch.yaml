costs:
    - input_cost_per_image: 1e-6
      input_cost_per_token: 1e-6
      output_cost_per_token: 6e-6
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 65536
modalities:
    input:
        - audio
        - pdf
        - image
        - text
        - video
    output:
        - text
mode: chat
model: google/gemini-3.1-pro-preview:batch
provisioning: serverless
sources:
    - https://openrouter.ai/google/gemini-3.1-pro-preview:batch
supportedModes:
    - chat
thinking: true
