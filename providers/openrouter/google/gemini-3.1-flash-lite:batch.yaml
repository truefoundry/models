costs:
    - cache_read_input_token_cost: 1.25e-8
      input_cost_per_image: 1.25e-7
      input_cost_per_token: 1.25e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - pdf
        - audio
    output:
        - text
mode: chat
model: google/gemini-3.1-flash-lite:batch
thinking: true
