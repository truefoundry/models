model: google/gemini-2.5-pro
costs:
    - region: "*"
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      input_cost_per_audio_token: 7.e-7
limits:
    max_tokens: 8192
    max_input_tokens: 1048576
    max_output_tokens: 8192
features:
    [
        function_calling,
        vision,
        audio_output,
        system_messages,
        tool_choice,
        response_schema,
    ]
mode: chat
