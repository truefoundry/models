costs:
    - cache_creation_input_token_cost: 3.75e-7
      cache_creation_input_token_cost_per_hour: 0.0000045
      cache_read_input_token_cost: 1.25e-7
      input_cost_per_audio_token: 0.00000125
      input_cost_per_image_token: 0.00000125
      input_cost_per_token: 0.00000125
      input_cost_per_video_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2.5e-7
                from: 200000
          cache_write:
              - cost_per_token: 7.5e-7
                from: 200000
          input:
              - cost_per_token: 0.0000025
                from: 200000
          output:
              - cost_per_token: 0.000015
                from: 200000
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - pdf
        - audio
        - video
    output:
        - text
mode: chat
model: google/gemini-2.5-pro
params:
    - key: max_tokens
      maxValue: 65536
provisioning: serverless
sources:
    - https://openrouter.ai/google/gemini-2.5-pro
    - https://openrouter.ai/google/gemini-2.5-pro/api
status: active
supportedModes:
    - chat
thinking: true
