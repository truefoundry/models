costs:
    - input_cost_per_token: 1.4e-7
      output_cost_per_token: 4.e-7
      region: "*"
limits:
    context_window: 262144
    max_output_tokens: 131072
modalities:
    input:
        - image
        - text
        - video
    output:
        - text
mode: chat
model: google/gemma-4-31b-it
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
