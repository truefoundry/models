costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - chat
    - system_messages
limits:
    context_window: 8192
    max_output_tokens: 2048
    max_tokens: 2048
mode: chat
model: google/gemma-3n-e4b-it:free
params:
    - defaultValue: 2048
      key: max_tokens
      maxValue: 2048
      minValue: 1
removeParams:
    - "n"
    - response_format
sources:
    - https://openrouter.ai/google/gemma-3n-e4b-it:free/api
