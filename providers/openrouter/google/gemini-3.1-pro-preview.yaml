costs:
    - cache_creation_input_token_cost_per_hour: 0.0000045
      cache_read_input_token_cost: 2e-7
      input_cost_per_audio_token: 0.000002
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000012
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000018
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: google/gemini-3.1-pro-preview
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/google/gemini-3.1-pro-preview
    - https://openrouter.ai/google/gemini-3.1-pro-preview/api
status: preview
supportedModes:
    - chat
thinking: true
