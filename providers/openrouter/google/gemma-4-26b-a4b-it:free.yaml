costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - json_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - image
        - text
        - video
    output:
        - text
mode: chat
model: google/gemma-4-26b-a4b-it:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
thinking: true
