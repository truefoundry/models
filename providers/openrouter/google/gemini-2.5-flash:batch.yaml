costs:
    - cache_read_input_audio_token_cost: 1e-7
      cache_read_input_token_cost: 3e-8
      input_cost_per_audio_token: 5e-7
      input_cost_per_image: 1.5e-7
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 1.25e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 65535
modalities:
    input:
        - pdf
        - image
        - text
        - audio
        - video
    output:
        - text
mode: chat
model: google/gemini-2.5-flash:batch
provisioning: serverless
sources:
    - https://openrouter.ai/google/gemini-2.5-flash:batch
supportedModes:
    - chat
thinking: true
