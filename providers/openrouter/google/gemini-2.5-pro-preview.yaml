    - chat
    - function_calling
    - tool_choice
    - vision
    - image_input
    - audio_input
    - response_schema
    - prompt_caching
    - text
    - code
    - tools
limits:
    context_window: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
mode: chat
model: google/gemini-2.5-pro-preview
params:
