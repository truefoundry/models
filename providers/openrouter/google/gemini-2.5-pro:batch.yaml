costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_image: 6.25e-7
      input_cost_per_token: 6.25e-7
      output_cost_per_token: 5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - pdf
        - audio
        - video
    output:
        - text
mode: chat
model: google/gemini-2.5-pro:batch
thinking: true
