costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - tools
    - function_calling
    - system_messages
limits:
    context_window: 32000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: mistral-small
sources:
    - https://openrouter.ai/mistralai/mistral-small/api
    - https://docs.mistral.ai/getting-started/models/
