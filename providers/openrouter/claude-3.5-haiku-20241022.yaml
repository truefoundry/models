costs:
    - cache_creation_input_token_cost: 0.000001
      cache_read_input_token_cost: 8.e-8
      input_cost_per_token: 8.e-7
      output_cost_per_token: 0.000004
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - image
limits:
    context_window: 200000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: claude-3.5-haiku-20241022
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/anthropic/claude-3.5-haiku-20241022
    - https://openrouter.ai/anthropic/claude-3.5-haiku
    - https://openrouter.ai/anthropic/claude-3-5-haiku-20241022/providers
    - https://openrouter.ai/docs/guides/best-practices/prompt-caching
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/docs/about-claude/models
