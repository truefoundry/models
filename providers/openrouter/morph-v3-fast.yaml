costs:
    - input_cost_per_token: 8.e-7
      output_cost_per_token: 0.0000012
      region: "*"
limits:
    context_window: 81920
    max_input_tokens: 81920
    max_output_tokens: 38000
    max_tokens: 38000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: morph-v3-fast
params:
    - key: max_tokens
      maxValue: 38000
removeParams:
    - top_p
    - "n"
    - response_format
sources:
    - https://openrouter.ai/morph/morph-v3-fast/api
    - https://docs.morphllm.com/quickstart
