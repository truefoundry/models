features:
    - chat
    - tools
    - function_calling
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4000
    max_tokens: 4000
mode: completion
model: command-r
params:
    - key: max_tokens
      maxValue: 4000
sources:
    - https://openrouter.ai/cohere/command-r/api
