costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 2.5e-6
      region: "*"
limits:
    context_window: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: moondream/moondream3.1-9b-a2b
params:
    - defaultValue: 0.2
      key: temperature
    - defaultValue: 0.9
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/moondream/moondream3.1-9b-a2b
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
thinking: true
