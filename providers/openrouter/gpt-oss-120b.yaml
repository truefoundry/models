costs:
    - input_cost_per_token: 3.9e-8
      output_cost_per_token: 1.9e-7
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - response_schema
    - system_messages
    - text
    - code
limits:
    context_window: 131072
    max_output_tokens: 32768
    max_tokens: 32768
mode: chat
model: gpt-oss-120b
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - stream
sources:
    - https://openrouter.ai/openai/gpt-oss-120b
    - https://openrouter.ai/openai/gpt-oss-120b/api
thinking: true
