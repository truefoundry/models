costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
    - text
limits:
    context_window: 128000
    max_input_tokens: 96000
    max_output_tokens: 32000
    max_tokens: 32000
mode: chat
model: inception/mercury
params:
    - defaultValue: 32000
      key: max_tokens
      maxValue: 32000
      minValue: 1
sources:
    - https://openrouter.ai/inception/mercury/api
thinking: false
