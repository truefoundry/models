costs:
    - cache_read_input_token_cost: 4e-9
      input_cost_per_token: 4e-8
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 260000
    max_output_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inception/mercury-2.5-preview
thinking: true
