costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 50000
    max_tokens: 50000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inception/mercury-2
params:
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/inception/mercury-2/api
    - https://openrouter.ai/inception/mercury-2
status: active
supportedModes:
    - chat
thinking: true
