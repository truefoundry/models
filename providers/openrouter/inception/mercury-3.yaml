costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 3.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: inception/mercury-3
provisioning: serverless
sources:
    - https://openrouter.ai/inception/mercury-3
supportedModes:
    - chat
thinking: true
