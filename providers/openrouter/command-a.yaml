costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 256000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: command-a
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://openrouter.ai/cohere/command-a/api
    - https://docs.cohere.com/docs/command-a
status: deprecated
