costs:
    - cache_read_input_token_cost: 4.5e-8
      input_cost_per_token: 9.e-8
      output_cost_per_token: 2.9e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_input_tokens: 262144
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: xiaomi/mimo-v2-flash
params:
    - defaultValue: 65536
      key: max_tokens
      maxValue: 65536
      minValue: 1
sources:
    - https://openrouter.ai/xiaomi/mimo-v2-flash/api
thinking: true
