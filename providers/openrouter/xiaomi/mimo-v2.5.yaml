canonical_model: xiaomi/mimo-v2-5
costs:
    - cache_read_input_token_cost: 8e-8
      input_cost_per_token: 4e-7
      output_cost_per_token: 2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 131072
modalities:
    input:
        - text
        - audio
        - image
        - video
    output:
        - text
mode: chat
model: xiaomi/mimo-v2.5
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/xiaomi/mimo-v2.5
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
