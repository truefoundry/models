costs:
    - cache_read_input_token_cost: 2.e-7
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4.e-7
                from: 256000
          input:
              - cost_per_token: 0.000002
                from: 256000
          output:
              - cost_per_token: 0.000006
                from: 256000
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: xiaomi/mimo-v2-pro
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/xiaomi/mimo-v2-pro/api
    - https://openrouter.ai/xiaomi/mimo-v2-pro
status: active
supportedModes:
    - chat
thinking: true
