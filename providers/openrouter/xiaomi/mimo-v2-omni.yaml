costs:
    - cache_read_input_token_cost: 8.e-8
      input_cost_per_token: 4.e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - code_execution
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - audio
        - image
        - video
    output:
        - text
mode: chat
model: xiaomi/mimo-v2-omni
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/xiaomi/mimo-v2-omni
    - https://openrouter.ai/xiaomi/mimo-v2-omni/api
status: active
supportedModes:
    - chat
thinking: true
