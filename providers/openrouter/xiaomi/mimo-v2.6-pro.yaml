costs:
    - cache_read_input_token_cost: 3.6e-9
      input_cost_per_token: 4.35e-7
      output_cost_per_token: 8.7e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
mode: chat
model: xiaomi/mimo-v2.6-pro
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/xiaomi/mimo-v2.6-pro
supportedModes:
    - chat
thinking: true
