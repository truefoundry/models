costs:
    - cache_read_input_token_cost: 7e-8
      input_cost_per_token: 6.8e-7
      output_cost_per_token: 2.09e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 524288
    max_output_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: mistralai/mistral-large-4-0
provisioning: serverless
sources:
    - https://openrouter.ai/mistralai/mistral-large-4-0
supportedModes:
    - chat
