canonical_model: mistral/mistral-large-4-0
costs:
    - cache_read_input_token_cost: 7e-8
      input_cost_per_token: 6.8e-7
      output_cost_per_token: 2.09e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: mistralai/mistral-large-4-0
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - high
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/mistralai/mistral-large-4-0
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
thinking: true
