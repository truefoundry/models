      output_cost_per_token: 5.4e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 32768
    max_input_tokens: 32768
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: mistralai/mixtral-8x7b-instruct
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
sources:
    - https://openrouter.ai/mistralai/mixtral-8x7b-instruct/api
