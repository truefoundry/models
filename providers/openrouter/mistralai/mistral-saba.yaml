costs:
    - cache_read_input_token_cost: 2.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistralai/mistral-saba
sources:
    - https://openrouter.ai/mistralai/mistral-saba/api
