costs:
    - input_cost_per_token: 2.e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
    - tools
limits:
    context_window: 32768
    max_tokens: 32768
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: mistralai/mistral-saba
sources:
    - https://openrouter.ai/mistralai/mistral-saba/api
