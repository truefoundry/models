costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - system_messages
    - text
    - code
limits:
    context_window: 32768
    max_output_tokens: 32768
    max_tokens: 32768
mode: chat
model: mistralai/mistral-small-creative
sources:
    - https://openrouter.ai/mistralai/mistral-small-creative/api
