costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 204800
modalities:
    input:
        - text
        - pdf
    output:
        - text
mode: chat
model: mistralai/codestral-2508:batch
params:
    - defaultValue: 0.3
      key: temperature
