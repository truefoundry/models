costs:
    - input_cost_per_token: 2.e-8
      output_cost_per_token: 4.e-8
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - system_messages
    - tools
    - response_schema
limits:
    context_window: 131072
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: mistralai/mistral-nemo
sources:
    - https://openrouter.ai/mistralai/mistral-nemo/api
