costs:
    - cache_read_input_token_cost: 4e-8
      input_cost_per_token: 4e-7
      output_cost_per_token: 2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 131072
    max_output_tokens: 104857
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: mistralai/mistral-medium-3.1:batch
params:
    - defaultValue: 0.3
      key: temperature
