costs:
    - input_cost_per_token: 3.5e-8
      output_cost_per_token: 1.4e-7
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - system_messages
limits:
    context_window: 128000
    max_input_tokens: 122880
    max_output_tokens: 5120
    max_tokens: 5120
mode: chat
model: nova-micro-v1
params:
    - key: max_tokens
      maxValue: 5120
sources:
    - https://openrouter.ai/amazon/nova-micro-v1/api
