costs:
    - input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 16385
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-3.5-turbo
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo/api
