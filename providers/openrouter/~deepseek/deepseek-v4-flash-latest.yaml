costs:
    - cache_read_input_token_cost: 1.8e-8
      input_cost_per_token: 9e-8
      output_cost_per_token: 1.8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ~deepseek/deepseek-v4-flash-latest
thinking: true
