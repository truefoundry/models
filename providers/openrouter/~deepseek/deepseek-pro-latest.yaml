costs:
    - cache_read_input_token_cost: 2.2e-8
      input_cost_per_token: 6.6e-7
      output_cost_per_token: 1.98e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 384000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ~deepseek/deepseek-pro-latest
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 1
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/~deepseek/deepseek-pro-latest
supportedModes:
    - chat
thinking: true
