costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - parallel_function_calling
    - tools
    - tool_choice
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-4-turbo
sources:
    - https://openrouter.ai/openai/gpt-4-turbo/api
    - https://developers.openai.com/docs/models/gpt-4-turbo
    - https://developers.openai.com/docs/pricing
