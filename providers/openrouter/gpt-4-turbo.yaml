costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - structured_output
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - image
mode: completion
model: gpt-4-turbo
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-4-turbo/api
