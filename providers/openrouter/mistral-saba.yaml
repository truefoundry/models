costs:
    - input_cost_per_token: 2.e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 32768
    max_output_tokens: 4096
    max_tokens: 4096
mode: completion
model: mistral-saba
sources:
    - https://openrouter.ai/mistralai/mistral-saba/api
