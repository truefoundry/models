costs:
    - input_cost_per_token: 6.e-7
      output_cost_per_token: 0.000006
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 1040000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: writer/palmyra-x5
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://openrouter.ai/writer/palmyra-x5/api
