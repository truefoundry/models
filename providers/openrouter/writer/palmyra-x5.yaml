costs:
    - input_cost_per_token: 6.e-7
      output_cost_per_token: 0.000006
      region: "*"
features:
    - chat
    - text
limits:
    context_window: 1040000
    max_input_tokens: 1031808
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: writer/palmyra-x5
params:
    - key: max_tokens
      maxValue: 8192
removeParams:
    - "n"
    - frequency_penalty
    - presence_penalty
    - response_format
sources:
    - https://openrouter.ai/writer/palmyra-x5/api
