costs:
    - input_cost_per_token: 2.e-7
      output_cost_per_token: 0.0000011
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tool_choice
    - text
limits:
    context_window: 1000192
    max_output_tokens: 1000192
    max_tokens: 1000192
mode: chat
model: minimax/minimax-01
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 1000192
      minValue: 1
sources:
    - https://openrouter.ai/minimax/minimax-01/api
