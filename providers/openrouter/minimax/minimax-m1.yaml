costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 0.0000022
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.0000013
                from: 200000
features:
    - chat
    - function_calling
    - tools
    - system_messages
    - text
limits:
    context_window: 1000000
    max_output_tokens: 40000
    max_tokens: 40000
mode: chat
model: minimax/minimax-m1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 40000
      minValue: 1
sources:
    - https://openrouter.ai/minimax/minimax-m1/api
thinking: true
