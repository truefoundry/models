costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 0.0000022
      region: "*"
features:
    - function_calling
    - system_messages
    - tools
limits:
    context_window: 1000000
    max_output_tokens: 40000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: minimax/minimax-m1
sources:
    - https://openrouter.ai/minimax/minimax-m1/api
thinking: true
