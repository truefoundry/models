costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
features:
    - function_calling
    - json_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 943718
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax/minimax-m3:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
thinking: true
