costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 524288
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax/minimax-m3:batch
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m3:batch
supportedModes:
    - chat
thinking: true
