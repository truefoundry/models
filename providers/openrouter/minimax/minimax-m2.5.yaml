costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 0.0000012
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 196608
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: minimax/minimax-m2.5
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: true
      key: reasoning
      type: boolean
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m2.5
    - https://openrouter.ai/minimax/minimax-m2.5/api
status: active
supportedModes:
    - chat
thinking: true
