costs:
    - cache_read_input_token_cost: 6.e-8
      input_cost_per_token: 3.e-7
      output_cost_per_token: 0.0000012
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 204800
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: minimax/minimax-m2.7
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m2.7/api
    - https://openrouter.ai/minimax/minimax-m2.7
status: active
supportedModes:
    - chat
thinking: true
