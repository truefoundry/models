costs:
    - cache_read_input_token_cost: 6e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 1048576
    max_output_tokens: 512000
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax/minimax-m3
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m3
status: active
supportedModes:
    - chat
thinking: true
