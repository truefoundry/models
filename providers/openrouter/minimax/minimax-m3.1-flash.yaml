costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 524288
    max_tokens: 524288
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax/minimax-m3.1-flash
params:
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m3.1-flash
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
thinking: true
