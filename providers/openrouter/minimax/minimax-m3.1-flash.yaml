costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 524288
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax/minimax-m3.1-flash
thinking: true
