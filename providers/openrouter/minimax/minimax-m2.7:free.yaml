costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
features:
    - function_calling
    - json_output
    - tool_choice
limits:
    context_window: 196608
    max_output_tokens: 176947
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: minimax/minimax-m2.7:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/minimax/minimax-m2.7:free
supportedModes:
    - chat
thinking: true
