costs:
    - input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - system_messages
    - response_schema
limits:
    context_window: 8191
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-4
sources:
    - https://openrouter.ai/openai/gpt-4/api
