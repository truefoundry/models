costs:
    - input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - tool_choice
limits:
    context_window: 8191
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-4
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-4/api
