    - tools
    - function_calling
    - tool_choice
    - response_schema
    - code
    - text
    - system_messages
limits:
    context_window: 262144
mode: chat
model: qwen3-coder
sources:
    - https://openrouter.ai/qwen/qwen3-coder/api
