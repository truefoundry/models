canonical_model: xai/grok-4-3:batch
costs:
    - cache_read_input_token_cost: 1.6e-7
      input_cost_per_token: 1e-6
      output_cost_per_token: 2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 900000
    max_tokens: 900000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: x-ai/grok-4.3:batch
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/x-ai/grok-4.3:batch
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
thinking: true
