costs:
    - cache_read_input_token_cost: 5.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 5.e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 4.e-7
                from: 128000
          output:
              - cost_per_token: 0.000001
                from: 128000
features:
    - chat
    - function_calling
    - tool_choice
    - tools
    - response_schema
    - prompt_caching
    - system_messages
limits:
    context_window: 2000000
    max_output_tokens: 30000
    max_tokens: 30000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: x-ai/grok-4.1-fast
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 30000
      minValue: 1
sources:
    - https://openrouter.ai/x-ai/grok-4.1-fast/api
    - https://docs.x.ai/developers/models#models-and-pricing
thinking: true
