costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 5e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 4e-7
                from: 128000
          output:
              - cost_per_token: 0.000001
                from: 128000
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 2000000
    max_output_tokens: 30000
    max_tokens: 30000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: x-ai/grok-4.1-fast
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 30000
      minValue: 1
sources:
    - https://openrouter.ai/x-ai/grok-4.1-fast/api
    - https://docs.x.ai/developers/models#models-and-pricing
supportedModes:
    - chat
thinking: true
