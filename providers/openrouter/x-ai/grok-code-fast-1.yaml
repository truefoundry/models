costs:
    - cache_read_input_token_cost: 2.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - prompt_caching
    - system_messages
    - text
    - code
    - tools
limits:
    context_window: 256000
    max_input_tokens: 246000
    max_output_tokens: 10000
    max_tokens: 10000
mode: chat
model: x-ai/grok-code-fast-1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 10000
      minValue: 1
sources:
    - https://openrouter.ai/x-ai/grok-code-fast-1/api
thinking: true
