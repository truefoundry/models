canonical_model: xai/grok-4-20-multi-agent
costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.000006
      output_cost_per_token_batches: 0.000003
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000012
                from: 200000
          pricing_mode: marginal
features:
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 2000000
    max_output_tokens: 1800000
    max_tokens: 1800000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: x-ai/grok-4.20-multi-agent
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/x-ai/grok-4.20-multi-agent
    - https://openrouter.ai/x-ai/grok-4.20-multi-agent/api
    - https://docs.x.ai/developers/models#models-and-pricing
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
