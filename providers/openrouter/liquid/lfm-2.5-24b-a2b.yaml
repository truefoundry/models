costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 1e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: liquid/lfm-2.5-24b-a2b
params:
    - defaultValue: 0.1
      key: temperature
    - defaultValue: 50
      key: top_k
thinking: true
