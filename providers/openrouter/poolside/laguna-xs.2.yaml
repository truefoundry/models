costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 2e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: poolside/laguna-xs.2
params:
    - defaultValue: 0.7
      key: temperature
    - defaultValue: 0.9
      key: top_p
provisioning: serverless
retirementDate: "2026-07-09"
sources:
    - https://openrouter.ai/poolside/laguna-xs.2
status: active
supportedModes:
    - chat
thinking: true
