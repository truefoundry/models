costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 6e-8
      output_cost_per_token: 1.2e-7
      region: "*"
features:
    - function_calling
    - prompt_caching
    - tool_choice
    - structured_output
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: poolside/laguna-xs-2.1
params:
    - defaultValue: 0.7
      key: temperature
    - defaultValue: 0.9
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/poolside/laguna-xs-2.1
supportedModes:
    - chat
thinking: true
