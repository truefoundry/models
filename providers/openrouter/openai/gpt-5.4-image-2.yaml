canonical_model: openai/gpt-5-4-image-2
costs:
    - cache_read_input_token_cost: 2e-6
      input_cost_per_token: 8e-6
      output_cost_per_token: 1.5e-5
      region: "*"
features:
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - image
        - text
mode: chat
model: openai/gpt-5.4-image-2
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.4-image-2
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
