costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.2
params:
    - defaultValue: 128000
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
sources:
    - https://openrouter.ai/openai/gpt-5.2/api
thinking: true
