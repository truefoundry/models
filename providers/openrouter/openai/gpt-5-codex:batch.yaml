costs:
    - cache_read_input_token_cost: 6.25e-8
      input_cost_per_token: 6.25e-7
      output_cost_per_token: 5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5-codex:batch
thinking: true
