costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 6e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2e-8
                from: 272000
          input:
              - cost_per_token: 2e-7
                from: 272000
          output:
              - cost_per_token: 9e-7
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.6-luna:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.6-luna:batch
status: active
supportedModes:
    - chat
thinking: true
