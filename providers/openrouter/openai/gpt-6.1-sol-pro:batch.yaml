costs:
    - cache_creation_input_token_cost: 1.25e-6
      cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-6
      output_cost_per_token: 5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-6.1-sol-pro:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-6.1-sol-pro:batch
supportedModes:
    - chat
thinking: true
