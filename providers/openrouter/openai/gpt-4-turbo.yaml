costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - system_messages
    - tool_choice
    - response_schema
    - text
    - tools
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: openai/gpt-4-turbo
sources:
    - https://openrouter.ai/openai/gpt-4-turbo/api
