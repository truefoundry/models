costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
    - tools
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: completion
model: openai/gpt-4-turbo
sources:
    - https://openrouter.ai/openai/gpt-4-turbo/api
