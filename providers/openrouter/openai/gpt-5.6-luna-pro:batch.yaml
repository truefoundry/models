costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.6-luna-pro:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.6-luna-pro:batch
supportedModes:
    - chat
thinking: true
