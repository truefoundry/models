costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 300000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.1-codex-mini
params:
