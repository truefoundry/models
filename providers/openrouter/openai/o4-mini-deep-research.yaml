costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/o4-mini-deep-research
params:
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
sources:
    - https://openrouter.ai/openai/o4-mini-deep-research
    - https://openrouter.ai/openai/o4-mini-deep-research/api
status: active
supportedModes:
    - chat
thinking: true
