costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - tools
    - tool_choice
    - system_messages
    - structured_output
    - prompt_caching
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.1
params:
    - defaultValue: medium
      key: reasoning_effort
      type: string
    - defaultValue: null
      key: seed
      type: number
sources:
    - https://openrouter.ai/openai/gpt-5.1/api
thinking: true
