costs:
    - cache_creation_input_token_cost: 2.5e-7
      cache_read_input_token_cost: 2e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.6-luna-pro
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.6-luna-pro
status: active
supportedModes:
    - chat
thinking: true
