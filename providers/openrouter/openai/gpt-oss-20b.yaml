costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 3e-8
      output_cost_per_token: 1.4e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai/gpt-oss-20b
params:
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-oss-20b/api
    - https://openrouter.ai/openai/gpt-oss-20b
status: active
supportedModes:
    - chat
thinking: true
