costs:
    - input_cost_per_token: 0.000006
      output_cost_per_token: 0.000018
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - system_messages
    - tool_choice
    - response_schema
    - text
    - tools
limits:
    context_window: 128000
    max_input_tokens: 64000
    max_output_tokens: 64000
    max_tokens: 64000
mode: chat
model: openai/gpt-4o:extended
sources:
    - https://openrouter.ai/openai/gpt-4o:extended/api
