costs:
    - input_cost_per_token: 0.000006
      output_cost_per_token: 0.000018
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-4o:extended
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 64000
      minValue: 1
sources:
    - https://openrouter.ai/openai/gpt-4o:extended/api
