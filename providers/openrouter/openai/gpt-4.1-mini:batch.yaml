costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1047576
    max_output_tokens: 32768
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-4.1-mini:batch
