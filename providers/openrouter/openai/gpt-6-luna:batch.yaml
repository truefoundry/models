costs:
    - cache_creation_input_token_cost: 6.25e-8
      cache_read_input_token_cost: 5e-9
      input_cost_per_token: 5e-8
      output_cost_per_token: 2.5e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1e-8
                from: 272000
          cache_write:
              - cost_per_token: 1.25e-7
                from: 272000
          input:
              - cost_per_token: 1e-7
                from: 272000
          output:
              - cost_per_token: 3.75e-7
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-6-luna:batch
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-6-luna:batch
status: active
supportedModes:
    - chat
thinking: true
