costs:
    - input_cost_per_token: 5e-6
      output_cost_per_token: 1.5e-5
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-4-turbo:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-4-turbo:batch
supportedModes:
    - chat
