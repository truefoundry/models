costs:
    - cache_read_input_token_cost: 5.e-9
      input_cost_per_token: 5.e-8
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - prompt_caching
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5-nano
sources:
    - https://openrouter.ai/openai/gpt-5-nano/api
thinking: true
