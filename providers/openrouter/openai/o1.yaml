costs:
    - cache_read_input_token_cost: 0.0000075
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.00006
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: openai/o1
