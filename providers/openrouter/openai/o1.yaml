costs:
    - cache_read_input_token_cost: 0.0000075
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.00006
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/o1
params:
    - key: max_tokens
      maxValue: 100000
provisioning: serverless
sources:
    - https://openrouter.ai/openai/o1/api
    - https://openrouter.ai/openai/o1
supportedModes:
    - chat
thinking: true
