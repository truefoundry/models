costs:
    - cache_read_input_token_cost: 1.25e-8
      input_cost_per_token: 1.25e-7
      output_cost_per_token: 1e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5-mini:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5-mini
status: active
supportedModes:
    - chat
thinking: true
