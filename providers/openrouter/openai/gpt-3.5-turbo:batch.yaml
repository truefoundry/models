costs:
    - input_cost_per_token: 2.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 16385
    max_output_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai/gpt-3.5-turbo:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo:batch
supportedModes:
    - chat
