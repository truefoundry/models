costs:
    - input_cost_per_token: 1e-5
      output_cost_per_token: 4e-5
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 100000
modalities:
    input:
        - text
        - pdf
        - image
    output:
        - text
mode: chat
model: openai/o3-pro:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/o3-pro
supportedModes:
    - chat
    - completion
thinking: true
