costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: openai/gpt-4-1106-preview
sources:
    - https://openrouter.ai/openai/gpt-4-1106-preview/api
