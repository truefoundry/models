costs:
    - cache_creation_input_token_cost: 1.25e-5
      cache_read_input_token_cost: 1e-6
      input_cost_per_token: 1e-5
      output_cost_per_token: 5e-5
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-6-astra
thinking: true
