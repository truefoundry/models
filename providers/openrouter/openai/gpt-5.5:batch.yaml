costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 2.5e-6
      output_cost_per_token: 1.5e-5
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-7
                from: 272000
          input:
              - cost_per_token: 5e-6
                from: 272000
          output:
              - cost_per_token: 2.25e-5
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.5:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.5:batch
supportedModes:
    - chat
thinking: true
