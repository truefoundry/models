canonical_model: openai/gpt-5-1-codex-max
costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.1-codex-max
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.1-codex-max/api
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
