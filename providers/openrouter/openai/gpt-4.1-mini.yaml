costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 4e-7
      output_cost_per_token: 0.0000016
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1047576
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-4.1-mini
params:
    - key: max_tokens
      maxValue: 32768
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-4.1-mini/api
status: active
supportedModes:
    - chat
