costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 1.e-7
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1047576
    max_input_tokens: 1047576
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-4.1-nano
params:
    - defaultValue: 32768
      key: max_tokens
      maxValue: 32768
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-4.1-nano
    - https://openrouter.ai/openai/gpt-4.1-nano/api
supportedModes:
    - chat
