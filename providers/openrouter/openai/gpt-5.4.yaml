costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.4
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
sources:
    - https://openrouter.ai/openai/gpt-5.4/api
thinking: true
