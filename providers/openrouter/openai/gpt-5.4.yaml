costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.4
sources:
    - https://openrouter.ai/openai/gpt-5.4/api
thinking: true
