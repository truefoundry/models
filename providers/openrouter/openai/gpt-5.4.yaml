costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.000015
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-7
                from: 272000
          input:
              - cost_per_token: 0.000005
                from: 272000
          output:
              - cost_per_token: 0.0000225
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-5.4
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.4/api
status: active
supportedModes:
    - chat
thinking: true
