costs:
    - input_cost_per_token: 1.5e-5
      output_cost_per_token: 9e-5
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.4-pro:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-5.4-pro
supportedModes:
    - chat
thinking: true
