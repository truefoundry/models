costs:
    - input_cost_per_token: 1.05e-5
      output_cost_per_token: 8.4e-5
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.2-pro:batch
thinking: true
