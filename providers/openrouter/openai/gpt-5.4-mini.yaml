costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 7.5e-7
      output_cost_per_token: 0.0000045
      region: "*"
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
    - tools
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.4-mini
params:
    - key: max_tokens
      maxValue: 128000
    - key: reasoning_effort
      type: string
sources:
    - https://openrouter.ai/openai/gpt-5.4-mini/api
status: active
thinking: true
