costs:
    - cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 0.0000011
      output_cost_per_token: 0.0000044
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - tool_choice
    - response_schema
    - system_messages
    - tools
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: openai/o4-mini-high
params:
    - defaultValue: 1
      key: temperature
      maxValue: 1
      minValue: 1
removeParams:
    - top_p
    - frequency_penalty
    - presence_penalty
sources:
    - https://openrouter.ai/openai/o4-mini-high/api
thinking: true
