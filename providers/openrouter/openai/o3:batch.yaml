costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 1e-6
      output_cost_per_token: 4e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 100000
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/o3:batch
thinking: true
