costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
    - prompt_caching
limits:
    context_window: 128000
    max_output_tokens: 16384
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-4o-mini
sources:
    - https://openrouter.ai/openai/gpt-4o-mini/api
