costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - function_calling
    - vision
    - image_input
    - chat
    - tool_choice
    - response_schema
    - system_messages
    - prompt_caching
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: openai/gpt-4o-mini
sources:
    - https://openrouter.ai/openai/gpt-4o-mini/api
