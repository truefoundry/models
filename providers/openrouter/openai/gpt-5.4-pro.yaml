costs:
    - input_cost_per_token: 0.00003
      output_cost_per_token: 0.00018
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
    - tools
limits:
    context_window: 1050000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5.4-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
sources:
    - https://openrouter.ai/openai/gpt-5.4-pro/api
thinking: true
