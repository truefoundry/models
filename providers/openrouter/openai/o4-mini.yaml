costs:
    - cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 0.0000011
      output_cost_per_token: 0.0000044
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - response_schema
    - text
    - code
    - tools
    - tool_choice
    - system_messages
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: openai/o4-mini
sources:
    - https://openrouter.ai/openai/o4-mini/api
thinking: true
