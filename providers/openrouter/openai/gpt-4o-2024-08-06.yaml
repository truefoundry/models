costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai/gpt-4o-2024-08-06
params:
    - defaultValue: 16384
      key: max_tokens
      maxValue: 16384
      minValue: 1
sources:
    - https://openrouter.ai/openai/gpt-4o-2024-08-06/api
