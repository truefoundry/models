costs:
    - input_cost_per_token: 0.000015
      output_cost_per_token: 0.00012
      region: "*"
features:
    - function_calling
    - tool_choice
    - tools
    - structured_output
    - system_messages
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - image
        - text
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-5-pro
sources:
    - https://openrouter.ai/openai/gpt-5-pro/api
thinking: true
