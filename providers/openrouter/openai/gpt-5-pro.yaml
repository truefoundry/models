costs:
    - input_cost_per_query: 0.01
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.00012
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - tool_choice
    - response_schema
    - system_messages
    - text
    - tools
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: openai/gpt-5-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
sources:
    - https://openrouter.ai/openai/gpt-5-pro/api
thinking: true
