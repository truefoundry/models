model: openai/gpt-5.2-pro
costs:
    -
        region: '*'
        input_cost_per_token: 0.000021
        output_cost_per_token: 0.000168
        input_cost_per_image: 0
limits:
    max_tokens: 128000
    max_input_tokens: 272000
    max_output_tokens: 128000
features: [function_calling, vision, tool_choice]
mode: chat
