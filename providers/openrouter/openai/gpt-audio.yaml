costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - structured_output
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 16384
modalities:
    input:
        - text
        - audio
    output:
        - text
        - audio
mode: chat
model: openai/gpt-audio
sources:
    - https://openrouter.ai/openai/gpt-audio/api
