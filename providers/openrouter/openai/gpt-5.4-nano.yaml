costs:
    - cache_read_input_token_cost: 2.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 0.00000125
      region: "*"
limits:
    context_window: 400000
    max_output_tokens: 128000
modalities:
    input:
        - pdf
        - image
        - text
    output:
        - text
mode: chat
model: openai/gpt-5.4-nano
