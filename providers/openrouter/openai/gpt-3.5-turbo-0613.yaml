costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
    - tools
limits:
    context_window: 4095
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: openai/gpt-3.5-turbo-0613
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo-0613/api
