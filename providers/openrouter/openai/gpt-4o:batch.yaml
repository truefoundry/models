costs:
    - cache_read_input_token_cost: 6.25e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 16384
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: openai/gpt-4o:batch
provisioning: serverless
sources:
    - https://openrouter.ai/openai/gpt-4o:batch
status: active
supportedModes:
    - chat
