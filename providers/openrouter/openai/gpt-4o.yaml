model: openai/gpt-4o
costs:
    -
        region: '*'
        input_cost_per_token: 0.0000025
        output_cost_per_token: 0.00001
limits:
    max_tokens: 4096
    max_input_tokens: 128000
    max_output_tokens: 4096
features: [function_calling, parallel_function_calling, vision, tool_choice]
mode: chat
