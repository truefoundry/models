costs:
    - input_cost_per_token: 0.00015
      output_cost_per_token: 0.0006
      region: "*"
features:
    - chat
    - vision
    - image_input
    - response_schema
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: o1-pro
params:
    - key: max_tokens
      maxValue: 100000
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
sources:
    - https://openrouter.ai/openai/o1-pro/api
thinking: true
