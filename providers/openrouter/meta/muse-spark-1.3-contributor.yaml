costs:
    - cache_read_input_token_cost: 2e-9
      input_cost_per_token: 1e-7
      output_cost_per_token: 2e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 943718
modalities:
    input:
        - text
        - image
        - video
        - pdf
        - audio
    output:
        - text
mode: chat
model: meta/muse-spark-1.3-contributor
thinking: true
