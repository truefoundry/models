costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
limits:
    context_window: 4095
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: gpt-3.5-turbo-0613
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo-0613/api
