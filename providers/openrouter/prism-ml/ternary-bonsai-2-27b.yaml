costs:
    - input_cost_per_token: 7.5e-8
      output_cost_per_token: 5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: prism-ml/ternary-bonsai-2-27b
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 20
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/prism-ml/ternary-bonsai-2-27b
supportedModes:
    - chat
thinking: true
