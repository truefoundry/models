costs:
    - cache_read_input_token_cost: 2.6e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 4.4e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1310720
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ~z-ai/glm-latest
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
thinking: true
