costs:
    - cache_read_input_token_cost: 2.47e-7
      input_cost_per_token: 1.1875e-6
      output_cost_per_token: 4.18e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1310720
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ~z-ai/glm-latest
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/~z-ai/glm-latest
supportedModes:
    - chat
thinking: true
