costs:
    - cache_read_input_token_cost: 1.425e-8
      input_cost_per_token: 7.125e-8
      output_cost_per_token: 2.375e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1310720
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: ~z-ai/glm-flash-latest
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/~z-ai/glm-flash-latest
supportedModes:
    - chat
thinking: true
