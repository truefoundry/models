costs:
    - cache_read_input_token_cost: 5.e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tools
    - tool_choice
    - response_schema
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: o3
params:
    - key: max_tokens
      maxValue: 100000
sources:
    - https://openrouter.ai/openai/o3/api
thinking: true
