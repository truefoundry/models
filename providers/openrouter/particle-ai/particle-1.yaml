costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 1e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: particle-ai/particle-1
provisioning: serverless
sources:
    - https://openrouter.ai/particle-ai/particle-1
supportedModes:
    - chat
thinking: true
