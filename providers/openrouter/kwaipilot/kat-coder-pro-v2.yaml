costs:
    - cache_read_input_token_cost: 6.e-8
      input_cost_per_token: 3.e-7
      output_cost_per_token: 0.0000012
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 80000
    max_tokens: 80000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: kwaipilot/kat-coder-pro-v2
sources:
    - https://openrouter.ai/kwaipilot/kat-coder-pro-v2/api
