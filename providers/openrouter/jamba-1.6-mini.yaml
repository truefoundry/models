features:
    - function_calling
    - structured_output
    - system_messages
limits:
    context_window: 256000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: jamba-1.6-mini
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/ai21/jamba-1.6-mini/api
