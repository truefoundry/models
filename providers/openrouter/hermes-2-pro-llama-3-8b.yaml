costs:
    - input_cost_per_token: 1.4e-7
      output_cost_per_token: 1.4e-7
      region: "*"
features:
    - chat
    - function_calling
limits:
    context_window: 8192
    max_output_tokens: 8192
    max_tokens: 8192
mode: completion
model: hermes-2-pro-llama-3-8b
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/nousresearch/hermes-2-pro-llama-3-8b/api
