costs:
    - input_cost_per_token: 3.e-8
      output_cost_per_token: 9.e-8
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gemma-2-9b-it
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemma-2-9b-it/api
