costs:
    - input_cost_per_token: -1
      output_cost_per_token: -1
      region: "*"
limits:
    context_window: 2000000
modalities:
    input:
        - text
        - image
        - audio
        - pdf
        - video
    output:
        - text
        - image
mode: chat
model: openrouter/auto
sources:
    - https://openrouter.ai/openrouter/auto/api
