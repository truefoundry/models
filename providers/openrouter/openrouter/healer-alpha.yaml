costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
limits:
    context_window: 262144
    max_input_tokens: 230144
    max_output_tokens: 32000
    max_tokens: 32000
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
mode: chat
model: openrouter/healer-alpha
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
sources:
    - https://openrouter.ai/api/v1/models
thinking: true
