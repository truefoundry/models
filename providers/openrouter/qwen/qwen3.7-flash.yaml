costs:
    - cache_creation_input_token_cost: 3.8e-8
      cache_read_input_token_cost: 6e-9
      input_cost_per_token: 3e-8
      output_cost_per_token: 1.3e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: qwen/qwen3.7-flash
thinking: true
