costs:
    - input_cost_per_token: 5.e-8
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - tools
    - structured_output
    - system_messages
limits:
    context_window: 40960
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3-8b
params:
    - defaultValue: 0.6
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 20
      key: top_k
sources:
    - https://openrouter.ai/qwen/qwen3-8b/api
thinking: true
