costs:
    - input_cost_per_token: 5e-8
      output_cost_per_token: 4e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 40960
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3-8b
params:
    - defaultValue: 0.6
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 20
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3-8b
    - https://openrouter.ai/qwen/qwen3-8b/api
status: active
supportedModes:
    - chat
thinking: true
