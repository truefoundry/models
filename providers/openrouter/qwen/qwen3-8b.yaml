costs:
    - cache_read_input_token_cost: 5.e-8
      input_cost_per_token: 5.e-8
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - tools
    - response_schema
    - system_messages
limits:
    context_window: 40960
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: qwen/qwen3-8b
sources:
    - https://openrouter.ai/qwen/qwen3-8b/api
thinking: true
