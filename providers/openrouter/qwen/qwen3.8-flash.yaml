canonical_model: alibaba/qwen3-8-flash
costs:
    - cache_creation_input_token_cost: 2e-7
      cache_read_input_token_cost: 1.6e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 4.7e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
    - system_messages
limits:
    context_window: 1000000
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: qwen/qwen3.8-flash
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3.8-flash
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
thinking: true
