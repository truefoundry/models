costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 2e-6
      output_cost_per_token: 6e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 52429
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3.8-2.4t-a95b
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 20
      key: top_k
thinking: true
