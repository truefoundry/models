costs:
    - input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 235929
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: qwen/qwen3.8-27b:free
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 20
      key: top_k
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3.8-27b:free
supportedModes:
    - chat
thinking: true
