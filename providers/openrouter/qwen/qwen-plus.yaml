costs:
    - cache_creation_input_token_cost: 3.25e-7
      cache_read_input_token_cost: 5.2e-8
      input_cost_per_token: 2.6e-7
      output_cost_per_token: 7.8e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.56e-7
                from: 256000
          cache_write:
              - cost_per_token: 9.75e-7
                from: 256000
          input:
              - cost_per_token: 7.8e-7
                from: 256000
          output:
              - cost_per_token: 0.00000234
                from: 256000
          pricing_mode: marginal
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 1000000
    max_input_tokens: 995904
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen-plus
params:
    - defaultValue: 32768
      key: max_tokens
      maxValue: 32768
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen-plus
    - https://openrouter.ai/qwen/qwen-plus/api
status: active
supportedModes:
    - chat
