costs:
    - cache_read_input_token_cost: 5.2e-8
      input_cost_per_token: 2.6e-7
      output_cost_per_token: 7.8e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2.4e-7
                from: 256000
          input:
              - cost_per_token: 0.0000012
                from: 256000
          output:
              - cost_per_token: 0.0000036
                from: 256000
features:
    - function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 1000000
    max_input_tokens: 995904
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen-plus
params:
    - defaultValue: 32768
      key: max_tokens
      maxValue: 32768
      minValue: 1
sources:
    - https://openrouter.ai/qwen/qwen-plus/api
