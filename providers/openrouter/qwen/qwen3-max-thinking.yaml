costs:
    - input_cost_per_token: 7.8e-7
      output_cost_per_token: 0.0000039
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 262144
    max_output_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3-max-thinking
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 32768
      minValue: 1
sources:
    - https://openrouter.ai/qwen/qwen3-max-thinking/api
thinking: true
