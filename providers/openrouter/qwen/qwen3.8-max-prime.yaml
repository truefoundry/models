      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3.8-max-prime
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
