costs:
    - cache_creation_input_token_cost: 5e-7
      cache_read_input_token_cost: 8e-8
      input_cost_per_token: 4e-7
      output_cost_per_token: 1.6e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2.4e-7
                from: 256000
          cache_write:
              - cost_per_token: 1.5e-6
                from: 256000
          input:
              - cost_per_token: 1.2e-6
                from: 256000
          output:
              - cost_per_token: 4.8e-6
                from: 256000
          pricing_mode: marginal
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: qwen/qwen3.7-plus
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3.7-plus
supportedModes:
    - chat
thinking: true
