costs:
    - cache_read_input_token_cost: 4e-8
      input_cost_per_token: 8e-8
      output_cost_per_token: 2.4e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
    - system_messages
limits:
    context_window: 40960
    max_output_tokens: 40960
    max_tokens: 40960
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3-32b
params:
    - defaultValue: 40960
      key: max_tokens
      maxValue: 40960
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/qwen/qwen3-32b
    - https://openrouter.ai/qwen/qwen3-32b/api
status: active
supportedModes:
    - chat
thinking: true
