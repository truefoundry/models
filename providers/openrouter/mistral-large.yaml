costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: "*"
features:
    - tools
    - function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistral-large
sources:
    - https://openrouter.ai/mistralai/mistral-large/api
