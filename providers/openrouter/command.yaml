costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      region: "*"
features:
    - chat
limits:
    context_window: 4096
    max_output_tokens: 4000
    max_tokens: 4000
mode: chat
model: command
params:
    - key: max_tokens
      maxValue: 4000
sources:
    - https://openrouter.ai/cohere/command/api
    - https://cohere.com/pricing
