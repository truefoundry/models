costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-6
      output_cost_per_token: 2.7e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
    max_output_tokens: 64000
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: stepfun/step-5-preview
thinking: true
