costs:
    - input_cost_per_token: 0.000006
      output_cost_per_token: 0.000018
      region: "*"
features:
    - chat
    - vision
    - image_input
    - tools
    - function_calling
    - tool_choice
    - response_schema
limits:
    context_window: 128000
    max_output_tokens: 64000
    max_tokens: 64000
mode: chat
model: gpt-4o:extended
params:
    - key: max_tokens
      maxValue: 64000
sources:
    - https://openrouter.ai/openai/gpt-4o:extended/api
