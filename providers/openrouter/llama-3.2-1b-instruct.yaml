costs:
    - input_cost_per_token: 2.7e-8
      output_cost_per_token: 2.e-7
      region: "*"
limits:
    context_window: 60000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: llama-3.2-1b-instruct
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-3.2-1b-instruct/api
