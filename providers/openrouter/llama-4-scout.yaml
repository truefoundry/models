costs:
    - input_cost_per_token: 8.e-8
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tools
    - text
limits:
    context_window: 327680
    max_input_tokens: 327680
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: llama-4-scout
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-4-scout/api
