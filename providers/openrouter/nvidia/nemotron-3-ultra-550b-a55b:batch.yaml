costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.8e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 512288
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/nemotron-3-ultra-550b-a55b:batch
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
thinking: true
