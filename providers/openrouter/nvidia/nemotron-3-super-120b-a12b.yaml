costs:
    - cache_read_input_token_cost: 4.e-8
      input_cost_per_token: 1.e-7
      output_cost_per_token: 5.e-7
      region: "*"
limits:
    context_window: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/nemotron-3-super-120b-a12b
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
