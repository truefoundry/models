costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 2.5e-7
      region: "*"
features:
    - json_output
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
    max_output_tokens: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/nemotron-3.5-lightning
thinking: true
