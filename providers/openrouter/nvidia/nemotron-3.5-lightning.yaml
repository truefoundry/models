costs:
    - cache_read_input_token_cost: 4e-8
      input_cost_per_token: 8e-8
      output_cost_per_token: 2e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/nemotron-3.5-lightning
thinking: true
