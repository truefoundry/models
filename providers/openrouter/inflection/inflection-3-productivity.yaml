costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - chat
    - text
    - tool_choice
    - function_calling
limits:
    context_window: 8000
    max_output_tokens: 1024
    max_tokens: 1024
mode: chat
model: inflection/inflection-3-productivity
params:
    - defaultValue: 1024
      key: max_tokens
      maxValue: 1024
      minValue: 1
sources:
    - https://openrouter.ai/inflection/inflection-3-productivity/api
