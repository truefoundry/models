costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tools
    - response_schema
    - system_messages
limits:
    context_window: 1048576
    max_input_tokens: 1032192
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: llama-4-maverick
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-4-maverick/api
