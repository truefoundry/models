costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 2e-6
      output_cost_per_token: 6e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 500000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: ~x-ai/grok-latest
provisioning: serverless
sources:
    - https://openrouter.ai/~x-ai/grok-latest
status: active
supportedModes:
    - chat
thinking: true
