costs:
    - input_cost_per_token: 2.5e-7
      output_cost_per_token: 0.000001
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - text
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: mercury
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/inception/mercury/api
    - https://openrouter.ai/inception/mercury
