features:
    - chat
    - function_calling
    - vision
    - image_input
    - tools
    - tool_choice
    - system_messages
    - prompt_caching
    - assistant_prefill
limits:
    context_window: 200000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: claude-3.5-sonnet-20240620
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/anthropic/claude-3.5-sonnet-20240620/api
