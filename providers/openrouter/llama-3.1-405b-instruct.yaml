costs:
    - input_cost_per_token: 0.000004
      output_cost_per_token: 0.000004
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 131072
mode: chat
model: llama-3.1-405b-instruct
params:
    - key: max_tokens
      maxValue: 16384
sources:
    - https://openrouter.ai/meta-llama/llama-3.1-405b-instruct/api
    - https://openrouter.ai/meta-llama/llama-3.1-405b-instruct/providers
