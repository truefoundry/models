costs:
    - input_cost_per_token: 8.e-7
      output_cost_per_token: 0.0000012
      region: "*"
features:
    - text
    - code
limits:
    context_window: 81920
    max_output_tokens: 38000
    max_tokens: 38000
mode: chat
model: morph/morph-v3-fast
removeParams:
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - response_format
sources:
    - https://openrouter.ai/morph/morph-v3-fast/api
