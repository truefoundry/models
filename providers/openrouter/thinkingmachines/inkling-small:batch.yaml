costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 5e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - tool_choice
limits:
    context_window: 524288
    max_output_tokens: 471859
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
mode: chat
model: thinkingmachines/inkling-small:batch
thinking: true
