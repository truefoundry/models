costs:
    - input_cost_per_token: 0.0000015
      output_cost_per_token: 0.000002
      region: "*"
features:
    - chat
limits:
    context_window: 4095
    max_output_tokens: 4096
    max_tokens: 4096
mode: completion
model: gpt-3.5-turbo-instruct
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/openai/gpt-3.5-turbo-instruct/api
