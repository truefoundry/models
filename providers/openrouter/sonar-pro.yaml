costs:
    - input_cost_per_query: 0.005
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 8000
    max_tokens: 8000
mode: chat
model: sonar-pro
params:
    - key: max_tokens
      maxValue: 8000
sources:
    - https://openrouter.ai/perplexity/sonar-pro/api
