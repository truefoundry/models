costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tools
    - tool_choice
    - code
limits:
    context_window: 131072
    max_tokens: 4096
mode: chat
model: devstral-small
sources:
    - https://openrouter.ai/mistralai/devstral-small/api
    - https://openrouter.ai/mistralai/devstral-small
