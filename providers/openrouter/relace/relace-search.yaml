costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      region: "*"
features:
    - function_calling
    - tool_choice
    - tools
    - text
    - code
    - system_messages
limits:
    context_window: 256000
    max_input_tokens: 128000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: relace/relace-search
sources:
    - https://openrouter.ai/relace/relace-search/api
