costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 256000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: relace/relace-search
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
provisioning: serverless
sources:
    - https://openrouter.ai/relace/relace-search
    - https://openrouter.ai/relace/relace-search/api
status: active
supportedModes:
    - chat
