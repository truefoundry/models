costs:
    - input_cost_per_token: 8.5e-7
      output_cost_per_token: 0.00000125
      region: "*"
features:
    - text
    - code
limits:
    context_window: 256000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: relace/relace-apply-3
removeParams:
    - temperature
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - response_format
sources:
    - https://openrouter.ai/relace/relace-apply-3/api
