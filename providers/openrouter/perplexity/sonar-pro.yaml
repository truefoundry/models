costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 8000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: perplexity/sonar-pro
sources:
    - https://openrouter.ai/perplexity/sonar-pro/api
thinking: false
