costs:
    - input_cost_per_request: 0.005
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      region: "*"
features:
    - function_calling
    - vision
    - image_input
    - chat
    - tool_choice
    - system_messages
limits:
    context_window: 127072
mode: chat
model: perplexity/sonar
sources:
    - https://openrouter.ai/perplexity/sonar/api
