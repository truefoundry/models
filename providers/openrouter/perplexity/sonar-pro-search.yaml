costs:
    - input_cost_per_request: 0.018
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - structured_output
    - json_output
limits:
    context_window: 200000
    max_output_tokens: 8000
    max_tokens: 8000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: perplexity/sonar-pro-search
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8000
      minValue: 1
provisioning: serverless
sources:
    - https://openrouter.ai/perplexity/sonar-pro-search/api
    - https://openrouter.ai/perplexity/sonar-pro-search
status: active
supportedModes:
    - chat
thinking: true
