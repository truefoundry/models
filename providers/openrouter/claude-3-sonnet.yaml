costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - vision
    - image_input
    - tools
    - function_calling
    - system_messages
limits:
    context_window: 200000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: claude-3-sonnet
params:
    - key: max_tokens
      maxValue: 4096
sources:
    - https://openrouter.ai/anthropic/claude-3-sonnet/api
