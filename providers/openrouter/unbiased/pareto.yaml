costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 2.5e-6
      output_cost_per_token: 7.5e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: unbiased/pareto
