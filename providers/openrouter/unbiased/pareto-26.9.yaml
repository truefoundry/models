costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 2.5e-6
      output_cost_per_token: 7.5e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: unbiased/pareto-26.9
provisioning: serverless
sources:
    - https://openrouter.ai/unbiased/pareto-26.9
    - https://openrouter.ai/api/v1/models
supportedModes:
    - chat
