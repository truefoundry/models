costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 8e-7
      output_cost_per_token: 3.2e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: unbiased/pareto-26.10-preview
provisioning: serverless
sources:
    - https://openrouter.ai/unbiased/pareto-26.10-preview
supportedModes:
    - chat
