costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - chat
    - vision
    - image_input
    - function_calling
    - tool_choice
limits:
    context_window: 32768
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gemma-3-12b-it:free
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://openrouter.ai/google/gemma-3-12b-it:free/api
