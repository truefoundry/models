costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4000
    max_tokens: 4000
mode: chat
model: command-r-08-2024
params:
    - key: max_tokens
      maxValue: 4000
sources:
    - https://openrouter.ai/cohere/command-r-08-2024/api
