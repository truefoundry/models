costs:
    - cache_read_input_token_cost: 3e-9
      input_cost_per_token: 1.54e-7
      output_cost_per_token: 3.05e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
mode: chat
model: tfy-managed/mimo-v2.6-flash
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/xiaomi/mimo-v2.6-flash
status: active
supportedModes:
    - chat
thinking: true
