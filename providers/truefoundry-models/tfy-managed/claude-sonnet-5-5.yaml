costs:
    - cache_creation_input_token_cost: 2.5e-6
      cache_creation_input_token_cost_per_hour: 4e-6
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 2e-6
      input_cost_per_token_batches: 1e-6
      output_cost_per_token: 1e-5
      output_cost_per_token_batches: 5e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - assistant_prefill
    - structured_output
    - json_output
    - code_execution
    - mid_conversation_system_messages
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 354
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: tfy-managed/claude-sonnet-5-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
sources:
    - https://platform.claude.com/docs/en/models/sonnet-5-5/overview
    - https://www.anthropic.com/claude-sonnet-5-5
status: active
supportedModes:
    - chat
thinking: true
