costs:
    - cache_read_input_token_cost: 2.6e-7
      input_cost_per_token: 1.4e-6
      output_cost_per_token: 4.4e-6
      region: "*"
features:
    - function_calling
    - json_output
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1310720
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: tfy-managed/glm-5.3
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://openrouter.ai/z-ai/glm-5.3
supportedModes:
    - chat
thinking: true
