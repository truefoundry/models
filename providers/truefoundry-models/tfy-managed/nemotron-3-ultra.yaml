costs:
    - cache_read_input_token_cost: 1.2e-7
      input_cost_per_token: 6e-7
      output_cost_per_token: 2.4e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 1000000
    max_output_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: tfy-managed/nemotron-3-ultra
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
sources:
    - https://openrouter.ai/nvidia/nemotron-3-ultra-550b-a55b
status: active
supportedModes:
    - chat
thinking: true
