costs:
    - cache_creation_input_token_cost: 2.5e-7
      cache_read_input_token_cost: 2e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 1.2e-6
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
    - prompt_caching
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.6-luna
provisioning: serverless
retirementDate: "2028-01-11"
sources:
    - https://ai.azure.com/catalog/models/gpt-5.6-luna
    - https://azure.microsoft.com/en-us/blog/gpt-5-6-now-available-in-microsoft-foundry/
status: active
supportedModes:
    - chat
    - responses
