costs:
    - cache_creation_input_token_cost: 2.5e-7
      cache_read_input_token_cost: 2e-8
      input_cost_per_token: 2e-7
      output_cost_per_token: 1.2e-6
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
    - prompt_caching
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.6-luna
params:
    - key: max_completion_tokens
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2028-01-11"
sources:
    - https://ai.azure.com/catalog/models/gpt-5.6-luna
status: active
supportedModes:
    - chat
    - responses
thinking: true
