costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 1e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
isDeprecated: true
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5-chat
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 16384
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2026-06-29"
status: retired
supportedModes:
    - chat
thinking: true
