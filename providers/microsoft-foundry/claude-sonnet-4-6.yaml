costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_per_hour: 0.000006
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      input_cost_per_token_batches: 0.0000015
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: global
    - cache_creation_input_token_cost: 0.000004125
      cache_creation_input_token_cost_per_hour: 0.0000066
      cache_read_input_token_cost: 3.3e-7
      input_cost_per_token: 0.0000033
      input_cost_per_token_batches: 0.00000165
      output_cost_per_token: 0.0000165
      output_cost_per_token_batches: 0.00000825
      region: datazone_us
    - cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_per_hour: 0.000006
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      input_cost_per_token_batches: 0.0000015
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - cache_control
    - structured_output
    - json_output
    - assistant_prefill
    - system_messages
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-4-6
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-claude
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
    - https://platform.claude.com/docs/en/about-claude/pricing
status: active
supportedModes:
    - chat
thinking: true
