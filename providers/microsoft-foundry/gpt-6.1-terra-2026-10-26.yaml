canonical_model: openai/gpt-6-1-terra
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-6.1-terra-2026-10-26
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-6.1-terra
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure-region-availability
status: active
supportedModes:
    - chat
    - responses
thinking: true
