costs:
    - cache_creation_input_token_cost: 0.00001
      cache_creation_input_token_cost_per_hour: 0.000016
      cache_read_input_token_cost: 4e-7
      # Fast mode pricing on Microsoft Foundry (hosted on Azure) — 2x standard Claude Opus 5.5
      input_cost_per_token: 0.000008
      output_cost_per_token: 0.00004
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - mid_conversation_system_messages
    - prompt_caching
    - cache_control
    - structured_output
    - json_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-opus-5-5-fast-2
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/claude-opus-5-5-fast
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
    - https://aka.ms/claude-opus-5-5-fast-plan-pricing
    - https://assets.claude.com/5633dc848caa431115468f31c7085d695bbfb9cc.pdf
status: active
supportedModes:
    - chat
thinking: true
