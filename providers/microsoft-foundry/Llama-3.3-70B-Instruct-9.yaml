costs:
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 7.1e-7
      region: "*"
features:
    - system_messages
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Llama-3.3-70B-Instruct-9
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
removeParams:
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
    - response_format
sources:
    - https://ai.azure.com/catalog/models/Llama-3.3-70B-Instruct
status: active
supportedModes:
    - chat
