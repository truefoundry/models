costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      region: "*"
features:
    - function_calling
    - tool_choice
    - json_output
limits:
    context_window: 32768
    max_input_tokens: 32768
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistral-small
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-mistral?view=azureml-api-2
status: active
supportedModes:
    - chat
