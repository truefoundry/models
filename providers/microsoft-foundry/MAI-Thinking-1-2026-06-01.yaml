costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 2e-6
      output_cost_per_token: 8e-6
      region: global
features:
    - function_calling
    - prompt_caching
limits:
    context_window: 256000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: MAI-Thinking-1-2026-06-01
params:
    - key: max_completion_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-thinking
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://ai.azure.com/catalog/models/MAI-Thinking-1
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/microsoft/
status: preview
supportedModes:
    - chat
thinking: true
