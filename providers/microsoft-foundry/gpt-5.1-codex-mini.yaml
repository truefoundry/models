costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 2e-6
      region: global
    - cache_read_input_token_cost: 2.75e-8
      input_cost_per_token: 2.75e-7
      output_cost_per_token: 2.2e-6
      region: datazone_us
    - cache_read_input_token_cost: 2.75e-8
      input_cost_per_token: 2.75e-7
      output_cost_per_token: 2.2e-6
      region: datazone_eu
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: responses
model: gpt-5.1-codex-mini
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2027-05-15"
sources:
    - https://ai.azure.com/catalog/models/gpt-5.1-codex-mini
    - https://developers.openai.com/api/docs/models/gpt-5.1-codex-mini
status: active
supportedModes:
    - responses
thinking: true
