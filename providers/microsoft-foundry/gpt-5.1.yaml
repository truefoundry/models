features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.1
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
      type: string
preferChatCompletions: true
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
retirementDate: "2027-05-15"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
