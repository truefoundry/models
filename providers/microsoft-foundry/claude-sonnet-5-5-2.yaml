costs:
    - cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_per_hour: 0.000004
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: global
    - cache_creation_input_token_cost: 0.00000275
      cache_creation_input_token_cost_per_hour: 0.0000044
      cache_read_input_token_cost: 2.2e-7
      input_cost_per_token: 0.0000022
      input_cost_per_token_batches: 0.0000011
      output_cost_per_token: 0.000011
      output_cost_per_token_batches: 0.0000055
      region: datazone_us
    - cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_per_hour: 0.000004
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - mid_conversation_system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 286
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-5-5-2
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
    - https://ai.azure.com/catalog/models/claude-sonnet-5-5
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
status: active
supportedModes:
    - chat
thinking: true
