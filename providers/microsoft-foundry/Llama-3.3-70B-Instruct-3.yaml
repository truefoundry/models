costs:
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 7.1e-7
      region: global
features:
    - system_messages
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Llama-3.3-70B-Instruct-3
provisioning: serverless
removeParams:
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://ai.azure.com/catalog/models/Llama-3.3-70B-Instruct
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/llama/
status: active
supportedModes:
    - chat
