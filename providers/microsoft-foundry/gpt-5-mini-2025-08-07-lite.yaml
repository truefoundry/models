costs:
    - cache_read_input_token_cost: 2.75e-8
      input_cost_per_token: 2.75e-7
      input_cost_per_token_batches: 1.375e-7
      output_cost_per_token: 2.2e-6
      output_cost_per_token_batches: 1.1e-6
      region: datazone_us
    - cache_read_input_token_cost: 2.75e-8
      input_cost_per_token: 2.75e-7
      input_cost_per_token_batches: 1.375e-7
      output_cost_per_token: 2.2e-6
      output_cost_per_token_batches: 1.1e-6
      region: datazone_eu
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 2e-6
      output_cost_per_token_batches: 1e-6
