features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5-mini-2025-08-07-lite
params:
    - key: max_completion_tokens
      maxValue: 128000
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2027-02-09"
status: active
supportedModes:
    - chat
    - responses
thinking: true
