costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 0.0000055
      output_cost_per_token: 0.000033
      region: datazone_us
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - system_messages
    - json_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-chat-latest-2026-08-06
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
preferChatCompletions: true
provisioning: serverless
removeParams:
    - max_tokens
    - reasoning_effort
retirementDate: "2026-12-02"
sources:
    - https://ai.azure.com/catalog/models/gpt-chat-latest
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure-region-availability
status: preview
supportedModes:
    - chat
    - responses
thinking: true
