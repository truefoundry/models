costs:
    - input_cost_per_token: 5e-7
      output_cost_per_token: 7e-7
      region: "*"
features:
    - tool_choice
    - system_messages
limits:
    max_input_tokens: 70000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: jamba-instruct
provisioning: serverless
sources:
    - https://www.ai21.com/blog/jamba-instruct-microsoft-azure-ai/
    - https://techcommunity.microsoft.com/t5/ai-ai-platform-blog/ai21-jamba-instruct-launches-on-azure-ai-models-as-a-service/ba-p/4170102
status: active
supportedModes:
    - chat
