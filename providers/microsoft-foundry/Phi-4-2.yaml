costs:
    - input_cost_per_token: 1.25e-7
      output_cost_per_token: 5e-7
      region: "*"
features:
    - system_messages
    - function_calling
    - tool_choice
limits:
    context_window: 16384
    max_input_tokens: 16384
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Phi-4-2
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-from-partners
    - https://ai.azure.com/catalog/models/Phi-4
status: active
supportedModes:
    - chat
