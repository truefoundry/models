costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      input_cost_per_token_batches: 2.5e-6
      output_cost_per_token: 3e-5
      output_cost_per_token_batches: 1.5e-5
      region: global
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: datazone_us
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      input_cost_per_token_batches: 2.5e-6
      output_cost_per_token: 3e-5
      output_cost_per_token_batches: 1.5e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - structured_output
    - prompt_caching
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-chat-latest
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
preferChatCompletions: true
provisioning: serverless
removeParams:
    - max_tokens
    - reasoning_effort
retirementDate: "2026-12-02"
sources:
    - https://ai.azure.com/catalog/models/gpt-chat-latest
    - https://developers.openai.com/api/docs/models/chat-latest
status: preview
supportedModes:
    - chat
    - responses
thinking: true
