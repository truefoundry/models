costs:
    - input_cost_per_token: 4e-8
      output_cost_per_token: 4e-8
      region: "*"
features:
    - function_calling
    - tool_choice
    - json_output
    - system_messages
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ministral-3b
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-from-partners
    - https://ai.azure.com/catalog/models/Ministral-3B
status: active
supportedModes:
    - chat
