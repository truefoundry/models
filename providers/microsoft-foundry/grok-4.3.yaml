costs:
    - input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 200000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.3
params:
    - key: max_tokens
      maxValue: 8192
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/grok-4.3
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/grok/
status: preview
supportedModes:
    - chat
thinking: true
