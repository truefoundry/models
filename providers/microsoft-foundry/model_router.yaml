costs:
    - input_cost_per_token: 1.4e-7
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - system_messages
    - prompt_caching
    - tool_choice
limits:
    context_window: 200000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: model_router
provisioning: serverless
retirementDate: "2027-05-20"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/model-router
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
status: active
supportedModes:
    - chat
    - responses
thinking: true
