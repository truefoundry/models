costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_per_hour: 0.000006
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      input_cost_per_token_batches: 0.0000015
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - assistant_prefill
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-4-5
provisioning: serverless
retirementDate: "2026-10-19"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-retirement-schedule
    - https://docs.claude.com/en/docs/about-claude/models/overview
    - https://www.anthropic.com/pricing
status: active
supportedModes:
    - chat
thinking: true
