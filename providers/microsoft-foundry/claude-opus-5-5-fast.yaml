costs:
    - cache_creation_input_token_cost: 0.00001
      cache_creation_input_token_cost_per_hour: 0.000016
      cache_read_input_token_cost: 4e-7
      input_cost_per_token: 0.000008
      output_cost_per_token: 0.00004
      region: global
    - cache_creation_input_token_cost: 0.000011
      cache_creation_input_token_cost_per_hour: 0.0000176
      cache_read_input_token_cost: 4.4e-7
      input_cost_per_token: 0.0000088
      output_cost_per_token: 0.000044
      region: datazone_us
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - prompt_caching
    - system_messages
    - structured_output
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
        - doc
    output:
        - text
mode: chat
model: claude-opus-5-5-fast
provisioning: serverless
sources:
    - https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/build-with-claude/fast-mode
supportedModes:
    - chat
thinking: true
