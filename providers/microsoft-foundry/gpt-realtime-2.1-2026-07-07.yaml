features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    max_input_tokens: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-2.1-2026-07-07
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
retirementDate: "2027-06-25"
status: active
supportedModes:
    - realtime
thinking: true
