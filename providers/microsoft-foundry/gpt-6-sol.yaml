features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-6-sol
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-6-sol
    - https://azure.microsoft.com/en-us/blog/gpt-6-astra-sol-and-luna-for-production-agents-in-microsoft-foundry/
status: active
supportedModes:
    - chat
    - responses
thinking: true
