        - text
        - image
    output:
        - text
mode: chat
model: gpt-6-sol
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
