costs:
    - input_cost_per_audio_token: 0.0000025
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
limits:
    max_input_tokens: 16000
    max_output_tokens: 2000
    max_tokens: 2000
modalities:
    input:
        - audio
        - text
    output:
        - text
mode: audio_transcription
model: gpt-4o-transcribe-2025-03-20
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-10-15"
sources:
    - https://developers.openai.com/api/docs/models/gpt-4o-transcribe
status: active
supportedModes:
    - audio_transcription
