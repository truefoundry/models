canonical_model: microsoft/mai-thinking-1
costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - function_calling
    - system_messages
    - prompt_caching
limits:
    context_window: 256000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: MAI-Thinking-1
params:
    - defaultValue: 32768
      key: max_completion_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
    - reasoning_effort
sources:
    - https://ai.azure.com/catalog/models/MAI-Thinking-1
    - https://microsoft.ai/news/introducing-mai-thinking-1/
    - https://labs.ai.azure.com/innovations/mai-thinking-1/
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-thinking
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/microsoft/
status: preview
supportedModes:
    - chat
thinking: true
