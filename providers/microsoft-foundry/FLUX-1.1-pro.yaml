    - temperature
    - top_p
    - stop
    - response_format
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/black-forest-labs-flux-1-kontext-pro-and-flux1-1-pro-now-available-in-azure-ai-f/4434659
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/black-forest-labs/
status: active
supportedModes:
    - image
