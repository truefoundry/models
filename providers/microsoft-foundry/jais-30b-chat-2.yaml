features:
    - function_calling
    - json_output
    - system_messages
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: jais-30b-chat-2
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-models-featured
    - https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/deploy-models-jais
status: active
supportedModes:
    - chat
