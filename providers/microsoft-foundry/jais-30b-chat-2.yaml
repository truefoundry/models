features:
    - function_calling
    - tool_choice
    - json_output
    - system_messages
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: jais-30b-chat-2
provisioning: serverless
removeParams:
    - reasoning_effort
# costs: not found in official docs (Core42 pricing page returns 404 and the model is not listed on the Microsoft Foundry pricing page)
sources:
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-models-featured
status: active
supportedModes:
    - chat
