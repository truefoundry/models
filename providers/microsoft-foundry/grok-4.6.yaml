costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
    - prompt_caching
    - json_output
limits:
    context_window: 200000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.6
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
preferChatCompletions: true
provisioning: serverless
sources:
    - https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/grok-4-6-comes-to-microsoft-foundry-models-built-for-long-horizon-reasoning-and-/4547578
    - https://docs.x.ai/developers/models
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-6.html
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-grok
    - https://ai.azure.com/catalog/models/grok-4.6
    - https://azure.microsoft.com/pricing/details/ai-foundry-models/grok/
status: preview
supportedModes:
    - chat
    - responses
thinking: true
