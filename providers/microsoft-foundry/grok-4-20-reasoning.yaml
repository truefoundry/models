costs:
    - input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - function_calling
limits:
    context_window: 262000
    max_input_tokens: 262000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4-20-reasoning
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
retirementDate: "2027-04-06"
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-grok
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
    - https://ai.azure.com/catalog/models/grok-4-20-reasoning
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/grok/
status: preview
supportedModes:
    - chat
    - responses
thinking: true
