costs:
    - input_cost_per_image_token: 0.00000175
      input_cost_per_token: 0.00000175
      output_cost_per_image_token: 0.0000195
      region: global
limits:
    context_window: 32000
    max_input_tokens: 32000
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: MAI-Image-2.5-Flash-2026-06-02
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-10-01"
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-image
    - https://microsoft.ai/news/introducing-mai-image-2-5/
status: preview
supportedModes:
    - image
