costs:
    - cache_creation_input_token_cost: 0.0000125
      cache_creation_input_token_cost_per_hour: 0.00002
      cache_read_input_token_cost: 0.000001
      input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00005
      output_cost_per_token_batches: 0.000025
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - tool_choice
    - prompt_caching
    - assistant_prefill
    - structured_output
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-fable-5
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
retirementDate: "2027-12-05"
sources:
    - https://platform.claude.com/docs/en/models/fable-5/overview
    - https://ai.azure.com/catalog/models/claude-fable-5
    - https://azure.microsoft.com/en-us/blog/claude-fable-5-is-now-available-in-microsoft-foundry-powering-the-next-era-of-autonomous-agents/
status: preview
supportedModes:
    - chat
thinking: true
