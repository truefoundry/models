costs:
    - cache_read_input_audio_token_cost: 3e-7
      cache_read_input_token_cost: 6e-8
      input_cost_per_audio_token: 0.00001
      input_cost_per_token: 6e-7
      output_cost_per_audio_token: 0.00002
      output_cost_per_token: 0.0000024
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - audio
    output:
        - text
        - audio
mode: chat
model: gpt-audio-mini-2025-10-06
params:
    - key: max_tokens
      maxValue: 16384
provisioning: serverless
removeParams:
    - reasoning_effort
retirementDate: "2027-04-06"
sources:
    - https://developers.openai.com/docs/models/gpt-audio-mini
    - https://developers.openai.com/docs/pricing
status: active
supportedModes:
    - chat
