costs:
    - input_cost_per_token: 2e-7
      output_cost_per_token: 5e-7
      region: global
features:
    - function_calling
    - system_messages
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4-1-fast-non-reasoning
params:
    - key: max_tokens
      maxValue: 128000
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://ai.azure.com/catalog/models/grok-4-1-fast-non-reasoning
status: active
supportedModes:
    - chat
