costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - json_output
    - structured_output
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: cohere-command-a
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://ai.azure.com/catalog/models/cohere-command-a
    - https://docs.cohere.com/docs/command-a
    - https://docs.cohere.com/docs/cohere-on-microsoft-azure
status: active
supportedModes:
    - chat
