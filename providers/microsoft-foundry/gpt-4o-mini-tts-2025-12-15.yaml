costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_audio_token: 0.000012
      output_cost_per_second: 0.00025
      output_cost_per_token: 0.00001
      region: "*"
limits:
    context_window: 2000
    max_input_tokens: 2000
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: gpt-4o-mini-tts-2025-12-15
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2027-06-15"
sources:
    - https://developers.openai.com/docs/guides/text-to-speech
    - https://developers.openai.com/docs/models/gpt-4o-mini-tts
    - https://ai.azure.com/catalog/models/gpt-4o-mini-tts
status: active
supportedModes:
    - text_to_speech
