costs:
    - cache_read_input_audio_token_cost: 3e-7
      cache_read_input_token_cost: 6e-8
      input_cost_per_audio_token: 0.00001
      input_cost_per_token: 6e-7
      output_cost_per_audio_token: 0.00002
      output_cost_per_token: 0.0000024
      region: "*"
features:
    - function_calling
    - system_messages
    - prompt_caching
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - audio
        - image
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-2.1-mini
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
retirementDate: "2027-06-25"
sources:
    - https://ai.azure.com/catalog/models/gpt-realtime-2.1-mini
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/realtime-2
    - https://developers.openai.com/api/docs/pricing
status: preview
supportedModes:
    - realtime
thinking: true
