costs:
    - input_cost_per_annotated_page: 0.005
      input_cost_per_page: 0.004
      region: global
features:
    - json_output
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - image
        - pdf
    output:
        - text
mode: ocr
model: mistral-ocr-4-0
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
    - max_tokens
sources:
    - https://ai.azure.com/catalog/models/mistral-ocr-4-0
    - https://docs.mistral.ai/models/model-cards/ocr-4-0
    - https://mistral.ai/news/ocr-4/
status: preview
supportedModes:
    - ocr
