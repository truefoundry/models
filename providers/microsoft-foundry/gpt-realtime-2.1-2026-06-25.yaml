costs:
    - cache_read_input_audio_token_cost: 4e-7
      cache_read_input_token_cost: 4e-7
      input_cost_per_audio_token: 0.000032
      input_cost_per_token: 0.000004
      output_cost_per_audio_token: 0.000064
      output_cost_per_token: 0.000024
      region: global
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-2.1-2026-06-25
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
retirementDate: "2027-06-25"
sources:
    - https://ai.azure.com/catalog/models/gpt-realtime-2.1
    - https://developers.openai.com/api/docs/models/gpt-realtime-2.1
status: preview
supportedModes:
    - realtime
thinking: true
