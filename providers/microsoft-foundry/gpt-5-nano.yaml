costs:
    - cache_read_input_token_cost: 5e-9
      input_cost_per_token: 5e-8
      output_cost_per_token: 4e-7
      region: global
    - cache_read_input_token_cost: 5.5e-9
      input_cost_per_token: 5.5e-8
      output_cost_per_token: 4.4e-7
      region: datazone_us
    - cache_read_input_token_cost: 5.5e-9
      input_cost_per_token: 5.5e-8
      output_cost_per_token: 4.4e-7
      region: datazone_eu
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5-nano
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
retirementDate: "2027-02-09"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
status: active
supportedModes:
    - chat
    - responses
thinking: true
