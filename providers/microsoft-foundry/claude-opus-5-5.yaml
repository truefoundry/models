costs:
    - cache_creation_input_token_cost: 0.000005
      cache_creation_input_token_cost_per_hour: 0.000008
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      region: global
    - cache_creation_input_token_cost: 0.0000055
      cache_creation_input_token_cost_per_hour: 0.0000088
      cache_read_input_token_cost: 2.2e-7
      input_cost_per_token: 0.0000044
      output_cost_per_token: 0.000022
      region: datazone_us
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - mid_conversation_system_messages
    - tool_choice
    - prompt_caching
    - cache_control
    - structured_output
    - json_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
