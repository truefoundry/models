costs:
    -
        input_cost_per_token: 0.000003
        output_cost_per_token: 0.000015
        region: us-west-2
    -
        input_cost_per_token: 0.0000015
        output_cost_per_token: 0.0000075
        region: us-east-1
features:
    - function_calling
    - vision
    - chat
    - image
limits:
    max_input_tokens: 200000
    max_output_tokens: 4096
    max_tokens: 4096
mode: chat
model: us.anthropic.claude-3-sonnet-20240229-v1:0
params:
    -
        defaultValue: null
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema:
                    type: json
                value: custom
        rule:
            default:
                condition: tools
                else: null
                then: auto
        skipValues:
            - null
            - []
        type: non-view-manage-data
