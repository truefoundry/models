features:
    - function_calling
    - system_messages
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - doc
    output:
        - text
mode: chat
model: eu.amazon.nova-2-lite-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
