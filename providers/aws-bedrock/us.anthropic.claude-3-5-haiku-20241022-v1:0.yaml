costs:
    -
        cache_creation_input_token_cost: 0.000001
        cache_read_input_token_cost: 8.e-8
        input_cost_per_token: 8.e-7
        output_cost_per_token: 0.000004
        region: '*'
features: [chat, image, tools, function_calling, tool_choice, prompt_caching, response_schema, assistant_prefill, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 8192
    max_tokens: 4096
mode: chat
model: us.anthropic.claude-3-5-haiku-20241022-v1:0
params:
    -
        defaultValue: null
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema:
                    type: json
                value: custom
        rule:
            default:
                condition: tools
                else: null
                then: auto
        skipValues:
            - null
            - []
        type: non-view-manage-data
