model: us.anthropic.claude-3-5-haiku-20241022-v1:0
costs:
  - region: us-west-2
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    input_cost_per_million_tokens: 1
    output_cost_per_million_tokens: 5
    cache_read_input_token_cost: 8.e-8
    cache_creation_input_token_cost: 0.000001
  - region: us-east-2
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    input_cost_per_million_tokens: 1
    output_cost_per_million_tokens: 5
    cache_read_input_token_cost: 8.e-8
    cache_creation_input_token_cost: 0.000001
  - region: us-east-1
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    input_cost_per_million_tokens: 1
    output_cost_per_million_tokens: 5
    cache_read_input_token_cost: 8.e-8
    cache_creation_input_token_cost: 0.000001
limits:
  max_tokens: 4096
  max_input_tokens: 200000
  max_output_tokens: 8192
features: [function_calling, chat, image]
params:
  - key: tool_choice
    type: non-view-manage-data
    defaultValue: null
    options:
      - value: none
        name: None
      - value: auto
        name: Auto
      - value: required
        name: Required
      - value: custom
        name: Custom
        schema:
          type: json
    skipValues:
      - null
      - []
    rule:
      default:
        condition: tools
        then: auto
        else: null
mode: chat
original_provider: bedrock
