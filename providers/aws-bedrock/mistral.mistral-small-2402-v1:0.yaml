costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000003
      region: us-east-1
features:
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 32000
    max_input_tokens: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistral.mistral-small-2402-v1:0
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
provisioning: serverless
removeParams:
    - "n"
    - reasoning_effort
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-mistral-small.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral-chat-completion.html
    - https://docs.mistral.ai/getting-started/models/
status: active
supportedModes:
    - chat
    - completion
