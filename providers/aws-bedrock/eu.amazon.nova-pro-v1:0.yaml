features:
    - function_calling
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 300000
    max_input_tokens: 300000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
        - image
        - video
        - doc
        - pdf
    output:
        - text
mode: chat
model: eu.amazon.nova-pro-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0
    - key: top_k
      maxValue: 128
      minValue: 0
    - key: reasoning_effort
provisioning: serverless
removeParams:
    - "n"
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
