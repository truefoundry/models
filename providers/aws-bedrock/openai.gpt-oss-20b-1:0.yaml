model: openai.gpt-oss-20b-1:0
costs:
  - region: '*'
    input_cost_per_token: 7.e-8
    output_cost_per_token: 3.e-7
limits:
  max_input_tokens: 128000
  max_output_tokens: 128000
features: [chat, function_calling, tool_choice, response_schema]
params:
  - key: max_tokens
    maxValue: 32768
removeParams:
  - stream
  - stop
mode: chat
