features:
    - system_messages
    - function_calling
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 128000
    max_output_tokens: 16000
    max_tokens: 16000
messages:
    options:
        - system
        - user
        - assistant
        - developer
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai.gpt-oss-20b-1:0
params:
    - defaultValue: 512
      key: max_completion_tokens
      maxValue: 32768
      minValue: 1
    - key: temperature
      maxValue: 2
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - max_tokens
    - "n"
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-openai.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-20b.html
status: active
supportedModes:
    - chat
thinking: true
