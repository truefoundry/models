    - input_cost_per_token: 7.21e-8
      input_cost_per_token_batches: 3.61e-8
      output_cost_per_token: 3.09e-7
      output_cost_per_token_batches: 1.545e-7
      region: ap-southeast-2
    - input_cost_per_token: 8e-8
