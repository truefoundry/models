costs:
    - input_cost_per_token: 7.e-8
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
limits:
    max_input_tokens: 128000
    max_output_tokens: 128000
mode: chat
model: openai.gpt-oss-20b-1:0
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - stream
    - stop
