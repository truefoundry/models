      region: sa-east-1
    - input_cost_per_token: 1.1e-7
      output_cost_per_token: 4.7e-7
      region: eu-west-2
    - input_cost_per_token: 8e-8
      output_cost_per_token: 3.5e-7
      region: eu-west-1
    - input_cost_per_token: 9e-8
      output_cost_per_token: 4e-7
      region: eu-south-1
    - input_cost_per_token: 7e-8
