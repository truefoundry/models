costs:
    -
        input_cost_per_token: 4.6e-8
        output_cost_per_token: 1.84e-7
        region: '*'
features: [chat, function_calling, prompt_caching, response_schema]
limits:
    max_input_tokens: 128000
    max_output_tokens: 10000
    max_tokens: 4096
mode: chat
model: eu.amazon.nova-micro-v1:0
