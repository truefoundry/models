features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - tool_choice
    - prompt_caching
    # - structured_output is not supported in bedrock-converse
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: global.anthropic.claude-sonnet-5
params:
    - key: max_tokens
      maxValue: 128000
provisioning: serverless
removeParams:
    - temperature
sources:
