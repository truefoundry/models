costs:
    - input_cost_per_token: 2.2e-7
      input_cost_per_token_batches: 1.1e-7
      output_cost_per_token: 2.2e-7
      output_cost_per_token_batches: 1.1e-7
      region: us-west-2
    - input_cost_per_token: 2.2e-7
      input_cost_per_token_batches: 1.1e-7
      output_cost_per_token: 2.2e-7
      output_cost_per_token_batches: 1.1e-7
      region: us-east-2
    - input_cost_per_token: 2.2e-7
      input_cost_per_token_batches: 1.1e-7
      output_cost_per_token: 2.2e-7
      output_cost_per_token_batches: 1.1e-7
      region: us-east-1
features:
    - function_calling
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 2048
    max_tokens: 2048
