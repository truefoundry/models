costs:
    - input_cost_per_image: 0.04
      region: us-west-2
    - input_cost_per_image: 0.04
      region: us-east-2
    - input_cost_per_image: 0.04
      region: us-east-1
features:
    - image_input
    - image
mode: image
model: us.stability.stable-image-erase-object-v1:0
params:
    - defaultValue: 0
      key: seed
      maxValue: 4294967294
      minValue: 0
    - defaultValue: 5
      key: grow_mask
      maxValue: 20
      minValue: 0
    - defaultValue: png
      key: output_format
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/stable-image-services.html
    - https://aws.amazon.com/about-aws/whats-new/2025/10/stability-ai-image-updates-amazon-bedrock/
