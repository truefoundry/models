costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 6e-8
      input_cost_per_token_batches: 3e-8
      output_cost_per_token: 2.4e-7
      output_cost_per_token_batches: 1.2e-7
      region: us-west-2
    - input_cost_per_token: 7.7e-8
      output_cost_per_token: 3.08e-7
      region: us-west-1
    - cache_read_input_token_cost: 1.8e-8
      input_cost_per_token: 7.2e-8
      input_cost_per_token_batches: 3.6e-8
      output_cost_per_token: 2.88e-7
      output_cost_per_token_batches: 1.44e-7
      region: us-gov-west-1
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 6e-8
      input_cost_per_token_batches: 3e-8
      output_cost_per_token: 2.4e-7
      output_cost_per_token_batches: 1.2e-7
      region: us-east-2
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 6e-8
      input_cost_per_token_batches: 3e-8
      output_cost_per_token: 2.4e-7
      output_cost_per_token_batches: 1.2e-7
      region: us-east-1
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - system_messages
    - assistant_prefill
limits:
    context_window: 300000
    max_input_tokens: 300000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
        - image
        - video
        - doc
        - pdf
    output:
        - text
mode: chat
model: us.amazon.nova-lite-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
    - https://docs.aws.amazon.com/nova/latest/userguide/modalities.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
    - https://aws.amazon.com/nova/pricing/
status: active
supportedModes:
    - chat
