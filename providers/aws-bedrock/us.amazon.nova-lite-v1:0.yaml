features:
    - function_calling
    - tool_choice
    - prompt_caching
limits:
    context_window: 300000
    max_input_tokens: 300000
    max_output_tokens: 10000
    max_tokens: 10000
modalities:
    input:
        - text
        - image
        - video
        - doc
        - pdf
    output:
        - text
mode: chat
model: us.amazon.nova-lite-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 10000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
