costs:
    - output_cost_per_token: 0.0000075
      region: us-west-2
    - output_cost_per_token: 0.0000075
      region: us-east-2
    - output_cost_per_token: 0.0000075
      region: us-east-1
features:
    - system_messages
limits:
    context_window: 8000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: writer.palmyra-vision-7b
sources:
    - https://dev.writer.com/home/models
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-writer-palmyra.html
status: active
