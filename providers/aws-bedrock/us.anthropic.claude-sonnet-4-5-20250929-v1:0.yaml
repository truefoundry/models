- region: ca-central-1
  cache_creation_input_token_cost: '4.125e-6'
  cache_read_input_token_cost: '3.3e-7'
  input_cost_per_token: '3.3e-6'
  input_cost_per_token_batches: '1.65e-6'
  output_cost_per_token: '1.65e-05'
  output_cost_per_token_batches: '8.25e-6'
  tiered_pricing: *id001
limits:
  max_input_tokens: 200000
  max_output_tokens: 64000
  tool_use_system_prompt_tokens: 346
features: [function_calling, vision, chat, image]
params:
- key: max_tokens
  maxValue: 64000
- key: thinking
  properties:
    type:
      type: string
      enum: [enabled, disabled]
    budget_tokens:
      type: number
      minValue: 1024
      maxValue: 128000
  defaultValue: null
  withdrawParams: [top_k, top_p]
  skipValues:
  - disabled
  - null
- key: tool_choice
  type: non-view-manage-data
  defaultValue: null
  options:
  - value: none
    name: None
  - value: auto
    name: Auto
  - value: required
    name: Required
  - value: custom
    name: Custom
    schema:
      type: json
  skipValues:
  - null
  - []
  rule:
    default:
      condition: tools
      then: auto
      else: null
removeParams: [top_p]
mode: chat
