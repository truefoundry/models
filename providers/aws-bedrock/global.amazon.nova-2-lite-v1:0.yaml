costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 3.e-7
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - function_calling
    - vision
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    max_input_tokens: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
mode: chat
model: global.amazon.nova-2-lite-v1:0
