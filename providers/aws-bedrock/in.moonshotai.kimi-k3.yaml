costs:
    - cache_creation_input_token_cost: 4.125e-6
      cache_read_input_token_cost: 3.3e-7
      input_cost_per_token: 3.3e-6
      output_cost_per_token: 1.65e-5
      region: ap-south-2 # India CRIS pricing not documented in official docs
    - cache_creation_input_token_cost: 4.125e-6
      cache_read_input_token_cost: 3.3e-7
      input_cost_per_token: 3.3e-6
      output_cost_per_token: 1.65e-5
      region: ap-south-1 # India CRIS pricing not documented in official docs
features:
    - function_calling
    - prompt_caching
    - cache_control
    - structured_output
    - system_messages
