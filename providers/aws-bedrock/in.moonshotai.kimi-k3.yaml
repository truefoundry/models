costs:
    - region: ap-south-2 # India CRIS pricing not documented in official docs
    - region: ap-south-1 # India CRIS pricing not documented in official docs
features:
    - function_calling
    - prompt_caching
    - cache_control
    - structured_output
    - system_messages
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: in.moonshotai.kimi-k3
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k3.html
status: active
supportedModes:
    - chat
    - responses
