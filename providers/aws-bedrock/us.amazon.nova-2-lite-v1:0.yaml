features:
    - function_calling
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - pdf
        - doc
    output:
        - text
mode: chat
model: us.amazon.nova-2-lite-v1:0
params:
    - defaultValue: 65536
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
