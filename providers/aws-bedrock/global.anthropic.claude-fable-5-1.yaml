features:
    - function_calling
    - tool_choice
    - prompt_caching
    - cache_control
    - system_messages
    - structured_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: global.anthropic.claude-fable-5-1
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-1.html
    - https://platform.claude.com/docs/en/about-claude/pricing
status: active
supportedModes:
    - chat
thinking: true
