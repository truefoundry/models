costs:
    - cache_creation_input_token_cost: 1.375e-7
      cache_creation_input_token_cost_per_hour: 2.2e-7
      cache_read_input_token_cost: 1.1e-8
      input_cost_per_token: 1.1e-7
      input_cost_per_token_batches: 5.5e-8
      output_cost_per_token: 5.5e-7
      output_cost_per_token_batches: 2.75e-7
      region: eu-west-3
      tiered_pricing:
          cache_read:
              - cost_per_token: 5.5e-8
                from: 100000
          cache_write:
              - cost_per_token: 6.875e-7
                from: 100000
          input:
              - cost_per_token: 5.5e-7
                from: 100000
          output:
              - cost_per_token: 2.75e-6
                from: 100000
          pricing_mode: marginal
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - cache_control
    - system_messages
    - mid_conversation_system_messages
    - structured_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 406
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: eu.anthropic.claude-haiku-5-5
provisioning: serverless
removeParams:
    - temperature
    - top_p
sources:
    - https://platform.claude.com/docs/en/models/haiku-5-5/overview
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages
status: active
supportedModes:
    - chat
thinking: true
