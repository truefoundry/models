      region: us-west-2
    - output_cost_per_image: 0.4
      region: us-east-2
    - output_cost_per_image: 0.4
      region: us-east-1
messages:
    options:
        - user
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: us.stability.stable-conservative-upscale-v1:0
params:
