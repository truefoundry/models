costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: us-east-1
features:
    - function_calling
    - system_messages
    - structured_output
    - json_output
limits:
    context_window: 256000
    max_input_tokens: 256000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ai21.jamba-1-5-large-v1:0
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 4096
      minValue: 0
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 0.9
      key: top_p
      maxValue: 1
      minValue: 0.01
    - defaultValue: 1
      key: "n"
      maxValue: 16
      minValue: 1
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-ai21-labs-jamba-1-5-large.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jamba.html
    - https://aws.amazon.com/blogs/aws/jamba-1-5-family-of-models-by-ai21-labs-is-now-available-in-amazon-bedrock/
    - https://www.ai21.com/jamba
status: active
supportedModes:
    - chat
