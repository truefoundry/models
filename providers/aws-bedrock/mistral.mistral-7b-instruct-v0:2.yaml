costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 2e-7
      region: us-west-2
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 2e-7
      region: us-east-1
    - input_cost_per_token: 2.5e-7
      output_cost_per_token: 3.4e-7
      region: sa-east-1
    - input_cost_per_token: 2e-7
      output_cost_per_token: 2.6e-7
      region: eu-west-3
    - input_cost_per_token: 2e-7
      output_cost_per_token: 2.6e-7
      region: eu-west-2
    - input_cost_per_token: 1.6e-7
      output_cost_per_token: 2.2e-7
      region: eu-west-1
    - input_cost_per_token: 1.7e-7
      output_cost_per_token: 2.3e-7
      region: ca-central-1
    - input_cost_per_token: 2e-7
      output_cost_per_token: 2.6e-7
      region: ap-southeast-2
    - input_cost_per_token: 1.8e-7
      output_cost_per_token: 2.4e-7
      region: ap-south-1
limits:
    context_window: 32000
    max_input_tokens: 32000
    max_output_tokens: 4096
    max_tokens: 4096
messages:
    options:
        - user
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: mistral.mistral-7b-instruct-v0:2
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 50
      key: top_k
      maxValue: 200
      minValue: 1
provisioning: serverless
removeParams:
    - "n"
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral-text-completion.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-mistral-7b-instruct.html
    - https://docs.mistral.ai/getting-started/models/
status: active
supportedModes:
    - chat
