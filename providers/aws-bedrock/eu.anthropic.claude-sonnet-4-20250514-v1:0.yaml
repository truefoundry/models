limits:
  max_input_tokens: 1000000
  max_output_tokens: 64000
  tool_use_system_prompt_tokens: 159
features: [function_calling, vision, chat, image]
params:
- key: max_tokens
  maxValue: 128000
- key: thinking
  properties:
    type:
      type: string
      enum: [enabled, disabled]
    budget_tokens:
      type: number
      minValue: 1024
      maxValue: 128000
  defaultValue: null
  withdrawParams: [top_k, top_p]
  skipValues:
  - disabled
  - null
- key: tool_choice
  type: non-view-manage-data
  defaultValue: null
  options:
  - value: none
    name: None
  - value: auto
    name: Auto
  - value: required
    name: Required
  - value: custom
    name: Custom
    schema:
      type: json
  skipValues:
  - null
  - []
  rule:
    default:
      condition: tools
      then: auto
      else: null
mode: chat
