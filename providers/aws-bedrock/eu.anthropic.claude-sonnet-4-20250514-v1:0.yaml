limits:
    max_input_tokens: 1000000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 159
features:
    - function_calling
    - vision
    - chat
    - image
params:
    -
        key: max_tokens
        maxValue: 128000
    -
        key: thinking
        type: number
        enum:
            - enabled
            - disabled
        minValue: 1024
        maxValue: 128000
        withdrawParams:
            - top_k
            - top_p
        skipValues:
            - disabled
            - null
    -
        key: tool_choice
        type: json
        options:
            -
                value: none
                name: None
            -
                value: auto
                name: Auto
            -
                value: required
                name: Required
            -
                value: custom
                name: Custom
                schema: null
                type: json
        skipValues:
            - null
        rule: null
        default:
            condition: tools
            then: auto
            else: null
mode: chat
