messages:
    options:
        - system
        - user
        - assistant
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 2048
      minValue: 1
    - defaultValue: 0.5
      key: temperature
      maxValue: 1
      minValue: 0
    - defaultValue: 0.9
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: null
      key: stop
      skipValues:
          - null
          - []
      type: array-of-strings
    - defaultValue: true
      key: stream
      type: boolean
type:
    primary: chat
    supported:
        - cache_control
