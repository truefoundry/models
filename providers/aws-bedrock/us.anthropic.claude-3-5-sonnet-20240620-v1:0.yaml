costs:
    -
        input_cost_per_token: 0.000003
        output_cost_per_token: 0.000015
        region: '*'
features: [chat, image, tools, function_calling, vision, tool_choice, response_schema, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 4096
mode: chat
model: us.anthropic.claude-3-5-sonnet-20240620-v1:0
params:
    -
        key: max_tokens
        maxValue: 8192
    -
        defaultValue: null
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema:
                    type: json
                value: custom
        rule:
            default:
                condition: tools
                else: null
                then: auto
        skipValues:
            - null
            - []
        type: non-view-manage-data
