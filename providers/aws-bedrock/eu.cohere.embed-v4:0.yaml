costs:
    - input_cost_per_token: 1.2e-7
      region: eu-west-3
    - input_cost_per_token: 1.2e-7
      region: eu-west-2
    - input_cost_per_token: 1.2e-7
      region: eu-west-1
    - input_cost_per_token: 1.2e-7
      region: eu-south-2
    - input_cost_per_token: 1.2e-7
      region: eu-south-1
    - input_cost_per_token: 1.2e-7
      region: eu-north-1
    - input_cost_per_token: 1.2e-7
      region: eu-central-2
    - input_cost_per_token: 1.2e-7
      region: eu-central-1
limits:
    context_window: 128000
    max_input_tokens: 128000
    output_vector_size: 1536
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: eu.cohere.embed-v4:0
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - max_tokens
    - reasoning_effort
sources:
    - https://docs.cohere.com/docs/cohere-embed
    - https://docs.cohere.com/reference/embed
    - https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-embed-v4.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-cohere-embed-v4.html
status: active
supportedModes:
    - embedding
