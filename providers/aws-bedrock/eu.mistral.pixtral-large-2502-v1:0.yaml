costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: eu-west-3
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: eu-west-1
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: eu-north-1
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: eu-central-1
features:
    - function_calling
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16000
    max_tokens: 16000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: eu.mistral.pixtral-large-2502-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 16000
      minValue: 1
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-mistral-ai-pixtral-large.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-mistral-pixtral-large.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-ids.html
status: active
supportedModes:
    - chat
