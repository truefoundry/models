    - https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-4-5.html
status: active
supportedModes:
    - chat
thinking: true
