features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - cache_control
    - system_messages
    - tool_choice
    - assistant_prefill
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
    tool_use_system_prompt_tokens: 496
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: global.anthropic.claude-opus-4-5-20251101-v1:0
params:
    - key: max_tokens
      maxValue: 64000
    - key: thinking
      maxValue: 128000
      minValue: 1024
      type: number
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
sources:
    - https://platform.claude.com/docs/en/docs/about-claude/models
    - https://platform.claude.com/docs/en/about-claude/pricing
