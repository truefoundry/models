canonical_model: amazon/nova-lite
costs:
    - region: ca-west-1
    - cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 1.6e-8
      input_cost_per_token: 6.4e-8
      input_cost_per_token_batches: 3.2e-8
      output_cost_per_token: 2.56e-7
      output_cost_per_token_batches: 1.28e-7
      region: ca-central-1
external_ids:
    artificial_analysis_id: 5c3dd927-48a3-4f3c-8045-9b135f62dfbb
    artificial_analysis_slug: nova-lite
features:
    - function_calling
    - prompt_caching
    - cache_control
    - system_messages
    - tool_choice
limits:
    context_window: 300000
    max_input_tokens: 300000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
        - image
        - video
        - doc
        - pdf
    output:
        - text
mode: chat
model: ca.amazon.nova-lite-v1:0
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
provisioning: serverless
removeParams:
    - "n"
    - reasoning_effort
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
    - https://docs.aws.amazon.com/nova/latest/userguide/tool-use.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-lite.html
status: active
supportedModes:
    - chat
