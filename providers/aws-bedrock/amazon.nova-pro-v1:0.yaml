features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - tools
limits:
    context_window: 300000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
        - image
        - video
        - pdf
        - doc
    output:
        - text
mode: chat
model: amazon.nova-pro-v1:0
params:
    - defaultValue: 5000
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
    - key: top_k
      maxValue: 128
      minValue: 0
removeParams:
    - "n"
