costs:
    -
        cache_creation_input_token_cost: 0.000004125
        cache_read_input_token_cost: 3.3e-7
        input_cost_per_token: 0.0000033
        output_cost_per_token: 0.0000165
        region: '*'
        tiered_pricing:
            cache_read:
                -
                    cost_per_token: 6.6e-7
                    from: 200000
            cache_write:
                -
                    cost_per_token: 0.00000825
                    from: 200000
            input:
                -
                    cost_per_token: 0.0000066
                    from: 200000
            output:
                -
                    cost_per_token: 0.00002475
                    from: 200000
features: [chat, image, tools, function_calling, vision, tool_choice, prompt_caching, response_schema, assistant_prefill, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 346
mode: chat
model: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
params:
    -
        key: max_tokens
        maxValue: 8192
    -
        defaultValue: null
        key: thinking
        properties:
            budget_tokens:
                maxValue: 128000
                minValue: 1024
                type: number
            type:
                enum:
                    - enabled
                    - disabled
                type: string
        skipValues:
            - disabled
            - null
        withdrawParams:
            - top_k
            - top_p
    -
        defaultValue: null
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema:
                    type: json
                value: custom
        rule:
            default:
                condition: tools
                else: null
                then: auto
        skipValues:
            - null
            - []
        type: non-view-manage-data
removeParams:
    - top_p
