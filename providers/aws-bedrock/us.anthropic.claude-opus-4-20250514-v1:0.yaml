model: us.anthropic.claude-opus-4-20250514-v1:0
costs:
    - region: us-west-2
    cache_creation_input_token_cost: 1.875e-5
    cache_read_input_token_cost: 1.5e-6
    input_cost_per_token: 1.5e-5
    output_cost_per_token: 7.5e-5
    - region: us-east-2
    cache_creation_input_token_cost: 1.875e-5
    cache_read_input_token_cost: 1.5e-6
    input_cost_per_token: 1.5e-5
    output_cost_per_token: 7.5e-5
    - region: us-east-1
    cache_creation_input_token_cost: 1.875e-5
    cache_read_input_token_cost: 1.5e-6
    input_cost_per_token: 1.5e-5
    output_cost_per_token: 7.5e-5
limits:
    max_input_tokens: 200000
    max_output_tokens: 32000
    tool_use_system_prompt_tokens: 159
features: [function_calling, vision, chat, image]
params:
    - key: max_tokens
    maxValue: 128000
    - key: thinking
    properties:
        type:
            type: string
            enum: [enabled, disabled]
        budget_tokens:
            type: number
            minValue: 1024
            maxValue: 128000
    defaultValue:
    withdrawParams: [top_k, top_p]
    skipValues: [disabled, null]
    - key: tool_choice
    type: non-view-manage-data
    defaultValue:
    options:
        - value: none
        name: None
        - value: auto
        name: Auto
        - value: required
        name: Required
        - value: custom
        name: Custom
        schema:
            type: json
    skipValues:
        -
        - []
    rule:
        default:
            condition: tools
            then: auto
            else:
mode: chat
