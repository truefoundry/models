model: us.anthropic.claude-3-5-sonnet-20241022-v2:0
costs:
    - region: us-west-2
      cache_creation_input_token_cost: 3.75e-6
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 3e-6
      output_cost_per_token: 1.5e-5
    - region: us-east-2
      cache_creation_input_token_cost: 3.75e-6
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 3e-6
      output_cost_per_token: 1.5e-5
    - region: us-east-1
      cache_creation_input_token_cost: 3.75e-6
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 3e-6
      output_cost_per_token: 1.5e-5
limits:
    max_input_tokens: 200000
    max_output_tokens: 8192
features:
    - function_calling
    - vision
    - chat
    - image
params:
    - key: max_tokens
      maxValue: 8192
    - key: tool_choice
      type: non-view-manage-data
      defaultValue: null
      options:
          - value: none
            name: None
          - value: auto
            name: Auto
          - value: required
            name: Required
          - value: custom
            name: Custom
            schema:
                type: json
      skipValues:
          - null
          - []
      rule:
          default:
              condition: tools
              then: auto
              else: null
mode: chat
