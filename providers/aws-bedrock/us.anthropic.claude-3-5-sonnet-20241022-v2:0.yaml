costs:
    - cache_creation_input_token_cost: 0.0000075
      cache_read_input_token_cost: 6.e-7
      input_cost_per_token: 0.000006
      input_cost_per_token_batches: 0.000003
      output_cost_per_token: 0.00003
      output_cost_per_token_batches: 0.000015
      region: us-west-2
    - cache_creation_input_token_cost: 0.0000075
      cache_read_input_token_cost: 6.e-7
      input_cost_per_token: 0.000006
      input_cost_per_token_batches: 0.000003
      output_cost_per_token: 0.00003
      output_cost_per_token_batches: 0.000015
      region: us-east-2
    - cache_creation_input_token_cost: 0.0000075
      cache_read_input_token_cost: 6.e-7
      input_cost_per_token: 0.000006
      input_cost_per_token_batches: 0.000003
      output_cost_per_token: 0.00003
      output_cost_per_token_batches: 0.000015
      region: us-east-1
features:
    - function_calling
    - vision
    - chat
    - image_input
    - prompt_caching
    - tool_choice
    - system_messages
    - assistant_prefill
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: us.anthropic.claude-3-5-sonnet-20241022-v2:0
params:
    - key: max_tokens
      maxValue: 8192
    - defaultValue: null
      key: tool_choice
      options:
          - name: None
            value: none
          - name: Auto
            value: auto
          - name: Required
            value: required
          - name: Custom
            schema:
                type: json
            value: custom
      rule:
          default:
              condition: tools
              else: null
              then: auto
      skipValues:
          - null
          - []
      type: non-view-manage-data
sources:
    - https://platform.claude.com/docs/en/docs/about-claude/models
    - https://platform.claude.com/docs/en/about-claude/model-deprecations
