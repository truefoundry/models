costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 3.e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - image
    - tools
    - function_calling
    - vision
    - tool_choice
    - prompt_caching
    - response_schema
    - assistant_prefill
    - pdf_input
limits:
    max_input_tokens: 200000
    max_output_tokens: 8192
mode: chat
model: us.anthropic.claude-3-5-sonnet-20241022-v2:0
params:
    - key: max_tokens
      maxValue: 8192
    - defaultValue: null
      key: tool_choice
      options:
          - name: None
            value: none
          - name: Auto
            value: auto
          - name: Required
            value: required
          - name: Custom
            schema:
                type: json
            value: custom
      rule:
          default:
              condition: tools
              else: null
              then: auto
      skipValues:
          - null
          - []
      type: non-view-manage-data
