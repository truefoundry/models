costs:
    - input_cost_per_image: 0.0006
      input_cost_per_second: 0.00014
      input_cost_per_token: 1.35e-7
      region: us-east-1
limits:
    max_input_tokens: 8172
modalities:
    input:
        - text
        - image
    output:
        - text
mode: unknown
model: amazon.nova-2-multimodal-embeddings-v1:0
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - max_tokens
sources:
    - https://docs.aws.amazon.com/ai/responsible-ai/nova-multimodal-embeddings/overview.html
    - https://docs.aws.amazon.com/nova/latest/nova2-userguide/embeddings.html
    - https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html
    - https://aws.amazon.com/nova/pricing/
