model: anthropic.claude-3-sonnet-20240229-v1:0
costs:
  - region: '*'
    input_cost_per_token: 0.000003
    output_cost_per_token: 0.000015
    cache_read_input_token_cost: 3.e-7
    cache_creation_input_token_cost: 0.00000375
limits:
  max_tokens: 4096
  max_input_tokens: 200000
  max_output_tokens: 4096
features: [chat, image, tools, function_calling, vision, tool_choice, response_schema, pdf_input]
params:
  - key: tool_choice
    type: non-view-manage-data
    defaultValue: null
    options:
      - value: none
        name: None
      - value: auto
        name: Auto
      - value: required
        name: Required
      - value: custom
        name: Custom
        schema:
          type: json
    skipValues:
      - null
      - []
    rule:
      default:
        condition: tools
        then: auto
        else: null
mode: chat
