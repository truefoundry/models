costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 8e-7
      output_cost_per_token: 0.0000032
      region: us-west-2
    - input_cost_per_token: 0.00000103
      output_cost_per_token: 0.00000412
      region: us-west-1
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 8e-7
      output_cost_per_token: 0.0000032
      region: us-east-2
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 8e-7
      output_cost_per_token: 0.0000032
      region: us-east-1
features:
    - function_calling
    - prompt_caching
    - system_messages
    - tool_choice
    # - structured_output is not supported
    - assistant_prefill
limits:
    context_window: 300000
    max_input_tokens: 300000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
        - image
        - video
        - doc
        - pdf
    output:
        - text
mode: chat
model: us.amazon.nova-pro-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
provisioning: serverless
removeParams:
    - "n"
    - reasoning_effort
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://docs.aws.amazon.com/nova/latest/userguide/tool-use.html
    - https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-pro.html
status: active
supportedModes:
    - chat
