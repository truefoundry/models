costs:
    - input_cost_per_token: 6.e-7
      output_cost_per_token: 0.0000025
      region: us-west-2
    - input_cost_per_token: 6.e-7
      output_cost_per_token: 0.0000025
      region: us-east-2
    - input_cost_per_token: 6.e-7
      output_cost_per_token: 0.0000025
      region: us-east-1
    - input_cost_per_token: 7.3e-7
      output_cost_per_token: 0.00000303
      region: sa-east-1
    - input_cost_per_token: 6.18e-7
      output_cost_per_token: 0.000002575
      region: ap-southeast-2
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 0.00000294
      region: ap-south-1
    - input_cost_per_token: 7.3e-7
      output_cost_per_token: 0.00000303
      region: ap-northeast-1
features:
    - function_calling
    - tool_choice
    - tools
    - chat
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 16000
    max_tokens: 16000
mode: chat
model: moonshot.kimi-k2-thinking
params:
    - defaultValue: 16000
      key: max_tokens
      maxValue: 16000
      minValue: 1
    - defaultValue: 1
      key: temperature
      maxValue: 1
      minValue: 0
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k2-thinking.html
    - https://huggingface.co/moonshotai/Kimi-K2-Thinking
thinking: true
