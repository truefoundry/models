costs:
    - region: ap-southeast-4
    - region: ap-southeast-2
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - structured_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: au.anthropic.claude-fable-5
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5.html
status: active
supportedModes:
    - chat
thinking: true
