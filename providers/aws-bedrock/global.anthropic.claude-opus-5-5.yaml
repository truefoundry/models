features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - prompt_caching
    - cache_control
    - tool_choice
    - mid_conversation_system_messages
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: global.anthropic.claude-opus-5-5
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
