costs:
    -
        input_cost_per_token: 3.7e-8
        output_cost_per_token: 1.48e-7
        region: '*'
features: [function_calling, prompt_caching, response_schema]
limits:
    max_input_tokens: 128000
    max_output_tokens: 10000
    max_tokens: 10000
mode: chat
model: apac.amazon.nova-micro-v1:0
