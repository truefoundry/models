costs:
    - input_cost_per_token: 2e-7
      output_cost_per_token: 4e-7
      region: us-east-1
deprecationDate: "2026-05-26"
features:
    - system_messages
isDeprecated: true
limits:
    context_window: 256000
    max_input_tokens: 256000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: ai21.jamba-1-5-mini-v1:0
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 4096
      minValue: 0
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - key: top_p
      minValue: 0.01
    - defaultValue: 1
      key: n
      maxValue: 16
      minValue: 1
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-jamba.html
status: deprecated
supportedModes:
    - chat
