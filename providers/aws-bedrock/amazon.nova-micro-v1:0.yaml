costs:
    - input_cost_per_token: 4.2e-8
      output_cost_per_token: 1.68e-7
      region: us-gov-west-1
    - cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 8.75e-9
      input_cost_per_token: 3.5e-8
      input_cost_per_token_batches: 1.75e-8
      output_cost_per_token: 1.4e-7
      output_cost_per_token_batches: 7e-8
      region: us-east-1
    - input_cost_per_token: 4.9e-8
      output_cost_per_token: 1.96e-7
      region: eu-west-2
    - input_cost_per_token: 3.7e-8
      output_cost_per_token: 1.48e-7
      region: ap-southeast-2
features:
    - assistant_prefill
    - function_calling
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_output_tokens: 5000
    max_tokens: 5000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: amazon.nova-micro-v1:0
params:
    - defaultValue: 5000
      key: max_tokens
      maxValue: 5000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0.00001
    - key: top_k
      maxValue: 128
      minValue: 0
provisioning: serverless
removeParams:
    - "n"
    - reasoning_effort
sources:
    - https://docs.aws.amazon.com/nova/latest/userguide/what-is-nova.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-micro.html
    - https://aws.amazon.com/nova/pricing/
    - https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
status: active
supportedModes:
    - chat
