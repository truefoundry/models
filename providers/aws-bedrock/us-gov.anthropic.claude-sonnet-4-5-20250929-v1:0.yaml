model: us-gov.anthropic.claude-sonnet-4-5-20250929-v1:0
costs:
    - region: us-gov-west-1
      cache_creation_input_token_cost: 4.5e-6
      cache_read_input_token_cost: 3.6e-7
      input_cost_per_token: 3.6e-6
      output_cost_per_token: 1.8e-5
    - region: us-gov-east-1
      cache_creation_input_token_cost: 4.5e-6
      cache_read_input_token_cost: 3.6e-7
      input_cost_per_token: 7.2e-6
      output_cost_per_token: 2.7e-5
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 159
features: [function_calling, vision, chat, image]
params:
    - key: max_tokens
      maxValue: 8192
    - key: thinking
      type: number
      enum: [enabled, disabled]
      minValue: 1024
      maxValue: 128000
      withdrawParams: [top_k, top_p]
      skipValues:
          - disabled
          - null
    - key: tool_choice
      type: json
      options:
          - value: none
            name: None
          - value: auto
            name: Auto
          - value: required
            name: Required
          - value: custom
            name: Custom
            schema:
            type: json
      skipValues:
          - null
      rule:
      default:
          condition: tools
          then: auto
          else: null
removeParams: [top_p]
mode: chat
