costs:
    -
        cache_creation_input_token_cost: 0.000001375
        cache_read_input_token_cost: 1.1e-7
        input_cost_per_token: 0.0000011
        output_cost_per_token: 0.0000055
        region: '*'
features: [chat, image, tools, function_calling, vision, tool_choice, prompt_caching, response_schema, assistant_prefill, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 346
mode: chat
model: eu.anthropic.claude-haiku-4-5-20251001-v1:0
params:
    -
        key: max_tokens
        maxValue: 64000
    -
        defaultValue: null
        key: thinking
        properties:
            budget_tokens:
                maxValue: 128000
                minValue: 1024
                type: number
            type:
                enum:
                    - enabled
                    - disabled
                type: string
        skipValues:
            - disabled
            - null
        withdrawParams:
            - top_k
            - top_p
removeParams:
    - top_p
