costs:
    - input_cost_per_token: 5e-7
      output_cost_per_token: 0.0000015
      region: us-west-2
    - input_cost_per_token: 5e-7
      output_cost_per_token: 0.0000015
      region: us-east-1
deprecationDate: "2026-02-19"
features:
    - function_calling
    - system_messages
    - structured_output
isDeprecated: true
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: cohere.command-r-v1:0
params:
    - defaultValue: 512
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.3
      key: temperature
      maxValue: 1
      minValue: 0
    - defaultValue: 0.75
      key: top_p
      maxValue: 0.99
      minValue: 0.01
    - defaultValue: 0
      key: top_k
      maxValue: 500
      minValue: 0
removeParams:
    - "n"
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-cohere-command-r-plus.html
    - https://docs.cohere.com/docs/command-r
