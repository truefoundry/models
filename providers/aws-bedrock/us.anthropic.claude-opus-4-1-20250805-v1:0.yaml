costs:
    -
        cache_creation_input_token_cost: 0.00001875
        cache_read_input_token_cost: 0.0000015
        input_cost_per_token: 0.000015
        output_cost_per_token: 0.000075
        region: '*'
features: [chat, image, tools, function_calling, vision, tool_choice, prompt_caching, response_schema, assistant_prefill, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 32000
    tool_use_system_prompt_tokens: 159
mode: chat
model: us.anthropic.claude-opus-4-1-20250805-v1:0
params:
    -
        key: max_tokens
        maxValue: 32000
    -
        defaultValue: null
        key: thinking
        properties:
            budget_tokens:
                maxValue: 128000
                minValue: 1024
                type: number
            type:
                enum:
                    - enabled
                    - disabled
                type: string
        skipValues:
            - disabled
            - null
        withdrawParams:
            - top_k
            - top_p
    -
        defaultValue: null
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema:
                    type: json
                value: custom
        rule:
            default:
                condition: tools
                else: null
                then: auto
        skipValues:
            - null
            - []
        type: non-view-manage-data
