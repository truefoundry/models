# CUE validation could not be run (CUE not installed in environment)
costs:
    - region: ca-west-1 # pricing not found in official docs
    - region: ca-central-1 # pricing not found in official docs
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - cache_control
    - structured_output
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: ca.anthropic.claude-haiku-5-5
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html
status: active
supportedModes:
    - chat
thinking: true
