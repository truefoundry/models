costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: us-west-2
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: us-west-1
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: us-east-2
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: us-east-1
features:
    - function_calling
    - system_messages
limits:
    context_window: 128000
    max_input_tokens: 122880
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - doc
mode: chat
model: us.writer.palmyra-x4-v1:0
params:
    - defaultValue: 16
      key: max_tokens
      maxValue: 8192
      minValue: 1
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
removeParams:
    - "n"
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-palmyra-x4.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-parameters-writer-palmyra.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference-supported-models-features.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference-support.html
