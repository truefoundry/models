costs:
    - region: eu-west-3
    - region: eu-west-2
    - region: eu-west-1
    - region: eu-south-2
    - region: eu-south-1
    - region: eu-north-1
    - region: eu-central-2
    - region: eu-central-1
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - structured_output
    - assistant_prefill
    - json_output
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: eu.anthropic.claude-sonnet-5
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html
    - https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
status: active
supportedModes:
    - chat
thinking: true
