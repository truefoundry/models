model: openai.gpt-oss-120b-1:0
costs:
    - region: "*"
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
limits:
    max_input_tokens: 128000
    max_output_tokens: 128000
features: [chat, function_calling, tool_choice, response_schema]
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - stream
    - stop
mode: chat
