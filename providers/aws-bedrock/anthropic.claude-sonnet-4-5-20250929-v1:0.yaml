features:
    - function_calling
    - vision
    - chat
    - image
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 159
mode: chat
model: anthropic.claude-sonnet-4-5-20250929-v1:0
params:
    -
        key: max_tokens
        maxValue: 8192
    -
        enum:
            - enabled
            - disabled
        key: thinking
        maxValue: 128000
        minValue: 1024
        skipValues:
            - disabled
            - null
        type: number
        withdrawParams:
            - top_k
            - top_p
    -
        default:
            condition: tools
            else: null
            then: auto
        key: tool_choice
        options:
            -
                name: None
                value: none
            -
                name: Auto
                value: auto
            -
                name: Required
                value: required
            -
                name: Custom
                schema: null
                type: json
                value: custom
        rule: null
        skipValues:
            - null
        type: json
removeParams:
    - top_p
