costs:
    - cache_creation_input_token_cost: 0.0000125
      cache_read_input_token_cost: 0.000001
      input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00005
      output_cost_per_token_batches: 0.000025
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - tool_choice
    - prompt_caching
    - assistant_prefill
    - code_execution
limits:
    context_window: 1000000
    max_output_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-fable-5
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
requiredParams:
    - max_tokens
sources:
    - test
status: active
supportedModes:
    - chat
thinking: true
