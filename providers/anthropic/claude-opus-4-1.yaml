costs:
    - cache_creation_input_token_cost: 0.00001875
      cache_read_input_token_cost: 0.0000015
      input_cost_per_token: 0.000015
      input_cost_per_token_batches: 0.0000075
      output_cost_per_token: 0.000075
      output_cost_per_token_batches: 0.0000375
      region: "*"
features:
    - function_calling
    - vision
    - image_input
    - chat
    - tools
    - tool_choice
    - prompt_caching
    - cache_control
    - system_messages
    - response_schema
    - assistant_prefill
    - pdf_input
    - text
    - code
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 32000
    max_tokens: 32000
mode: chat
model: claude-opus-4-1
params:
    - key: max_tokens
      maxValue: 32000
    - defaultValue: null
      key: thinking
      properties:
          budget_tokens:
              maxValue: 128000
              minValue: 1024
              type: number
          type:
              enum:
                  - enabled
                  - disabled
              type: string
      skipValues:
          - disabled
          - null
      withdrawParams:
          - top_k
          - top_p
removeParams:
    - temperature
    - top_p
thinking: true
