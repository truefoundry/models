costs:
    - cache_creation_input_token_cost: 1.25e-7
      cache_creation_input_token_cost_per_hour: 2e-7
      cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      input_cost_per_token_batches: 5e-8
      output_cost_per_token: 5e-7
      output_cost_per_token_batches: 2.5e-7
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-8
                from: 100000
          cache_write:
              - cost_per_token: 6.25e-7
                from: 100000
          input:
              - cost_per_token: 5e-7
                from: 100000
          output:
              - cost_per_token: 2.5e-6
                from: 100000
          pricing_mode: marginal
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - cache_control
    - system_messages
    - mid_conversation_system_messages
    - tool_choice
    - structured_output
    - assistant_prefill
    - json_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 286
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-haiku-5-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
retirementDate: "2027-10-07"
sources:
    - https://platform.claude.com/docs/en/models/haiku-5-5/overview
status: active
supportedModes:
    - chat
thinking: true
