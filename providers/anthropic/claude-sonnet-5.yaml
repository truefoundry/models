costs:
    - cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_per_hour: 0.000004
      cache_read_input_token_cost: 2e-7
      # Introductory pricing in effect through August 31, 2026 ($2 / $10 per MTok input/output).
      # Standard pricing of $3 / $15 per MTok takes effect on September 1, 2026.
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - assistant_prefill
    - structured_output
    - json_output
    - code_execution
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 354
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-5
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
retirementDate: "2027-06-30"
sources:
    - https://platform.claude.com/docs/en/models/sonnet-5/overview
status: active
supportedModes:
    - chat
thinking: true
