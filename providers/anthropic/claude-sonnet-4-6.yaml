costs:
- cache_creation_input_token_cost: 3.75e-06
  cache_read_input_token_cost: 3.0e-07
  input_cost_per_token: 3.0e-06
  input_cost_per_token_batches: 1.5e-06
  output_cost_per_token: 1.5e-05
  output_cost_per_token_batches: 7.5e-06
  region: '*'
  tiered_pricing:
    cache_read:
    - cost_per_token: 6.0e-07
      from: 200001
    cache_write:
    - cost_per_token: 7.5e-06
      from: 200001
    input:
    - cost_per_token: 6.0e-06
      from: 200001
    output:
    - cost_per_token: 2.25e-05
      from: 200001
features:
- function_calling
- vision
- tool_choice
- prompt_caching
- response_schema
- pdf_input
limits:
  context_window: 200000
  max_output_tokens: 64000
  max_tokens: 200000
  tool_use_system_prompt_tokens: 346
mode: chat
model: claude-sonnet-4-6
params:
- defaultValue: 256
  key: max_tokens
  maxValue: 64000
  minValue: 1
sources:
- https://platform.claude.com/docs/en/about-claude/pricing
- https://platform.claude.com/docs/en/about-claude/models/overview
- https://platform.claude.com/docs/en/about-claude/model-deprecations
- https://platform.claude.com/docs/en/about-claude/models/whats-new-claude-4-6
- https://platform.claude.com/docs/en/about-claude/models/migration-guide
