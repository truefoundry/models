costs:
    -   cache_creation_input_token_cost: 3.75e-06
        cache_read_input_token_cost: 3.0e-07
        input_cost_per_token: 3.0e-06
        input_cost_per_token_batches: 1.5e-06
        output_cost_per_token: 1.5e-05
        output_cost_per_token_batches: 7.5e-06
        region: '*'
        tiered_pricing:
            cache_read:
                -   cost_per_token: 6.0e-07
                    from: 200001
            cache_write:
                -   cost_per_token: 7.5e-06
                    from: 200001
            input:
                -   cost_per_token: 6.0e-06
                    from: 200001
            output:
                -   cost_per_token: 2.25e-05
                    from: 200001
features:
    - assistant_prefill
    - function_calling
    - pdf_input
    - prompt_caching
    - response_schema
    - tool_choice
    - vision
limits:
    context_window: 200000
    max_output_tokens: 64000
    max_tokens: 64000
mode: chat
model: claude-sonnet-4-6
params:
    -   defaultValue: 256
        key: max_tokens
        maxValue: 64000
        minValue: 1
sources:
    - https://www.anthropic.com/news/claude-sonnet-4-6
    - https://platform.claude.com/docs/en/about-claude/models/whats-new-claude-4-6
    - https://www.anthropic.com/claude/sonnet
