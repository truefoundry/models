costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 3.e-7
      input_cost_per_token: 0.000003
      input_cost_per_token_batches: 0.0000015
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 6.e-7
                from: 200000
          cache_write:
              - cost_per_token: 0.0000075
                from: 200000
          input:
              - cost_per_token: 0.000006
                from: 200000
          output:
              - cost_per_token: 0.0000225
                from: 200000
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
    - assistant_prefill
    - system_messages
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
    tool_use_system_prompt_tokens: 346
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-4-20250514
params:
    - key: max_tokens
      maxValue: 128000
    - defaultValue: null
      key: thinking
thinking: true
