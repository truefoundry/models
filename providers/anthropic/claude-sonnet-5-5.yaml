costs:
    - cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_per_hour: 0.000004
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - cache_control
    - system_messages
    - mid_conversation_system_messages
    - tool_choice
    - structured_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 286
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-sonnet-5-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - top_k
retirementDate: "2027-09-28"
sources:
    - https://platform.claude.com/docs/en/models/sonnet-5-5/overview
status: active
supportedModes:
    - chat
thinking: true
