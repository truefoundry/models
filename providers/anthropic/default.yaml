documentation:
    - https://platform.claude.com/docs/en/home
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/about-claude/models/overview
    - https://platform.claude.com/docs/en/about-claude/model-deprecations
    - https://platform.claude.com/docs/en/build-with-claude/effort
messages:
    options:
        - system
        - user
        - assistant
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 0
      key: top_k
      maxValue: 100
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
tool_pricing:
    web_search:
        per_thousand_requests: 10
