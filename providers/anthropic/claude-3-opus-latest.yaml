costs:
    -
        cache_creation_input_token_cost: 0.00001875
        cache_read_input_token_cost: 0.0000015
        input_cost_per_token: 0.000015
        input_cost_per_token_batches: 0.0000075
        output_cost_per_token: 0.000075
        output_cost_per_token_batches: 0.0000375
        region: "*"
features:
    - function_calling
    - vision
    - chat
    - image
    - tools
    - tool_choice
    - prompt_caching
    - response_schema
    - assistant_prefill
isDeprecated: true
limits:
    max_input_tokens: 200000
    max_output_tokens: 4096
    tool_use_system_prompt_tokens: 395
mode: chat
model: claude-3-opus-latest
params:
    -
        key: max_tokens
        maxValue: 64000
    -
        defaultValue: null
        key: thinking
        properties:
            budget_tokens:
                maxValue: 128000
                minValue: 1024
                type: number
            type:
                enum:
                    - enabled
                    - disabled
                type: string
        skipValues:
            - disabled
            - null
        withdrawParams:
            - top_k
            - top_p
removeParams:
    - temperature
    - top_p
requiredParams:
    - max_tokens
