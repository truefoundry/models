costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 3.e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 6.e-7
                from: 200000
          cache_write:
              - cost_per_token: 0.0000075
                from: 200000
          input:
              - cost_per_token: 0.000006
                from: 200000
          output:
              - cost_per_token: 0.0000225
                from: 200000
features:
    - chat
    - image
    - tools
    - function_calling
    - vision
    - tool_choice
    - prompt_caching
    - response_schema
    - assistant_prefill
    - pdf_input
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
    tool_use_system_prompt_tokens: 346
mode: chat
model: claude-sonnet-4-5-20250929
params:
    - key: max_tokens
      maxValue: 64000
    - defaultValue: null
      key: thinking
      properties:
          budget_tokens:
              maxValue: 128000
              minValue: 1024
              type: number
          type:
              enum:
                  - enabled
                  - disabled
              type: string
      skipValues:
          - disabled
          - null
      withdrawParams:
          - top_k
          - top_p
removeParams:
    - top_p
