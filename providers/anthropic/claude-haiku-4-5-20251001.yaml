costs:
    - cache_creation_input_token_cost: 0.00000125
      cache_read_input_token_cost: 1.e-7
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      region: "*"
features:
    - chat
    - image
    - tools
    - function_calling
    - vision
    - tool_choice
    - prompt_caching
    - response_schema
    - assistant_prefill
    - pdf_input
limits:
    max_input_tokens: 200000
    max_output_tokens: 64000
mode: chat
model: claude-haiku-4-5-20251001
params:
    - key: max_tokens
      maxValue: 64000
    - defaultValue: null
      key: thinking
      properties:
          budget_tokens:
              maxValue: 128000
              minValue: 1024
              type: number
          type:
              enum:
                  - enabled
                  - disabled
              type: string
      skipValues:
          - disabled
          - null
      withdrawParams:
          - top_k
          - top_p
removeParams:
    - top_p
