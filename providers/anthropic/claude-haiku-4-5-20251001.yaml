model: claude-haiku-4-5-20251001
costs:
  - region: '*'
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    cache_read_input_token_cost: 1.e-7
    cache_creation_input_token_cost: 0.00000125
    input_cost_per_token_batches: 5.e-7
    output_cost_per_token_batches: 0.0000025
limits:
  max_input_tokens: 200000
  max_output_tokens: 64000
features: [function_calling, vision, chat, image, tools, tool_choice, prompt_caching, response_schema, assistant_prefill, pdf_input]
params:
  - key: max_tokens
    maxValue: 64000
  - key: thinking
    properties:
      type:
        type: string
        enum:
          - enabled
          - disabled
      budget_tokens:
        type: number
        minValue: 1024
        maxValue: 128000
    defaultValue: null
    withdrawParams:
      - top_k
      - top_p
    skipValues:
      - disabled
      - null
removeParams:
  - top_p
mode: chat
