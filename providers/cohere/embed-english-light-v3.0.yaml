costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 0
      region: "*"
limits:
    context_window: 512
    max_input_tokens: 512
    output_vector_size: 384
modalities:
    input:
        - text
        - image
mode: embedding
model: embed-english-light-v3.0
removeParams:
    - temperature
    - stream
sources:
    - https://docs.cohere.com/docs/cohere-embed
    - https://docs.cohere.com/reference/embed
