limits:
    context_window: 8000
    max_output_tokens: 8000
    max_tokens: 8000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: tiny-aya-global
params:
    - key: max_tokens
      maxValue: 8000
provisioning: serverless
sources:
    - https://docs.cohere.com/docs/tiny-aya
status: active
supportedModes:
    - chat

# costs: not found in official docs (Tiny Aya pricing is not listed on cohere.com/pricing)
# features: function_calling, structured_output, json_output, prompt_caching, etc. not documented for Tiny Aya
