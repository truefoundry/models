costs:
    - input_cost_per_token: 0 # not found in official docs
      output_cost_per_token: 0 # not found in official docs
      region: "*"
features:
    - structured_output
    - function_calling
    - parallel_function_calling
    - json_output
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 64000
modalities:
    input:
        - image
        - text
    output:
        - text
mode: chat
model: command-a-plus-05-2026
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
sources:
    - https://docs.cohere.com/docs/command-a-plus
    - https://docs.cohere.com/reference/chat
status: active
supportedModes:
    - chat
thinking: true
