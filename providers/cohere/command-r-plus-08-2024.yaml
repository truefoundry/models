costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - response_schema
    - tools
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 4000
    max_tokens: 4000
mode: completion
model: command-r-plus-08-2024
sources:
    - https://docs.cohere.com/docs/command-r-plus
