costs:
    - input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - chat
    - function_calling
    - response_schema
limits:
    context_window: 128000
    max_output_tokens: 4000
    max_tokens: 4000
mode: completion
model: command-r-plus-08-2024
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 4000
      minValue: 1
sources:
    - https://docs.cohere.com/docs/command-r-plus
