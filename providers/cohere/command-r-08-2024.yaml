costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 4000
    max_tokens: 4000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: command-r-08-2024
params:
    - key: max_tokens
      maxValue: 4000
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.cohere.com/docs/command-r
status: active
supportedModes:
    - chat
