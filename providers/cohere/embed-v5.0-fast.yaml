limits:
    context_window: 128000
    output_vector_size: 2048
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - embedding
mode: embedding
model: embed-v5.0-fast
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stream
    - reasoning_effort
sources:
    - https://docs.cohere.com/docs/embeddings
    - https://docs.cohere.com/v2/docs/models
    - https://docs.cohere.com/docs/how-does-cohere-pricing-work
    - https://docs.cohere.com/docs/cohere-embed
status: active
supportedModes:
    - embedding

