costs:
    - input_cost_per_image: 0.0001
      input_cost_per_token: 1.e-7
      output_cost_per_token: 0
      region: "*"
features:
    - image_input
    - embedding_image_input
limits:
    context_window: 512
    max_input_tokens: 512
mode: embedding
model: embed-english-v3.0
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 512
      minValue: 1
removeParams:
    - temperature
sources:
    - https://docs.cohere.com/docs/cohere-embed
    - https://docs.cohere.com/v2/reference/embed
