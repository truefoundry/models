costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 32000
    max_tokens: 32000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: command-a-reasoning-08-2025
params:
