      key: max_tokens
      maxValue: 32000
      minValue: 1
sources:
    - https://docs.cohere.com/docs/command-a-reasoning
    - https://docs.cohere.com/docs/reasoning
    - https://docs.cohere.com/docs/rate-limits
thinking: true
