costs:
    - cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 0.0000011
      output_cost_per_token: 0.0000044
      region: "*"
features:
    - function_calling
    - chat
    - tools
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - image
mode: chat
model: o4-mini
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
removeParams:
    - top_p
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - max_tokens
    - temperature
