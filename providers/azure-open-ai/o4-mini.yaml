      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
    - top_p
    - max_tokens
    - temperature
sources:
