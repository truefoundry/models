costs:
    - input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tools
    - tool_choice
    - prompt_caching
limits:
    max_input_tokens: 128000
    max_output_tokens: 4096
modalities:
    input:
        - image
mode: chat
model: gpt-4o-2024-05-13
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      type: string
