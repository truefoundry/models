costs:
    - cache_read_input_token_cost: 1.38e-7
      input_cost_per_token: 1.375e-6
      output_cost_per_token: 1.1e-5
      region: datazone_us
    - cache_read_input_token_cost: 1.38e-7
      input_cost_per_token: 1.375e-6
      output_cost_per_token: 1.1e-5
      region: datazone_eu
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 1e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: responses
model: gpt-5-codex
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
retirementDate: "2027-03-17"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
status: active
supportedModes:
    - responses
thinking: true
