costs:
    - input_cost_per_page: 0.0015
      region: global
limits:
    context_window: 8192
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - image
    output:
        - text
mode: unknown # schema has no `ocr` mode; model is a vision-based document parser (image-to-text / markdown)
model: Cohere-parse-v5
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - response_format
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-12-15"
sources:
    - https://ai.azure.com/catalog/models/Cohere-parse-v5
    - https://docs.cohere.com/docs/parse
status: preview
supportedModes:
    - unknown
