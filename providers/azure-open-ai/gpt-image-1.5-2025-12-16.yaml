costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_image_token: 0.000008
      input_cost_per_token: 0.000005
      output_cost_per_image_token: 0.000032
      output_cost_per_token: 0.00001
      region: "*"
limits:
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: gpt-image-1.5-2025-12-16
removeParams:
    - tool_choice
    - parallel_tool_calls
    - stop
    - top_p
sources:
    - https://developers.openai.com/docs/pricing
    - https://developers.openai.com/docs/guides/image-generation
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
