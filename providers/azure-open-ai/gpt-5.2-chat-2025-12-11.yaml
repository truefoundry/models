costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - image
        - pdf
mode: completion
model: gpt-5.2-chat-2025-12-11
