costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 111616
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.2-chat-2025-12-11
params:
    - key: max_tokens
      maxValue: 16384
pricing:
    standard:
        - cache_read_input_token_cost: 1.75e-7
          input_cost_per_token: 0.00000175
          output_cost_per_token: 0.000014
          region: "*"
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
status: preview
supportedModes:
    - chat
