costs:
    - cache_read_input_token_cost: 5.e-9
      input_cost_per_token: 5.e-8
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 4096
modalities:
    input:
        - image
        - pdf
mode: completion
model: gpt-5-nano
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
