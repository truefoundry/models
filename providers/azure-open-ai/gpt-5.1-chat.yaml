costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: global
    - cache_read_input_token_cost: 1.4e-7
      input_cost_per_token: 0.00000138
      output_cost_per_token: 0.000011
      region: datazone_us
    - cache_read_input_token_cost: 1.4e-7
      input_cost_per_token: 0.00000138
      output_cost_per_token: 0.000011
      region: datazone_eu
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 111616
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.1-chat
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: preview
supportedModes:
    - chat
thinking: true
