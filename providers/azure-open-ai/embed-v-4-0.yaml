costs:
    - input_cost_per_image_token: 4.7e-7
      input_cost_per_token: 1.2e-7
      output_cost_per_token: 0.0
      region: "*"
limits:
    context_window: 128000
    max_input_tokens: 128000
    output_vector_size: 1536
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: embed-v-4-0
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - response_format
    - stop
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://docs.cohere.com/docs/cohere-embed
    - https://ai.azure.com/catalog/models/embed-v-4-0
status: active
supportedModes:
    - embedding
