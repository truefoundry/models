costs:
    - cache_creation_input_token_cost: 0.0000125
      cache_creation_input_token_cost_per_hour: 0.00002
      cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00005
      output_cost_per_token_batches: 0.000025
      region: global
    - cache_creation_input_token_cost: 0.00001375
      cache_creation_input_token_cost_per_hour: 0.000022
      cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 0.000011
      input_cost_per_token_batches: 0.0000055
      output_cost_per_token: 0.000055
      output_cost_per_token_batches: 0.0000275
      region: datazone_us
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - assistant_prefill
    - json_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-fable-5-1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
retirementDate: "2027-12-05"
sources:
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://ai.azure.com/catalog/models/claude-fable-5-1
status: preview
supportedModes:
    - chat
thinking: true
