costs:
    - cache_creation_input_token_cost: 1.25e-5
      cache_creation_input_token_cost_per_hour: 2e-5
      cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 1e-5
      output_cost_per_token: 5e-5
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-fable-5-1
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
retirementDate: "2027-12-05"
sources:
    - https://ai.azure.com/catalog/models/claude-fable-5-1
status: preview
supportedModes:
    - chat
thinking: true
