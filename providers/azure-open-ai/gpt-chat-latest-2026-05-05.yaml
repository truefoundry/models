features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 111616
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-chat-latest-2026-05-05
provisioning: serverless
# costs not found in official docs (Azure pricing page does not yet list this preview model)
sources:
    - https://ai.azure.com/catalog/models/gpt-chat-latest
    - https://developers.openai.com/api/docs/models/chat-latest
status: preview
supportedModes:
    - chat
thinking: true
