costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      output_cost_per_token: 3e-5
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1e-6
                from: 272000
          input:
              - cost_per_token: 1e-5
                from: 272000
          output:
              - cost_per_token: 4.5e-5
                from: 272000
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.5-2026-04-24
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
sources:
    - https://raw.githubusercontent.com/BerriAI/litellm/refs/heads/main/model_prices_and_context_window.json
status: active
supportedModes:
    - chat
    - responses
thinking: true
