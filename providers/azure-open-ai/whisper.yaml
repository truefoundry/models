costs:
    - input_cost_per_second: 0.0001
      output_cost_per_second: 0.0001
      region: "*"
messages:
    options:
        - user
modalities:
    input:
        - audio
    output:
        - text
mode: audio_transcription
model: whisper
params:
    - defaultValue: 0
      key: temperature
      maxValue: 1
      minValue: 0
provisioning: serverless
removeParams:
    - max_tokens
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-12-15"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/whisper-quickstart
status: active
supportedModes:
    - audio_transcription
    - audio_translation
