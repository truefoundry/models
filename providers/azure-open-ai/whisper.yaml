costs:
    - input_cost_per_second: 0.0001
      output_cost_per_second: 0.0001
      region: "*"
deprecationDate: "2026-06-18"
messages:
    options:
        - user
modalities:
    input:
        - audio
    output:
        - text
mode: audio_transcription
model: whisper
params:
    - defaultValue: 0
      key: temperature
      maxValue: 1
      minValue: 0
removeParams:
    - max_tokens
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
supportedModes:
    - audio_translation
