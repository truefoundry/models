costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 2.5e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 2.5e-6
                from: 200000
          output:
              - cost_per_token: 5e-6
                from: 200000
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: grok-4.3
provisioning: serverless
sources:
    - https://azure.microsoft.com/pricing/details/ai-foundry-models/grok/
status: preview
supportedModes:
    - chat
thinking: true
