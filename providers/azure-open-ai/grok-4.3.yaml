costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 2.5e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 2.5e-6
                from: 200000
          output:
              - cost_per_token: 5e-6
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - tool_choice
    - prompt_caching
limits:
    max_input_tokens: 200000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: grok-4.3
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
status: preview
supportedModes:
    - chat
thinking: true
