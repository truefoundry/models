costs:
    - input_cost_per_token: 1e-7
      output_cost_per_token: 0
      region: "*"
limits:
    context_window: 512
    max_input_tokens: 512
    output_vector_size: 1024
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: Cohere-embed-v3-multilingual
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://ai.azure.com/catalog/models/Cohere-embed-v3-multilingual
    - https://docs.cohere.com/docs/cohere-embed
status: active
supportedModes:
    - embedding
