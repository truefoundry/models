costs:
    - cache_read_input_token_cost: 1.375e-7
      input_cost_per_token: 0.000001375
      output_cost_per_token: 0.000011
      region: datazone_us
    - cache_read_input_token_cost: 1.375e-7
      input_cost_per_token: 0.000001375
      output_cost_per_token: 0.000011
      region: datazone_eu
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
retirementDate: "2027-02-06"
status: active
supportedModes:
    - chat
thinking: true
