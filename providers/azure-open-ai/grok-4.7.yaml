costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 2e-6
      output_cost_per_token: 6e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1e-6
                from: 200000
          input:
              - cost_per_token: 4e-6
                from: 200000
          output:
              - cost_per_token: 1.2e-5
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 500000
    max_input_tokens: 500000
    max_output_tokens: 500000
    max_tokens: 500000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.7
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://docs.x.ai/developers/models/grok-4.7
status: active
supportedModes:
    - chat
thinking: true
