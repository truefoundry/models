model: command-r-plus
mode: chat
features:
    - function_calling
modalities:
    input:
        - text
    output:
        - text
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 4096
    max_tokens: 4096
costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
sources:
    - https://docs.cohere.com/docs/command-r-plus
