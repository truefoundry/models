costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 262000
    max_input_tokens: 262000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: grok-4-20-non-reasoning
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
retirementDate: "2027-04-06"
status: preview
supportedModes:
    - chat
