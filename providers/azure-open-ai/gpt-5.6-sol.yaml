costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: datazone_us
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.1e-6
                from: 272000
          input:
              - cost_per_token: 1.1e-5
                from: 272000
          output:
              - cost_per_token: 4.95e-5
                from: 272000
          pricing_mode: cumulative
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: datazone_eu
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.1e-6
                from: 272000
          input:
              - cost_per_token: 1.1e-5
                from: 272000
          output:
              - cost_per_token: 4.95e-5
                from: 272000
          pricing_mode: cumulative
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      output_cost_per_token: 3e-5
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1e-6
                from: 272000
          input:
              - cost_per_token: 1e-5
                from: 272000
          output:
              - cost_per_token: 4.5e-5
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.6-sol
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2028-01-11"
status: active
supportedModes:
    - chat
    - responses
thinking: true
