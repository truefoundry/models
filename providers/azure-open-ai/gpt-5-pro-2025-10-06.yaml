costs:
    - input_cost_per_token: 0.000015
      output_cost_per_token: 0.00012
      region: global
deprecationDate: "2027-04-07"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5-pro-2025-10-06
params:
    - defaultValue: 128000
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
    - stream
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure?pivots=azure-openai&tabs=global-standard-aoai%2Cstandard-chat-completions%2Cglobal-standard#gpt-5
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
status: active
supportedModes:
    - responses
thinking: true
