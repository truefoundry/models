costs:
    - input_cost_per_token: 1e-7
      output_cost_per_token: 0
      region: "*"
deprecationDate: "2027-04-15"
limits:
    max_input_tokens: 8191
    max_tokens: 8191
    output_vector_size: 1536
modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: text-embedding-ada-002-2
provisioning: serverless
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - max_tokens
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
status: active
supportedModes:
    - embedding
