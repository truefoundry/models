costs:
    - input_cost_per_second: 0.0001
      output_cost_per_second: 0.0001
      region: "*"
modalities:
    input:
        - audio
    output:
        - text
mode: audio_transcription
model: whisper-1
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-12-15"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: active
supportedModes:
    - audio_translation
    - audio_transcription
