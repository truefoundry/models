      output_cost_per_second: 0.0001
      region: "*"
deprecationDate: "2026-06-18"
modalities:
    input:
        - audio
    output:
        - text
mode: audio_transcription
model: whisper-1
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/whisper-quickstart
status: active
supportedModes:
    - audio_translation
    - audio_transcription
