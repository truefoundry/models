modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: MAI-Image-2.5-Pro
provisioning: serverless
# costs not published on the official Azure OpenAI pricing page for this model
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-image
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure-region-availability
    - https://ai.azure.com/catalog/models/MAI-Image-2.5-Pro
status: preview
supportedModes:
    - image
