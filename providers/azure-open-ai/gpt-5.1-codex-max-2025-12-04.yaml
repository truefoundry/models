costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: responses
model: gpt-5.1-codex-max-2025-12-04
params:
    - defaultValue: 128000
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
retirementDate: "2026-12-05"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: active
supportedModes:
    - responses
thinking: true
