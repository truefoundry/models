costs:
    - input_cost_per_token: 1.5e-6
      output_cost_per_token: 7.5e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - assistant_prefill
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: mistral-medium-3-5
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.mistral.ai/models/model-cards/mistral-medium-3-5-26-04
    - https://docs.mistral.ai/getting-started/models/models_overview/
supportedModes:
    - chat
