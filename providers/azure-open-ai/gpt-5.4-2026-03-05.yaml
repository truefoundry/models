deprecationDate: "2027-09-05"
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - system_messages
    - prompt_caching
    - tool_choice
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.4-2026-03-05
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
supportedModes:
    - chat
thinking: true
