costs:
    - input_cost_per_token: 8e-6
      output_cost_per_token: 2.4e-5
      region: "*"
features:
    - function_calling
limits:
    context_window: 32000
    max_input_tokens: 32000
    max_output_tokens: 32000
    max_tokens: 32000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Mistral-large
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-from-partners
status: active
supportedModes:
    - chat
