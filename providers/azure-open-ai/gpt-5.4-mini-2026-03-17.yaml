costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 7.5e-7
      output_cost_per_token: 0.0000045
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 400000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.4-mini-2026-03-17
params:
    - key: max_tokens
      maxValue: 128000
    - key: reasoning_effort
      type: string
provisioning: serverless
status: active
supportedModes:
    - chat
    - responses
thinking: true
