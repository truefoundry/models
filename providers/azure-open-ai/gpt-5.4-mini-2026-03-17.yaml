      output_cost_per_token: 0.0000045
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.4-mini-2026-03-17
params:
