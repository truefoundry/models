costs:
    - cache_read_input_token_cost: 3.1e-7
      input_cost_per_token: 1.21e-6
      output_cost_per_token: 4.84e-6
      region: datazone_us
    - cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 1.1e-6
      output_cost_per_token: 4.4e-6
      region: "*"
deprecationDate: "2026-10-16"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: o4-mini-2025-04-16
params:
    - defaultValue: 4096
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - n
    - parallel_tool_calls
    - max_tokens
    - stop
retirementDate: "2026-10-16"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
