costs:
    - cache_read_input_token_cost: 5.e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - function_calling
    - chat
    - tools
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - image
mode: completion
model: o3
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - stream
    - max_tokens
