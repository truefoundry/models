costs:
    -
        cache_read_input_token_cost: 5.e-7
        input_cost_per_token: 0.000002
        output_cost_per_token: 0.000008
        region: "*"
features:
    - function_calling
    - vision
    - chat
    - tools
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
mode: chat
model: o3
params:
    -
        defaultValue: 1000
        key: max_completion_tokens
        maxValue: 100000
        minValue: 1
    -
        defaultValue: null
        key: response_format
        options:
            -
                name: Text
                value: null
            -
                name: JSON Object
                schema:
                    properties:
                        type:
                            type: string
                            value: json_object
                    type: object
                value: json_object
            -
                name: JSON Schema
                params:
                    defaultValue: null
                    key: json_schema
                    skipValues:
                        - null
                    type: json
                schema:
                    properties:
                        json_schema:
                            type: object
                        type:
                            type: string
                            value: json_schema
                    type: object
                value: json_schema
        skipValues:
            - null
        type: string
    -
        defaultValue: medium
        key: reasoning_effort
        options:
            -
                name: Low
                value: low
            -
                name: Medium
                value: medium
            -
                name: High
                value: high
        type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - stream
    - max_tokens
