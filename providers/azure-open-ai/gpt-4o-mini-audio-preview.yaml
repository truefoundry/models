canonical_model: openai/gpt-4o-mini-audio-preview
costs:
    - input_cost_per_audio_token: 1e-5
      input_cost_per_token: 1.5e-7
      output_cost_per_audio_token: 2e-5
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: gpt-4o-mini-audio-preview
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-services/openai/audio-completions-quickstart
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: preview
supportedModes:
    - chat
