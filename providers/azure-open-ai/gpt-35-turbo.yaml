costs:
    - input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - function_calling
    - chat
    - tools
    - tool_choice
limits:
    max_input_tokens: 4097
    max_output_tokens: 4096
mode: chat
model: gpt-35-turbo
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
