costs:
    - input_cost_per_token: 1.4e-7
      output_cost_per_token: 0
      region: "*"
deprecationDate: "2027-05-20"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - structured_output
    - prompt_caching
    - json_output
limits:
    context_window: 200000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: model-router-2025-11-18
params:
    - key: reasoning_effort
      type: string
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/model-router
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-router
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/model-router/
status: active
supportedModes:
    - chat
thinking: true
