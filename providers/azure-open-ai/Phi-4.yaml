limits:
    context_window: 16384
    max_input_tokens: 16384
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Phi-4
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
removeParams:
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-from-partners
status: active
supportedModes:
    - chat
