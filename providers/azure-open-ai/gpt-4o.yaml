costs:
    - cache_read_input_token_cost: 1.25e-6
      input_cost_per_token: 2.5e-6
      output_cost_per_token: 1e-5
      region: global
    - cache_read_input_token_cost: 1.375e-6
      input_cost_per_token: 2.75e-6
      output_cost_per_token: 1.1e-5
      region: datazone_us
    - cache_read_input_token_cost: 1.375e-6
      input_cost_per_token: 2.75e-6
      output_cost_per_token: 1.1e-5
      region: datazone_eu
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-4o
params:
    - key: max_tokens
      maxValue: 16384
provisioning: serverless
retirementDate: "2026-10-01"
status: active
supportedModes:
    - chat
    - responses
