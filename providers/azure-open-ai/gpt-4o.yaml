costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 128000
    max_output_tokens: 16384
modalities:
    input:
        - image
mode: completion
model: gpt-4o
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      type: string
