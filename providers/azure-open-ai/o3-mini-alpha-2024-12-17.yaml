features:
    - function_calling
    - structured_output
    - system_messages
    - prompt_caching
    - tool_choice
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: o3-mini-alpha-2024-12-17
params:
    - defaultValue: 100000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - temperature
    - top_p
    - stop
    - "n"
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/legacy-models
supportedModes:
    - chat
thinking: true
