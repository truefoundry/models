deprecationDate: "2026-12-15"
limits:
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: gpt-4o-mini-tts-2025-12-15
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/guides/text-to-speech
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
