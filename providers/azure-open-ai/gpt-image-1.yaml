costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_token: 0.000005
      region: "*"
deprecationDate: "2026-05-15"
limits:
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: gpt-image-1
removeParams:
    - stream
    - tool_choice
    - parallel_tool_calls
    - stop
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://developers.openai.com/api/docs/models/gpt-image-1
