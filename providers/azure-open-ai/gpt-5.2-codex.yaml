costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: responses
model: gpt-5.2-codex
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2027-07-13"
status: active
supportedModes:
    - responses
thinking: true
