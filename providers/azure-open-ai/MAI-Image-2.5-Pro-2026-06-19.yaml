limits:
    context_window: 32000
    max_input_tokens: 32000
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: MAI-Image-2.5-Pro-2026-06-19
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
retirementDate: "2026-10-01"
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-mai-image
status: preview
supportedModes:
    - image

