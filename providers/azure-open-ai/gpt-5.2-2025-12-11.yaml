costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 4096
modalities:
    input:
        - image
        - pdf
mode: completion
model: gpt-5.2-2025-12-11
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 272000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
