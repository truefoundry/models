costs:
    - cache_read_input_token_cost: 5.5e-9
      input_cost_per_token: 5.5e-8
      output_cost_per_token: 4.4e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - image
        - pdf
mode: chat
model: gpt-5-nano-2025-08-07
supportedModes:
    - chat
