costs:
    - cache_read_input_token_cost: 2.5e-6
      input_cost_per_token: 1e-5
      output_cost_per_token: 4e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
isDeprecated: true
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: o3-deep-research-2025-06-26
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - n
    - tool_choice
    - parallel_tool_calls
retirementDate: "2026-11-19"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/deep-research
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://developers.openai.com/api/docs/models/o3-deep-research
status: deprecated
supportedModes:
    - chat
    - responses
thinking: true
