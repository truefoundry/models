model: computer-use-preview-2025-04-15
mode: chat
status: preview
thinking: true
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - system_messages
    - tool_choice
modalities:
    input:
        - text
        - image
    output:
        - text
costs:
    - region: "*"
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000012
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 1024
    max_tokens: 1024
params:
    - key: max_tokens
      defaultValue: 128
      minValue: 1
      maxValue: 1024
