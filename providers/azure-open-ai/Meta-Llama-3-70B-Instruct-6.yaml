costs:
    - input_cost_per_token: 1.1e-6
      output_cost_per_token: 3.7e-7
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 2048
    max_tokens: 2048
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Meta-Llama-3-70B-Instruct-6
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-from-partners
status: active
supportedModes:
    - chat
