# costs: not found in official docs — gpt-oss-20b is only available via managed compute and Foundry Local (no per-token pricing published)
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 131072
    max_output_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-oss-20b
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: provisioned
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
status: preview
supportedModes:
    - chat
thinking: true
