deprecationDate: "2026-12-26"
features:
    - system_messages
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: o3-deep-research-2025-06-26-ev3
params:
    - defaultValue: 100000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      type: string
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - response_format
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/models/o3-deep-research
    - https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/deep-research
supportedModes:
    - chat
thinking: true
