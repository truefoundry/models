costs:
    - output_cost_per_second: 0.1
      region: "*"
modalities:
    input:
        - text
    output:
        - video
mode: video
model: sora-2
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: preview
supportedModes:
    - video
