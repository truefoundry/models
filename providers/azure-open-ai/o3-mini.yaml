costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 0.0000011
      output_cost_per_token: 0.0000044
      region: "*"
deprecationDate: "2026-08-02"
features:
    - function_calling
    - tools
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: o3-mini
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - stream
    - max_tokens
supportedModes:
    - chat
thinking: true
