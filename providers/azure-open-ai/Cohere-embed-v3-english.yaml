costs:
    - input_cost_per_token: 1e-7
      output_cost_per_token: 0.0
      region: "*"
limits:
    context_window: 512
    max_input_tokens: 512
    output_vector_size: 1024
modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: Cohere-embed-v3-english
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - response_format
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
    - stop
status: active
supportedModes:
    - embedding
