costs:
    - cache_creation_input_token_cost: 3.75e-6
      cache_creation_input_token_cost_per_hour: 6e-6
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 3e-6
      output_cost_per_token: 1.5e-5
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - assistant_prefill
    - cache_control
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-4-6
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - max
      type: string
provisioning: serverless
retirementDate: "2027-02-10"
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
status: active
supportedModes:
    - chat
thinking: true
