costs:
    - cache_read_input_token_cost: 1.e-7
      input_cost_per_token: 4.e-7
      input_cost_per_token_batches: 2.e-7
      output_cost_per_token: 0.0000016
      output_cost_per_token_batches: 8.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 1047576
    max_output_tokens: 32768
    max_tokens: 4096
modalities:
    input:
        - image
mode: completion
model: gpt-4.1-mini
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 32768
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
removeParams:
    - max_tokens
