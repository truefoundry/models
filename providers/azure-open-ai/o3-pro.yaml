costs:
    - input_cost_per_token: 0.00002
      input_cost_per_token_batches: 0.00001
      output_cost_per_token: 0.00008
      output_cost_per_token_batches: 0.00004
      region: "*"
deprecationDate: "2026-12-10"
features:
    - function_calling
    - structured_output
    - tool_choice
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: o3-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - temperature
    - top_p
    - "n"
    - parallel_tool_calls
    - stream
sources:
    - https://developers.openai.com/api/docs/models/o3-pro
thinking: true
