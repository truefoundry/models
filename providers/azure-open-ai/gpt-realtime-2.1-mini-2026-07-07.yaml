features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 256000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-2.1-mini-2026-07-07
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
retirementDate: "2027-06-25"
sources:
    - https://ai.azure.com/catalog/models/gpt-realtime-2.1-mini
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/realtime-2
status: preview
supportedModes:
    - realtime
thinking: true

