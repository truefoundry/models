costs:
    -
        cache_read_input_token_cost: 1.25e-7
        input_cost_per_token: 0.00000125
        output_cost_per_token: 0.00001
        region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - chat
    - image
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 4096
mode: chat
model: gpt-5-chat-latest
params:
    -
        defaultValue: 20000
        key: max_completion_tokens
        maxValue: 32768
        minValue: 1
    -
        defaultValue: null
        key: response_format
        options:
            -
                name: Text
                value: null
            -
                name: JSON Object
                schema:
                    properties:
                        type:
                            type: string
                            value: json_object
                    type: object
                value: json_object
            -
                name: JSON Schema
                params:
                    defaultValue: null
                    key: json_schema
                    skipValues:
                        - null
                    type: json
                schema:
                    properties:
                        json_schema:
                            type: object
                        type:
                            type: string
                            value: json_schema
                    type: object
                value: json_schema
        skipValues:
            - null
        type: string
    -
        defaultValue: null
        enum:
            - low
            - medium
            - high
            - null
        key: verbosity
        skipValues:
            - null
    -
        defaultValue: null
        key: reasoning
        nestedOptions:
            -
                value:
                    effort: minimal
                view: minimal
            -
                value:
                    effort: low
                view: low
            -
                value:
                    effort: medium
                view: medium
            -
                value:
                    effort: high
                view: high
        skipValues:
            - null
removeParams:
    - temperature
    - top_p
    - "n"
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - max_tokens
