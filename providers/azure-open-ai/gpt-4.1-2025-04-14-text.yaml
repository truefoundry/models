costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 2.2e-6
      input_cost_per_token_batches: 1.1e-6
      output_cost_per_token: 8.8e-6
      output_cost_per_token_batches: 4.4e-6
      region: datazone_us
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 2e-6
      input_cost_per_token_batches: 1e-6
      output_cost_per_token: 8e-6
      output_cost_per_token_batches: 4e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 1047576
    max_input_tokens: 1047576
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-4.1-2025-04-14-text
params:
    - key: max_tokens
      maxValue: 32768
    - key: max_completion_tokens
      maxValue: 32768
provisioning: serverless
retirementDate: "2026-10-14"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
status: active
supportedModes:
    - chat
