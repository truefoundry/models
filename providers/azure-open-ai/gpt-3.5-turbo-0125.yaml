costs:
    - input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
limits:
    max_input_tokens: 16384
    max_output_tokens: 4096
mode: completion
model: gpt-3.5-turbo-0125
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
