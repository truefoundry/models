costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: datazone_us
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      output_cost_per_token: 3e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-chat-latest-2026-08-06
params:
    - key: max_completion_tokens
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - medium
      type: string
provisioning: serverless
removeParams:
    - max_tokens
retirementDate: "2026-12-02"
status: preview
supportedModes:
    - chat
thinking: true
