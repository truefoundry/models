costs:
    - cache_read_input_token_cost: 0.000003
      input_cost_per_token: 0.00003
      output_cost_per_token: 0.00018
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 0.000006
                from: 272000
          input:
              - cost_per_token: 0.00006
                from: 272000
          output:
              - cost_per_token: 0.00027
                from: 272000
deprecationDate: "2027-09-05"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5.4-pro-2026-03-05
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: reasoning_effort
      type: string
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-retirements
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
thinking: true
