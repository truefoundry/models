costs:
    - input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
limits:
    max_input_tokens: 128000
    max_output_tokens: 4096
modalities:
    input:
        - image
mode: completion
model: gpt-4-turbo-2024-04-09
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
