costs:
    - input_cost_per_audio_token: 4e-5
      input_cost_per_token: 2.5e-6
      output_cost_per_audio_token: 8e-5
      output_cost_per_token: 1e-5
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - audio
    output:
        - text
        - audio
mode: chat
model: gpt-audio
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
retirementDate: "2027-03-02"
status: active
supportedModes:
    - chat
