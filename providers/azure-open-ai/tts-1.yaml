costs:
    - input_cost_per_character: 0.000015
      region: "*"
deprecationDate: "2026-06-18"
limits:
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: tts-1
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - response_format
    - tool_choice
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-retirements
