      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-8
                from: 100000
          cache_write:
              - cost_per_token: 6.25e-7
                from: 100000
          input:
              - cost_per_token: 5e-7
                from: 100000
          output:
              - cost_per_token: 2.5e-6
                from: 100000
          pricing_mode: marginal
    - cache_creation_input_token_cost: 1.25e-7
      cache_creation_input_token_cost_per_hour: 2e-7
      cache_read_input_token_cost: 1e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 5e-7
      region: datazone_us
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-8
                from: 100000
          cache_write:
              - cost_per_token: 6.25e-7
                from: 100000
          input:
              - cost_per_token: 5e-7
                from: 100000
          output:
              - cost_per_token: 2.5e-6
                from: 100000
          pricing_mode: marginal
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - mid_conversation_system_messages
    - prompt_caching
    - cache_control
    - structured_output
    - json_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
