features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - structured_output
    - tools
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.3-codex-2026-02-20
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
thinking: true
