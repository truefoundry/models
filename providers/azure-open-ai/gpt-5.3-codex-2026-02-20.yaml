model: gpt-5.3-codex-2026-02-20 # NOTE: docs list this as "gpt-5.3-codex" version "2026-02-24"
mode: chat
status: active
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - structured_output
    - tools
modalities:
    input:
        - text
        - image
    output:
        - text
thinking: true
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
# costs: not found in official docs — neither Azure pricing page nor LiteLLM data includes gpt-5.3-codex yet
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      type: string
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-retirements
