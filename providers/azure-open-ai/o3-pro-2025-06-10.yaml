costs:
    - input_cost_per_token: 0.00002
      input_cost_per_token_batches: 0.00001
      output_cost_per_token: 0.00008
      output_cost_per_token_batches: 0.00004
      region: "*"
deprecationDate: "2026-12-10"
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: o3-pro-2025-06-10
params:
    - defaultValue: 100000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      type: string
removeParams:
    - max_tokens
    - temperature
    - top_p
    - stop
    - "n"
    - stream
    - parallel_tool_calls
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
    - https://developers.openai.com/api/docs/models/o3-pro
status: active
thinking: true
