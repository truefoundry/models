costs:
    - cache_read_input_token_cost: 6.05e-7
      input_cost_per_token: 0.00000121
      output_cost_per_token: 0.00000484
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - prompt_caching
limits:
    max_input_tokens: 128000
    max_output_tokens: 65536
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - image
mode: chat
model: o1-mini
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 65536
      minValue: 1
removeParams:
    - temperature
    - top_p
    - "n"
    - stream
    - max_tokens
