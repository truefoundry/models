costs:
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 7.1e-7
      region: "*"
features:
    - function_calling
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 2048
    max_tokens: 2048
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Llama-3.3-70B-Instruct-4
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 2048
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/llama/
status: active
supportedModes:
    - chat
