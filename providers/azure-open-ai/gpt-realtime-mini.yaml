costs:
    - cache_creation_input_audio_token_cost: 3e-7
      cache_read_input_audio_token_cost: 3e-7
      cache_read_input_token_cost: 6e-8
      input_cost_per_audio_token: 0.00001
      input_cost_per_image_token: 8e-7
      input_cost_per_token: 6e-7
      output_cost_per_audio_token: 0.00002
      output_cost_per_token: 0.0000024
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
limits:
    context_window: 32000
    max_input_tokens: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-mini
provisioning: serverless
retirementDate: "2026-12-15"
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
status: active
supportedModes:
    - realtime
