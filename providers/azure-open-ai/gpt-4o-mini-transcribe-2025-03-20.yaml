      key: max_tokens
      maxValue: 2000
      minValue: 1
removeParams:
    - top_p
    - "n"
    - stop
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/models/gpt-4o-mini-transcribe
    - https://developers.openai.com/docs/pricing
