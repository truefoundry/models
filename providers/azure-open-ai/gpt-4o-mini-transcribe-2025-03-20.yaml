deprecationDate: "2026-06-01"
limits:
    context_window: 16000
    max_output_tokens: 2000
    max_tokens: 2000
modalities:
    input:
        - text
        - audio
    output:
        - text
mode: audio_transcription
model: gpt-4o-mini-transcribe-2025-03-20
params:
