        - text
        - audio
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime-mini-2025-12-15
removeParams:
    - "n"
    - response_format
sources:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/models
