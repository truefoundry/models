model: gpt-4o-audio-mai
mode: chat
status: active
supportedModes:
    - chat
costs:
    - region: "*"
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      input_cost_per_audio_token: 0.00004
      output_cost_per_audio_token: 0.00008
limits:
    context_window: 128000
    max_tokens: 16384
    max_input_tokens: 128000
    max_output_tokens: 16384
features:
    - function_calling
    - parallel_function_calling
    - system_messages
modalities:
    input:
        - text
        - audio
    output:
        - text
        - audio
params:
    - key: max_tokens
      defaultValue: 128
      minValue: 1
      maxValue: 16384
