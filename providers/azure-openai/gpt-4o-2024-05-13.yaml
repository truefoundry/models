costs:
    - input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015
      region: "*"
features:
    - chat
    - image
    - tools
    - function_calling
    - parallel_function_calling
    - vision
    - tool_choice
    - prompt_caching
limits:
    max_input_tokens: 128000
    max_output_tokens: 4096
mode: chat
model: gpt-4o-2024-05-13
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
      skipValues:
          - null
      type: string
    - defaultValue: 0
      key: frequency_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: 0
      key: presence_penalty
      maxValue: 2
      minValue: -2
