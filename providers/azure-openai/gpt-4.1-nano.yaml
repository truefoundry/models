model: gpt-4.1-nano
costs:
    - region: "*"
      input_cost_per_token: 1e-7
      output_cost_per_token: 4e-7
      input_cost_per_token_batches: 5e-8
      output_cost_per_token_batches: 2e-7
      cache_read_input_token_cost: 2.5e-8
limits:
    max_tokens: 4096
    max_input_tokens: 1047576
    max_output_tokens: 32768
features: [chat, image, tools, function_calling, parallel_function_calling, vision, system_messages, tool_choice, prompt_caching, response_schema]
params:
    - key: max_completion_tokens
      defaultValue: 1000
      minValue: 1
      maxValue: 32768
    - key: response_format
      defaultValue: null
      options:
          - value: null
            name: Text
          - value: json_object
            name: JSON Object
            schema:
                type: object
                properties:
                    type:
                        type: string
                        value: json_object
          - value: json_schema
            name: JSON Schema
            schema:
                type: object
                properties:
                    type:
                        type: string
                        value: json_schema
                    json_schema:
                        type: object
            params:
                key: json_schema
                defaultValue: null
                type: json
                skipValues:
                    - null
      skipValues:
          - null
      type: string
removeParams:
    - max_tokens
mode: chat
