---
model: gpt-4o
costs:
  - region: '*'
    input_cost_per_token: 0.0000025
    output_cost_per_token: 0.00001
    cache_read_input_token_cost: 0.00000125
limits:
  max_input_tokens: 128000
  max_output_tokens: 16384
features:
  - function_calling
  - parallel_function_calling
  - vision
  - chat
  - image
params:
  - key: max_tokens
    maxValue: 16384
  - key: response_format
    defaultValue:
    options:
      - value:
        name: Text
      - value: json_object
        name: JSON Object
        schema:
          type: object
          properties:
            type:
              type: string
              value: json_object
      - value: json_schema
        name: JSON Schema
        schema:
          type: object
          properties:
            type:
              type: string
              value: json_schema
            json_schema:
              type: object
        params:
          key: json_schema
          defaultValue:
          type: json
          skipValues: [null]
    skipValues: [null]
    type: string
  - key: frequency_penalty
    defaultValue: 0
    minValue: -2
    maxValue: 2
  - key: presence_penalty
    defaultValue: 0
    minValue: -2
    maxValue: 2
mode: chat
