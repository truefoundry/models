costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000004
      region: "*"
features:
    - chat
    - tools
    - tool_choice
limits:
    max_input_tokens: 16385
    max_output_tokens: 4096
mode: chat
model: gpt-35-turbo-16k
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: 0
      key: frequency_penalty
      maxValue: 2
      minValue: -2
    - defaultValue: 0
      key: presence_penalty
      maxValue: 2
      minValue: -2
