model: gpt-35-turbo-0301
costs:
    -
        region: '*'
        input_cost_per_token: 2.e-7
        output_cost_per_token: 0.000002
limits:
    max_tokens: 4096
    max_input_tokens: 4097
    max_output_tokens: 4096
features: [chat, function_calling, parallel_function_calling, tool_choice]
mode: chat
