costs:
    -
        input_cost_per_token: 0.00003
        output_cost_per_token: 0.00006
        region: '*'
features: [chat, tools, function_calling, tool_choice]
limits:
    max_input_tokens: 8192
    max_output_tokens: 4096
mode: chat
model: gpt-4
params:
    -
        key: max_tokens
        maxValue: 8192
    -
        defaultValue: 0
        key: frequency_penalty
        maxValue: 2
        minValue: -2
    -
        defaultValue: 0
        key: presence_penalty
        maxValue: 2
        minValue: -2
