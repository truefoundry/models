costs:
    - cache_read_input_audio_token_cost: 1.e-7
      cache_read_input_token_cost: 5.e-8
      input_cost_per_audio_token: 0.000001
      input_cost_per_token: 5.e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_token: 0.000003
      output_cost_per_token_batches: 0.0000015
      region: global
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: gemini-3-flash-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-flash
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/locations
status: preview
thinking: true
