features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - pdf
        - doc
        - code
    output:
        - text
        - code
mode: chat
model: gemini-3-flash-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
    - defaultValue: null
      key: thinking
      properties:
          budget_tokens:
              maxValue: 24576
              minValue: 0
              type: number
          type:
              enum:
                  - enabled
                  - disabled
              type: string
      skipValues:
          - null
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-flash
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/locations
thinking: true
