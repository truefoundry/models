costs:
    - cache_creation_input_token_cost_per_hour: 0.000001
      cache_read_input_audio_token_cost: 3e-8
      cache_read_input_token_cost: 1e-8
      input_cost_per_audio_token: 3e-7
      input_cost_per_token: 1e-7
      input_cost_per_token_batches: 5e-8
      output_cost_per_token: 4e-7
      output_cost_per_token_batches: 2e-7
      region: global
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65535
    max_tokens: 65535
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: gemini-2.5-flash-lite-preview-09-2025
params:
    - key: max_tokens
      maxValue: 65535
    - defaultValue: 1
      key: temperature
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/2-5-flash-lite
    - https://ai.google.dev/pricing
status: preview
supportedModes:
    - chat
thinking: true
