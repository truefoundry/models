limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/nemotron-v3-super-120b
params:
