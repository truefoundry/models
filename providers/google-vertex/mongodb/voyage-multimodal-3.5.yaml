limits:
    max_query_tokens: 32000
    output_vector_size: 1024
modalities:
    input:
        - text
        - image
        - video
    output:
        - embedding
mode: embedding
model: mongodb/voyage-multimodal-3.5
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://docs.voyageai.com/docs/multimodal-embeddings
    - https://docs.voyageai.com/docs/pricing
    - https://www.mongodb.com/docs/voyageai/management/gcp-marketplace/
    - https://www.mongodb.com/docs/voyageai/models/multimodal-embeddings/
status: active
supportedModes:
    - embedding
