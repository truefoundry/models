costs:
    - input_cost_per_token: 2e-8
      region: us-central1
limits:
    context_window: 32000
    max_input_tokens: 32000
    output_vector_size: 1024
modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: mongodb/voyage-3.5-lite
provisioning: provisioned
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
    - max_tokens
sources:
    - https://www.mongodb.com/docs/voyageai/models/
    - https://www.mongodb.com/docs/voyageai/management/gcp-marketplace/
status: active
supportedModes:
    - embedding
