costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 0.0000012
      region: "*"
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: qwen/qwen3-next-80b-a3b-thinking-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 262144
      minValue: 1
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen/qwen3-next-thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/capabilities/thinking
thinking: true
