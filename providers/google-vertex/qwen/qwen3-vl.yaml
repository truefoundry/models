features:
    - function_calling
    - system_messages
    - json_output
    - structured_output
limits:
    context_window: 262144
    max_output_tokens: 16384
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: qwen/qwen3-vl
provisioning: provisioned
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/models
    - https://github.com/GoogleCloudPlatform/vertex-ai-samples/blob/main/notebooks/community/model_garden/model_garden_pytorch_qwen3_vl.ipynb
    - https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct
status: active
supportedModes:
    - chat
