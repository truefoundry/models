# costs: not found in official Vertex AI docs for this model
features:
    - function_calling
    - structured_output
    - json_output
    - system_messages
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: chat
model: qwen/qwen3-coder-next
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen/qwen3-coder
    - https://openrouter.ai/qwen/qwen3-coder-next/api
status: active
supportedModes:
    - chat
