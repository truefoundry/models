modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: qwen/qwen3-embedding
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/use-open-models
    - https://docs.cloud.google.com/bigquery/docs/generate-text-embedding-tutorial-open-models
status: active
supportedModes:
    - embedding

# Qwen3-Embedding is offered on Vertex AI Model Garden as a self-deployed
# open model (charged per machine-hour, not per token), with three size
# variants (0.6B, 4B, 8B) and varying output dimensions (1024 / 2560 / 4096).
# Token-based costs and per-variant limits are not documented as a single
# MaaS spec on Vertex AI, so they are omitted. # not found in official docs
