modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwen3-5
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/qwen
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/deprecations/partner-models
supportedModes:
    - chat

# Note: model `qwen/qwen3-5` is not listed on Google Vertex AI's official Qwen
# documentation page. The Qwen models currently documented on Vertex AI are
# Qwen3 235B (qwen3-235b-a22b-instruct-2507-maas), Qwen3 Coder,
# Qwen3-Next-80B Instruct, Qwen3-Next-80B Thinking, and Qwen3-VL.
# Costs, limits, features, params, and thinking support could not be confirmed
# from official docs and are therefore omitted.
