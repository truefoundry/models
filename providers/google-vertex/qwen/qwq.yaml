features:
    - system_messages
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: qwen/qwq
provisioning: provisioned
sources:
    - https://huggingface.co/Qwen/QwQ-32B
    - https://github.com/GoogleCloudPlatform/vertex-ai-samples/blob/main/notebooks/community/model_garden/model_garden_pytorch_qwq_deployment.ipynb
supportedModes:
    - chat
thinking: true

# costs not found in official docs — QwQ-32B on Vertex AI is a self-deployed model from Model Garden / Hugging Face;
# pricing is based on the underlying compute resources (GPU node-hours) provisioned by the user, not a per-token rate.
