features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: reflection/beam
params:
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://reflection.ai/blog/beam-is-available
    - https://reflection.ai/beam-model-card
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-garden/self-deployed-models
status: preview
supportedModes:
    - chat
thinking: true
