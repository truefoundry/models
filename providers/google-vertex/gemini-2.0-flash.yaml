model: gemini-2.0-flash
costs:
  - input_cost_per_token: 1.e-7
    output_cost_per_token: 4.e-7
    cache_read_input_token_cost: 2.5e-8
    supported_regions:
      - us-central1
limits:
  max_tokens: 4096
  max_input_tokens: 1048576
  max_output_tokens: 8192
features: [function_calling, parallel_function_calling, vision, audio_input, audio_output, chat]
mode: chat
original_provider: vertex_ai-language-models
