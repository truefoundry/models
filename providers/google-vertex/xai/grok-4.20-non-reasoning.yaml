costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: global
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.0000025
                from: 200000
          output:
              - cost_per_token: 0.000005
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - structured_output
    - prompt_caching
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: xai/grok-4.20-non-reasoning
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/grok/grok-4-20
    - https://docs.x.ai/developers/models#models-and-pricing
    - https://docs.x.ai/developers/models/grok-4.20-non-reasoning
status: active
supportedModes:
    - chat
