model: multimodalembedding@001
mode: embedding
modalities:
    input:
        - text
        - image
        - video
limits:
    max_input_tokens: 2048
    output_vector_size: 1408
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
costs:
    - region: us-central1
      input_cost_per_token: 0.0000008
      input_cost_per_image: 0.0001
      input_cost_per_character: 0.0000002
      output_cost_per_token: 0
