costs:
    - input_cost_per_character: 1.875e-8
      input_cost_per_image: 0.00002
      input_cost_per_token: 7.5e-8
      output_cost_per_token: 3.e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.000001
                from: 128000
          output:
              - cost_per_token: 6.e-7
                from: 128000
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - structured_output
isDeprecated: true
limits:
    max_input_tokens: 1000000
    max_output_tokens: 8192
modalities:
    input:
        - image
        - pdf
        - doc
mode: completion
model: gemini-1.5-flash-001
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
