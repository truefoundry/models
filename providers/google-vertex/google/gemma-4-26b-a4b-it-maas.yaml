costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
limits:
    context_window: 256000
    max_input_tokens: 256000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
