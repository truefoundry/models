        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: google/gemma-4-26b-a4b-it-maas
params:
    - key: max_tokens
      maxValue: 128000
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/google/gemma-4-26b-a4b-it
    - https://ai.google.dev/gemma/docs/core/model_card_4
status: preview
supportedModes:
    - chat
thinking: true
