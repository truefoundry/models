costs:
    - cache_read_input_audio_token_cost: 5.e-8
      cache_read_input_token_cost: 3.e-8
      input_cost_per_audio_token: 5.e-7
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 0.0000015
      output_cost_per_token_batches: 7.5e-7
      region: global
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65535
    max_tokens: 65535
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: google/gemini-3.1-flash-lite-preview
params:
    - key: max_tokens
      maxValue: 65535
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-1-flash-lite
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/locations
status: preview
supportedModes:
    - chat
thinking: true
