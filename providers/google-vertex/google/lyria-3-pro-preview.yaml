limits:
    context_window: 131072
    max_input_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - audio
        - text
mode: unknown # correct mode is music, but that is not supported yet
model: lyria-3-pro-preview
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/music/overview
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/lyria/lyria-3
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/music/generate-music
    - https://ai.google.dev/gemini-api/docs/models/lyria-3-pro-preview
status: preview
supportedModes:
    - unknown
