costs:
    - cache_read_input_token_cost: 1.1e-7
      input_cost_per_token: 2.2e-6
      input_cost_per_token_batches: 1.1e-6
      output_cost_per_token: 1.1e-5
      output_cost_per_token_batches: 5.5e-6
      region: us
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 2e-6
      input_cost_per_token_batches: 1e-6
      output_cost_per_token: 1e-5
      output_cost_per_token_batches: 5e-6
      region: global
    - cache_read_input_token_cost: 1.1e-7
      input_cost_per_token: 2.2e-6
      input_cost_per_token_batches: 1.1e-6
      output_cost_per_token: 1.1e-5
      output_cost_per_token_batches: 5.5e-6
      region: eu
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 1048576
    max_tokens: 1048576
modalities:
    input:
        - text
        - image
        - audio
        - video
    output:
        - text
mode: chat
model: google/gemini-4-argon
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 1048576
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon
    - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/thinking
status: active
supportedModes:
    - chat
thinking: true
