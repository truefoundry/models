costs:
    - input_cost_per_token: 0.0000015
      output_cost_per_token: 0.000009
      output_cost_per_video_token: 0.0000175
      region: global
limits:
    context_window: 1048576
    max_input_tokens: 1048576
messages:
    options:
        - user
        - assistant
modalities:
    input:
        - text
        - image
        - audio
        - video
    output:
        - video
        - audio
        - text
mode: video
model: google/gemini-omni-flash-preview
provisioning: serverless
removeParams:
    - temperature
    - top_p
sources:
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-flash-preview
    - https://deepmind.google/models/model-cards/gemini-omni-flash/
    - https://ai.google.dev/gemini-api/docs/models/gemini-omni-flash
    - https://ai.google.dev/gemini-api/docs/omni
    - https://cloud.google.com/blog/products/ai-machine-learning/nano-banana-2-lite-and-gemini-omni-flash-available/
status: preview
supportedModes:
    - video
