costs:
    - input_cost_per_character: 0.000001
      region: global
limits:
    max_input_tokens: 100000
modalities:
    input:
        - text
    output:
        - text
mode: unknown
model: language-v1-analyze-sentiment
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://cloud.google.com/natural-language/pricing
    - https://docs.cloud.google.com/natural-language/docs/reference/rest/v1/documents/analyzeSentiment
    - https://docs.cloud.google.com/natural-language/docs/basics
    - https://docs.cloud.google.com/natural-language/limits
status: active
supportedModes:
    - unknown
