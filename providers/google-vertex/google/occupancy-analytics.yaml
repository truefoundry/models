modalities:
    input:
        - video
    output:
        - text
mode: video
model: google/occupancy-analytics
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
# costs not found in official docs in a form compatible with the schema —
# Vertex AI Vision Occupancy Analytics is billed at $20 per stream per month
# (flat monthly subscription, not per-token/second/request), plus
# $0.0085/GB data ingestion and $0.0085/GB data consumption, none of which
# map cleanly onto the available #Cost fields.
sources:
    - https://cloud.google.com/vision-ai/pricing
    - https://docs.cloud.google.com/vision-ai/docs/overview
    - https://docs.cloud.google.com/vision-ai/docs/occupancy-analytics-model
status: active
supportedModes:
    - video
