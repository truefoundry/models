costs:
    - cache_creation_input_token_cost_per_hour: 0.000001
      cache_read_input_audio_token_cost: 1e-7
      cache_read_input_token_cost: 5e-8
      input_cost_per_audio_token: 0.000001
      input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_token: 0.000003
      output_cost_per_token_batches: 0.0000015
      region: global
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
        - code
    output:
        - text
mode: chat
model: google/gemini-3-flash-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
      maxValue: 64
      minValue: 1
    - key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-flash
    - https://ai.google.dev/gemini-api/docs/gemini-3
    - https://ai.google.dev/gemini-api/docs/pricing
status: preview
supportedModes:
    - chat
thinking: true
