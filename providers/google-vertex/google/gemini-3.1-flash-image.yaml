costs:
    - input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_image_token: 0.00006
      output_cost_per_token: 0.000003
      output_cost_per_token_batches: 0.0000015
      region: global
features:
    - system_messages
    - function_calling
    - structured_output
    - json_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
        - image
mode: image
model: google/gemini-3.1-flash-image
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-1-flash-image
    - https://deepmind.google/models/model-cards/gemini-3-1-flash-image/
status: preview
supportedModes:
    - image
    - chat
thinking: true
