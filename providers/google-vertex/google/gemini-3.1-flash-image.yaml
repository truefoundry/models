costs:
    - cache_creation_input_token_cost_per_hour: 0.000001
      cache_read_input_token_cost: 5e-8
      input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_image_token: 0.00006
      output_cost_per_token: 0.000003
      output_cost_per_token_batches: 0.0000015
      region: global
features:
    - system_messages
    - prompt_caching
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
        - image
        - video
        - pdf
    output:
        - text
        - image
mode: image
model: google/gemini-3.1-flash-image
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 0.95
      key: top_p
      maxValue: 1
      minValue: 0
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-1-flash-image
    - https://deepmind.google/models/model-cards/gemini-3-1-flash-image/
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-image
    - https://ai.google.dev/gemini-api/docs/pricing
status: preview
supportedModes:
    - image
    - chat
thinking: true
