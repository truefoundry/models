limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: google/gemma
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: provisioned
sources:
    - https://ai.google.dev/gemma/docs/core/model_card
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-garden/deploy-and-inference-tutorial
status: active
supportedModes:
    - chat
