costs:
    - cache_creation_input_token_cost_per_hour: 0.000001
      cache_read_input_audio_token_cost: 1e-7
      cache_read_input_token_cost: 3e-8
      input_cost_per_audio_token: 0.000001
      input_cost_per_token: 3e-7
      input_cost_per_token_batches: 1.5e-7
      output_cost_per_token: 0.0000025
      output_cost_per_token_batches: 0.00000125
      region: global
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
    - code_execution
    - json_output
    - prompt_caching
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: google/gemini-2.5-flash
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
retirementDate: "2026-10-16"
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/2-5-flash
    - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash
    - https://ai.google.dev/pricing
status: active
supportedModes:
    - chat
thinking: true
