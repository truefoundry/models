costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_image: 0.00112
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_image_token: 0.00012
      output_cost_per_token: 0.000012
      output_cost_per_token_batches: 0.000006
      region: global
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000018
                from: 200000
          pricing_mode: cumulative
features:
    - system_messages
    - prompt_caching
limits:
    context_window: 65536
    max_input_tokens: 65536
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
        - image
mode: image
model: google/gemini-3-pro-image
provisioning: serverless
retirementDate: "2027-05-28"
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-pro-image
    - https://ai.google.dev/gemini-api/docs/models/gemini-3-pro-image
    - https://ai.google.dev/gemini-api/docs/pricing
status: active
supportedModes:
    - image
    - chat
thinking: true
