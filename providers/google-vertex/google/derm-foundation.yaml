limits:
    output_vector_size: 6144
modalities:
    input:
        - image
    output:
        - embedding
mode: embedding
model: google/derm-foundation
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://developers.google.com/health-ai-developer-foundations/derm-foundation
    - https://developers.google.com/health-ai-developer-foundations/derm-foundation/model-card
    - https://developers.google.com/health-ai-developer-foundations/derm-foundation/serving-api
    - https://developers.google.com/health-ai-developer-foundations/derm-foundation/get-started
status: active
supportedModes:
    - embedding
