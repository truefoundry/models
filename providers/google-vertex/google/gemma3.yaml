features:
    - function_calling
    - structured_output
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: google/gemma3
provisioning: provisioned
sources:
    - https://ai.google.dev/gemma/docs/core/model_card_3
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/open-models/use-gemma
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/model-garden/deploy-and-inference-tutorial
    - https://cloud.google.com/blog/products/ai-machine-learning/announcing-gemma-3-on-vertex-ai/
status: active
supportedModes:
    - chat
