limits:
    context_window: 64
    max_input_tokens: 64
messages:
    options: []
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: google/medsiglip
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://developers.google.com/health-ai-developer-foundations/medsiglip
    - https://developers.google.com/health-ai-developer-foundations/medsiglip/model-card
    - https://developers.google.com/health-ai-developer-foundations/medsiglip/get-started
status: active
supportedModes:
    - embedding
