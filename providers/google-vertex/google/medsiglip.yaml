messages:
    options: []
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: google/medsiglip
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://developers.google.com/health-ai-developer-foundations/medsiglip
    - https://developers.google.com/health-ai-developer-foundations/medsiglip/model-card
