limits:
    context_window: 8192
    max_input_tokens: 8192
    output_vector_size: 768
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - embedding
mode: embedding
model: google/embeddinggemma2
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://ai.google.dev/gemma/docs/embeddinggemma
    - https://ai.google.dev/gemma/docs/embeddinggemma/model_card_2
    - https://huggingface.co/google/embeddinggemma-2
status: preview
supportedModes:
    - embedding
