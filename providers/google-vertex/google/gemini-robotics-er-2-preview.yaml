canonical_model: google/gemini-robotics-er-2-preview
costs:
    - cache_creation_input_token_cost_per_hour: 5e-7
      cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000001
      input_cost_per_token_batches: 5e-7
      output_cost_per_token: 0.000005
      output_cost_per_token_batches: 0.0000025
      region: global
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
    - code_execution
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
    output:
        - text
mode: chat
model: google/gemini-robotics-er-2-preview
params:
    - defaultValue: 8192
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-preview
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er
    - https://ai.google.dev/gemini-api/docs/thinking
status: preview
supportedModes:
    - chat
thinking: true
