limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - code
    output:
        - text
        - code
mode: completion
model: google/codegemma
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: provisioned
sources:
    - https://ai.google.dev/gemma/docs/codegemma
    - https://huggingface.co/blog/codegemma
status: active
supportedModes:
    - completion
