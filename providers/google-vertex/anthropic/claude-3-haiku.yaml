model: anthropic/claude-3-haiku
costs:
    -
        region: '*'
        input_cost_per_token: 2.5e-7
        output_cost_per_token: 0.00000125
limits:
    max_tokens: 4096
    max_input_tokens: 200000
    max_output_tokens: 4096
features: [function_calling, vision, tool_choice, assistant_prefill]
requiredParams:
    - max_tokens
mode: chat
