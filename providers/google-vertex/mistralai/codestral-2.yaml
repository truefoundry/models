costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: us-central1
    - input_cost_per_token: 3e-7
      output_cost_per_token: 9e-7
      region: europe-west4
features:
    - function_calling
    - structured_output
    - tool_choice
    - system_messages
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
modalities:
    input:
        - text
        - code
    output:
        - text
mode: chat
model: mistralai/codestral-2
params:
    - key: max_tokens
      maxValue: 128000
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/mistral
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/mistral/codestral-2
    - https://docs.mistral.ai/models/codestral-25-08
status: active
supportedModes:
    - chat
