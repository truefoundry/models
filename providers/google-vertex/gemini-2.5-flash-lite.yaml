deprecationDate: "2026-10-16"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - cache_control
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65535
    max_tokens: 65535
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
        - code
    output:
        - text
mode: chat
model: gemini-2.5-flash-lite
params:
    - key: max_tokens
      maxValue: 65535
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
    - key: "n"
      maxValue: 8
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/2-5-flash-lite
supportedModes:
    - chat
thinking: true
