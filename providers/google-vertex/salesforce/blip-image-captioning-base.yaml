modalities:
    input:
        - image
        - text
    output:
        - text
mode: chat
model: salesforce/blip-image-captioning-base
provisioning: provisioned
removeParams:
    - tool_choice
    - "n"
    - stop
sources:
    - https://huggingface.co/Salesforce/blip-image-captioning-base
    - https://github.com/GoogleCloudPlatform/vertex-ai-samples/blob/main/notebooks/community/model_garden/model_garden_pytorch_blip_image_captioning.ipynb
status: active
supportedModes:
    - chat

