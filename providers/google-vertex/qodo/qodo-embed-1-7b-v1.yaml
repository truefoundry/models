limits:
    max_input_tokens: 32768
    output_vector_size: 3584
modalities:
    input:
        - text
        - code
    output:
        - embedding
mode: embedding
model: qodo/qodo-embed-1-7b-v1
provisioning: provisioned
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
    - max_tokens
sources:
    - https://huggingface.co/Qodo/Qodo-Embed-1-7B
    - https://console.cloud.google.com/vertex-ai/publishers/qodo/model-garden/qodo-embed-1-7b-v1
    - https://cloud.google.com/blog/products/ai-machine-learning/new-proprietary-models-vertex-model-garden
status: active
supportedModes:
    - embedding
