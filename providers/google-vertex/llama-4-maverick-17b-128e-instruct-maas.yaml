costs:
    - input_cost_per_token: 3.5e-7
      output_cost_per_token: 0.00000115
      region: us-east5
features:
    - function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 524288
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - image
mode: chat
model: llama-4-maverick-17b-128e-instruct-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/llama4-maverick
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/use-llama
