features:
    - function_calling
    - json_output
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: moonshotai/kimi-k2-5
params:
    - defaultValue: 0
      key: temperature
      maxValue: 0
      minValue: 0
    - defaultValue: 0.95
      key: top_p
      maxValue: 0.95
      minValue: 0.95
provisioning: serverless
removeParams:
    - "n"
sources:
    - https://platform.kimi.ai/docs/api/chat
    - https://platform.kimi.ai/docs/pricing/chat-k25
    - https://platform.kimi.ai/docs/models
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi/kimi-k2-thinking
status: active
supportedModes:
    - chat
thinking: true
