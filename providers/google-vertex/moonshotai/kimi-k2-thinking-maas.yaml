costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 6e-7
      output_cost_per_token: 0.0000025
      region: global
features:
    - function_calling
    - tool_choice
    - structured_output
    - prompt_caching
    - system_messages
limits:
    context_window: 262144
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - doc
    output:
        - text
mode: chat
model: moonshotai/kimi-k2-thinking-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 262144
      minValue: 1
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi/kimi-k2-thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/capabilities/thinking
    - https://platform.moonshot.ai/docs/pricing/chat
status: active
supportedModes:
    - chat
thinking: true
