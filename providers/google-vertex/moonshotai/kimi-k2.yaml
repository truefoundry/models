costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 6.e-7
      output_cost_per_token: 0.0000025
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - pdf
    output:
        - text
mode: chat
model: moonshotai/kimi-k2
params:
    - key: max_tokens
      maxValue: 262144
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi/kimi-k2-thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi
    - https://platform.kimi.ai/docs/pricing/chat-k2
status: active
supportedModes:
    - chat
thinking: true
