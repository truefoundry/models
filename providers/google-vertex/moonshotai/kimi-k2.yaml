# costs: not found in official docs (pricing for Kimi K2 Thinking is not listed on
# the Vertex AI Generative AI pricing page; model card pricing not exposed)
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 262144
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - pdf
    output:
        - text
mode: chat
model: moonshotai/kimi-k2
params:
    - key: max_tokens
      maxValue: 262144
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi/kimi-k2-thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/kimi
status: active
supportedModes:
    - chat
thinking: true
