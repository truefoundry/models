costs:
    - cache_read_input_token_cost: 7.e-9
      input_cost_per_token: 7.e-8
      input_cost_per_token_batches: 3.5e-8
      output_cost_per_token: 2.5e-7
      output_cost_per_token_batches: 1.25e-7
      region: us-central1
features:
    - function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai/gpt-oss-20b-maas
params:
    - key: reasoning_effort
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/openai/gpt-oss-20b
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/openai
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/capabilities/thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/use-open-models
status: active
supportedModes:
    - chat
    - completion
thinking: true
