limits:
    max_input_tokens: 77
    output_vector_size: 512
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: openai/clip-vit-base-patch32
provisioning: provisioned
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
    - max_tokens
sources:
    - https://huggingface.co/openai/clip-vit-base-patch32/blob/main/config.json
    - https://github.com/openai/CLIP
status: active
supportedModes:
    - embedding
