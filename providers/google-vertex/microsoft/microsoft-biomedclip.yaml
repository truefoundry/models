limits:
    max_query_tokens: 256
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: microsoft/microsoft-biomedclip
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://huggingface.co/microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
status: active
supportedModes:
    - embedding
