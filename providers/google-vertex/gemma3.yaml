features:
    - system_messages
    - function_calling
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gemma3
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: provisioned
sources:
    - https://ai.google.dev/gemma/docs/core/model_card_3
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/open-models/use-gemma
status: active
supportedModes:
    - chat
