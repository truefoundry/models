model: gemini-2.5-flash-image
costs:
  - input_cost_per_token: 3.e-7
    output_cost_per_token: 0.0000025
    cache_read_input_token_cost: 3.e-8
    supported_regions:
      - global
      - us-central1
      - us-east1
      - us-east4
      - us-east5
      - us-south1
      - us-west1
      - us-west4
      - europe-central2
      - europe-north1
      - europe-southwest1
      - europe-west1
      - europe-west4
      - europe-west8
limits:
  max_tokens: 4096
  max_input_tokens: 32768
  max_output_tokens: 32768
features: [function_calling, parallel_function_calling, vision, chat]
mode: image
original_provider: vertex_ai-language-models
