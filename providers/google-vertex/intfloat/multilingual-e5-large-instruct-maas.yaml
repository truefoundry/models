    - input_cost_per_token: 2.5e-8
      input_cost_per_token_batches: 1.25e-8
      region: us
    - input_cost_per_token: 2.5e-8
      input_cost_per_token_batches: 1.25e-8
      region: europe-west4
    - input_cost_per_token: 2.5e-8
      input_cost_per_token_batches: 1.25e-8
