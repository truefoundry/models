costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
limits:
    context_window: 262144
    max_input_tokens: 262144
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
mode: chat
model: gemma4
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: provisioned
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/google/gemma-4-26b-a4b-it
    - https://cloud.google.com/blog/products/ai-machine-learning/gemma-4-available-on-google-cloud
status: active
supportedModes:
    - chat
thinking: true
