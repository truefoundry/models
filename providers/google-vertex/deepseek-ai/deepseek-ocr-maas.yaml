costs:
    - input_cost_per_token: 3.e-7
      output_cost_per_token: 0.0000012
      region: us-central1
features:
    - function_calling
    - structured_output
limits:
    context_window: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
        - doc
    output:
        - text
mode: chat
model: deepseek-ai/deepseek-ocr-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek/deepseek-ocr
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek
