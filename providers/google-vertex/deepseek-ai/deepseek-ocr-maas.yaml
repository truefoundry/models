costs:
    - input_cost_per_token: 3e-7
      output_cost_per_token: 0.0000012
      region: global # docs specify us-central1 but the model is only available via global inference
features:
    - function_calling
    - structured_output
limits:
    context_window: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
        - doc
    output:
        - text
mode: chat
model: deepseek-ai/deepseek-ocr-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
pricing:
    - standard:
          - input_cost_per_token: 3e-7
            output_cost_per_token: 0.0000012
            region: global # docs specify us-central1 but the model is only available via global inference
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek/deepseek-ocr
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/deepseek
status: active
supportedModes:
    - chat
