costs:
    - input_cost_per_token: 3.5e-7
      input_cost_per_token_batches: 1.75e-7
      output_cost_per_token: 1.15e-6
      output_cost_per_token_batches: 5.75e-7
      region: us-east5
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 524288
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta/llama4
params:
    - defaultValue: 8192
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: provisioned
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/llama4-maverick
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/llama4-scout
    - https://developers.googleblog.com/en/llama-4-ga-maas-vertex-ai/
status: active
supportedModes:
    - chat
