features:
    - function_calling
    - tool_choice
limits:
    context_window: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta/muse-glimmer
provisioning: provisioned
sources:
    - https://console.cloud.google.com/vertex-ai/publishers/meta/model-garden/muse-glimmer
supportedModes:
    - chat

# costs: not found in official docs — Muse Glimmer is an open-weight model deployed to user-managed Vertex AI endpoints and billed via Vertex AI custom training and prediction pricing (compute/machine-based), not per-token
