costs:
    - input_cost_per_token: 7.2e-7
      input_cost_per_token_batches: 3.6e-7
      output_cost_per_token: 7.2e-7
      output_cost_per_token_batches: 3.6e-7
      region: us-central1
features:
    - chat
    - code
    - function_calling
    - response_schema
    - system_messages
    - text
    - tool_choice
    - tools
limits:
    context_window: 128000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: meta/llama-3.3-70b-instruct-maas
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama/llama3-3
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/partner-models/llama
