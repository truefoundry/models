limits:
    max_input_tokens: 512
modalities:
    input:
        - text
    output:
        - text
mode: moderation
model: meta/prompt-guard
provisioning: provisioned
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
    - tool_choice
sources:
    - https://huggingface.co/meta-llama/Prompt-Guard-86M
    - https://github.com/GoogleCloudPlatform/vertex-ai-samples/blob/main/notebooks/community/model_garden/model_garden_pytorch_prompt_guard_deployment.ipynb
status: active
supportedModes:
    - moderation
