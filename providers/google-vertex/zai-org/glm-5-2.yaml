features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
    - prompt_caching
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/glm-5-2
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 131072
      minValue: 1
    - key: reasoning_effort
      supportedValues:
          - high
          - max
provisioning: serverless
sources:
    - https://docs.z.ai/guides/llm/glm-5.2
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/zaiorg/glm-5
status: preview
supportedModes:
    - chat
thinking: true
