costs:
    - cache_read_input_token_cost: 1.4e-7
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      region: global
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
    - prompt_caching
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/glm-5-2
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 64000
      minValue: 1
    - key: reasoning_effort
      supportedValues:
          - high
          - max
provisioning: serverless
sources:
    - https://docs.z.ai/guides/llm/glm-5.2
    - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/zaiorg/glm-52
status: preview
supportedModes:
    - chat
thinking: true
