costs:
    - cache_read_input_token_cost: 1.e-7
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.0000032
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 200000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - doc
        - text
    output:
        - text
mode: chat
model: zai-org/glm-5-maas
params:
    - key: max_tokens
      maxValue: 128000
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/zaiorg/glm-5
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/capabilities/thinking
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/zaiorg
thinking: true
