costs:
    - cache_read_input_token_cost: 1.1e-7
      input_cost_per_token: 6e-7
      output_cost_per_token: 0.0000022
      region: global
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
    - json_output
    - prompt_caching
limits:
    context_window: 200000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/glm-4.7-maas
params:
    - key: max_tokens
      maxValue: 128000
provisioning: serverless
sources:
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/zaiorg/glm-47
    - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/maas/zaiorg
    - https://docs.z.ai/guides/overview/pricing
    - https://docs.z.ai/guides/llm/glm-4.7
status: active
supportedModes:
    - chat
thinking: true
