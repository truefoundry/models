costs:
    -
        cache_read_input_token_cost: 1.25e-7
        input_cost_per_token: 0.00000125
        output_cost_per_token: 0.00001
        region: "*"
        tiered_pricing:
            cache_read:
                -
                    cost_per_token: 2.5e-7
                    from: 200000
            cache_write:
                -
                    cost_per_token: 2.5e-7
                    from: 200000
            input:
                -
                    cost_per_token: 0.0000025
                    from: 200000
            output:
                -
                    cost_per_token: 0.000015
                    from: 200000
features:
    - function_calling
    - vision
    - audio_input
    - chat
    - image
    - pdf
    - doc
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    max_input_tokens: 1048576
    max_output_tokens: 65535
mode: chat
model: gemini-2.5-pro
params:
    -
        key: max_tokens
        maxValue: 65536
    -
        defaultValue: null
        key: response_format
        options:
            -
                name: Text
                value: null
            -
                name: JSON Object
                schema:
                    properties:
                        type:
                            type: string
                            value: json_object
                    type: object
                value: json_object
            -
                name: JSON Schema
                params:
                    defaultValue: null
                    key: json_schema
                    skipValues:
                        - null
                    type: json
                schema:
                    properties:
                        json_schema:
                            type: object
                        type:
                            type: string
                            value: json_schema
                    type: object
                value: json_schema
        skipValues:
            - null
        type: string
    -
        defaultValue: null
        key: thinking
        properties:
            budget_tokens:
                maxValue: 32768
                minValue: 128
                type: number
            type:
                enum:
                    - enabled
                type: string
        skipValues:
            - null
