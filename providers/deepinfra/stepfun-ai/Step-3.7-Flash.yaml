costs:
    - cache_read_input_token_cost: 3.2e-8
      input_cost_per_token: 1.6e-7
      output_cost_per_token: 9.2e-7
      region: "*"
features:
    - prompt_caching
    - function_calling
    # - json_output is not supported
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: stepfun-ai/Step-3.7-Flash
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/stepfun-ai/Step-3.7-Flash
status: active
supportedModes:
    - chat
thinking: true
