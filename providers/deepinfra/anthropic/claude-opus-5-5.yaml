costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 4e-6
      output_cost_per_token: 2e-5
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 1000000
    max_tokens: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: anthropic/claude-opus-5-5
sources:
    - https://deepinfra.com/anthropic/claude-opus-5-5
status: active
supportedModes:
    - chat
thinking: true
