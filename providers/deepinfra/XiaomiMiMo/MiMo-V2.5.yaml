costs:
    - cache_read_input_token_cost: 8e-8
      input_cost_per_token: 4e-7
      output_cost_per_token: 2e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
mode: chat
model: XiaomiMiMo/MiMo-V2.5
provisioning: serverless
sources:
    - https://deepinfra.com/XiaomiMiMo/MiMo-V2.5
status: active
supportedModes:
    - chat
