costs:
    - cache_read_input_token_cost: 1e-8
      input_cost_per_token: 8e-8
      output_cost_per_token: 3.5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - image
        - text
    output:
        - text
mode: chat
model: google/gemma-4-26B-A4B-it
sources:
    - https://deepinfra.com/google/gemma-4-26B-A4B-it
supportedModes:
    - chat
