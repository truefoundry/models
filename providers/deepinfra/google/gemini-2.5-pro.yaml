costs:
    - cache_creation_input_token_cost_per_hour: 0.0000045
      cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 2.5e-7
                from: 200000
          input:
              - cost_per_token: 0.0000025
                from: 200000
          output:
              - cost_per_token: 0.000015
                from: 200000
          pricing_mode: marginal
features:
    - function_calling
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: google/gemini-2.5-pro
provisioning: serverless
sources:
    - https://deepinfra.com/google/gemini-2.5-pro
status: active
supportedModes:
    - chat
thinking: true
