canonical_model: google/gemini-3-1-flash-lite
costs:
    - input_cost_per_token: 2.5e-7
      output_cost_per_token: 1.5e-6
      region: "*"
features:
    - function_calling
    - json_output
limits:
    context_window: 1000000
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: google/gemini-3.1-flash-lite
params:
    - defaultValue: minimal
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/google/gemini-3.1-flash-lite
    - https://ai.google.dev/gemini-api/docs/thinking
status: active
supportedModes:
    - chat
thinking: true
