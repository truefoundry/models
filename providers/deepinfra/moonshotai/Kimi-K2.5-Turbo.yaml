costs:
    - input_cost_per_token: 5.e-7
      output_cost_per_token: 0.0000028
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
    - prompt_caching
limits:
    context_window: 262144
    max_input_tokens: 262144
    max_output_tokens: 65535
    max_tokens: 65535
modalities:
    input:
        - image
mode: chat
model: moonshotai/Kimi-K2.5-Turbo
sources:
    - https://deepinfra.com/moonshotai/Kimi-K2.5/api
    - https://openrouter.ai/moonshotai/kimi-k2.5/api
thinking: true
