costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 4.e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - prompt_caching
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 262144
    max_input_tokens: 262144
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: moonshotai/Kimi-K2-Instruct-0905
sources:
    - https://deepinfra.com/moonshotai/Kimi-K2-Instruct-0905/api
    - https://huggingface.co/moonshotai/Kimi-K2-Instruct-0905
    - https://build.nvidia.com/moonshotai/kimi-k2-instruct-0905/modelcard
supportedModes:
    - chat
