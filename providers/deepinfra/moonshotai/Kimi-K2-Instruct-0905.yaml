costs:
    - cache_read_input_token_cost: 4.e-7
      input_cost_per_token: 5.e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
limits:
    context_window: 262144
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: moonshotai/Kimi-K2-Instruct-0905
sources:
    - https://deepinfra.com/moonshotai/Kimi-K2-Instruct-0905/api
    - https://deepinfra.com/blog/kimi-k2-0905-api-from-deepinfra-practical-speed-predictable-costs-built-for-devs
    - https://deepinfra.com/docs/advanced/max_tokens_limit
    - https://huggingface.co/moonshotai/Kimi-K2-Instruct-0905
