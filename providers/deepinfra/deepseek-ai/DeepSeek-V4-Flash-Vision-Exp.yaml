canonical_model: deepseek/deepseek-v4-flash-vision-exp
costs:
    - cache_read_input_token_cost: 1.4e-8
      input_cost_per_token: 4.4e-7
      output_cost_per_token: 1.32e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 1048576
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
      type: string
sources:
    - https://deepinfra.com/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
    - https://docs.deepinfra.com/chat/reasoning
    - https://api-docs.deepseek.com/guides/thinking_mode
status: active
supportedModes:
    - chat
thinking: true
