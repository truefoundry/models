canonical_model: deepseek/deepseek-v4-pro-0813
costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 1.3e-6
      output_cost_per_token: 2.6e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 1048576
    max_tokens: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek-ai/DeepSeek-V4-Pro-0813
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/deepseek-ai/DeepSeek-V4-Pro-0813
    - https://docs.deepinfra.com/chat/reasoning
    - https://api-docs.deepseek.com/guides/thinking_mode
status: active
supportedModes:
    - chat
thinking: true
