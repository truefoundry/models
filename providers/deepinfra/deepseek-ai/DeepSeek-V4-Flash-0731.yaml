canonical_model: deepseek/deepseek-v4-flash-0731
costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 6e-8
      output_cost_per_token: 1.8e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 1048576
    max_output_tokens: 384000
    max_tokens: 384000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek-ai/DeepSeek-V4-Flash-0731
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/deepseek-ai/DeepSeek-V4-Flash-0731
    - https://docs.deepinfra.com/chat/reasoning
    - https://api-docs.deepseek.com/guides/thinking_mode
status: active
supportedModes:
    - chat
thinking: true
