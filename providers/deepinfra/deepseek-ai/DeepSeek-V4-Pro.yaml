costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 1.3e-6
      output_cost_per_token: 2.6e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 65536
    max_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek-ai/DeepSeek-V4-Pro
provisioning: serverless
sources:
    - https://deepinfra.com/deepseek-ai/DeepSeek-V4-Pro
status: preview
supportedModes:
    - chat
thinking: true
