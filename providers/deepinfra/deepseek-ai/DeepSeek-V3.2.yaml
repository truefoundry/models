costs:
    - cache_read_input_token_cost: 1.3e-7
      input_cost_per_token: 2.6e-7
      output_cost_per_token: 3.8e-7
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
