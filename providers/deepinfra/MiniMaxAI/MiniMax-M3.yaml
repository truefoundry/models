        - text
        - image
        - video
    output:
        - text
mode: chat
model: MiniMaxAI/MiniMax-M3
provisioning: serverless
sources:
    - https://deepinfra.com/MiniMaxAI/MiniMax-M3
status: active
supportedModes:
    - chat
