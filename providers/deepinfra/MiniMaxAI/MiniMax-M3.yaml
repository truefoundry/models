costs:
    - cache_read_input_token_cost: 5.6e-8
      input_cost_per_token: 2.8e-7
      output_cost_per_token: 1.1e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 524288
    max_tokens: 524288
modalities:
