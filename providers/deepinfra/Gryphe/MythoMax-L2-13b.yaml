costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - structured_output
limits:
    context_window: 4096
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Gryphe/MythoMax-L2-13b
sources:
    - https://deepinfra.com/Gryphe/MythoMax-L2-13b/api
    - https://deepinfra.com/models/text-generation/2
