costs:
    - input_cost_per_token: 4.e-8
      output_cost_per_token: 1.5e-7
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - response_schema
    - system_messages
    - text
    - code
    - tools
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
    max_tokens: 131072
mode: chat
model: openai/gpt-oss-20b
sources:
    - https://huggingface.co/openai/gpt-oss-20b
    - https://openrouter.ai/openai/gpt-oss-20b
    - https://www.getmaxim.ai/bifrost/llm-cost-calculator/provider/deepinfra/model/gpt-oss-20b
    - https://langdb.ai/app/models/gpt-oss-20b
thinking: true
