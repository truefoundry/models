costs:
    - cache_read_input_token_cost: 3.5e-8
      input_cost_per_token: 1.4e-7
      output_cost_per_token: 5.8e-7
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: tencent/Hy3
provisioning: serverless
sources:
    - https://deepinfra.com/tencent/Hy3
status: active
supportedModes:
    - chat
