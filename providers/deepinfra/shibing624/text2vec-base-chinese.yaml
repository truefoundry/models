costs:
    - input_cost_per_token: 5.e-9
      region: "*"
limits:
    context_window: 512
    max_input_tokens: 512
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: shibing624/text2vec-base-chinese
removeParams:
    - max_tokens
sources:
    - https://deepinfra.com/shibing624/text2vec-base-chinese/api
    - https://deepinfra.com/shibing624/text2vec-base-chinese
status: active
