costs:
    - input_cost_per_token: 1.4e-7
      output_cost_per_token: 8.e-7
      region: "*"
features:
    - structured_output
    - json_output
    - prompt_caching
limits:
    context_window: 16384
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: PaddlePaddle/PaddleOCR-VL-0.9B
sources:
    - https://api.deepinfra.com/models/PaddlePaddle/PaddleOCR-VL-0.9B
status: active
