costs:
    - cache_read_input_token_cost: 4e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 131072
    max_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta-models/Muse-Glimmer-30B
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/meta-models/Muse-Glimmer-30B
status: active
supportedModes:
    - chat
