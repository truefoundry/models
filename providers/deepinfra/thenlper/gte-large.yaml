costs:
    - input_cost_per_token: 1.e-8
      region: "*"
limits:
    max_input_tokens: 512
    output_vector_size: 1024
modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: thenlper/gte-large
removeParams:
    - max_tokens
sources:
    - https://deepinfra.com/thenlper/gte-large/api
supportedModes:
    - embedding
