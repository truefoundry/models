costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 5e-7
      output_cost_per_token: 3e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
limits:
    context_window: 256000
    max_tokens: 256000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: ByteDance/Seed-2.0-code
provisioning: serverless
sources:
    - https://deepinfra.com/ByteDance/Seed-2.0-code
status: active
supportedModes:
    - chat
