costs:
    - input_cost_per_token: 1.e-8
      region: "*"
limits:
    context_window: 10240
    max_input_tokens: 10240
    output_vector_size: 2048
modalities:
    input:
        - text
        - image
    output:
        - embedding
mode: embedding
model: nvidia/llama-nemotron-embed-vl-1b-v2
removeParams:
    - max_tokens
sources:
    - https://deepinfra.com/nvidia/llama-nemotron-embed-vl-1b-v2/api
    - https://huggingface.co/nvidia/llama-nemotron-embed-vl-1b-v2
