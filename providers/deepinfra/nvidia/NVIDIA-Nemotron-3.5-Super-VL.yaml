costs:
    - cache_read_input_token_cost: 2e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 5e-7
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
        - doc
        - video
    output:
        - text
mode: chat
model: nvidia/NVIDIA-Nemotron-3.5-Super-VL
sources:
    - https://deepinfra.com/nvidia/NVIDIA-Nemotron-3.5-Super-VL
status: active
supportedModes:
    - chat
thinking: true
