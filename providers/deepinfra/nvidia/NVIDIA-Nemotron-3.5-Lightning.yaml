costs:
    - cache_read_input_token_cost: 4e-8
      input_cost_per_token: 8e-8
      output_cost_per_token: 2e-7
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 262144
    max_tokens: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: nvidia/NVIDIA-Nemotron-3.5-Lightning
sources:
    - https://deepinfra.com/nvidia/NVIDIA-Nemotron-3.5-Lightning
status: active
supportedModes:
    - chat
