costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - json_output
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo
sources:
    - https://deepinfra.com/meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo/api
    - https://deepinfra.com/docs/advanced/max_tokens_limit
    - https://deepinfra.com/docs/advanced/function_calling
    - https://deepinfra.com/docs/model-features
    - https://deepinfra.com/docs/advanced/json_mode
