        - text
        - image
        - audio
    output:
        - text
mode: chat
model: thinkingmachines/Inkling-Small
provisioning: serverless
sources:
    - https://deepinfra.com/thinkingmachines/Inkling-Small
status: active
supportedModes:
    - chat
thinking: true
