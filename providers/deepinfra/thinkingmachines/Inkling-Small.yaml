costs:
    - cache_read_input_token_cost: 1.16e-7
      input_cost_per_token: 5.8e-7
      output_cost_per_token: 1.44e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 524288
    max_tokens: 524288
modalities:
