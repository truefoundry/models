canonical_model: thinkingmachines/inkling-small
costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 4.5e-7
      output_cost_per_token: 1.2e-6
      region: "*"
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 524288
    max_output_tokens: 262144
    max_tokens: 262144
modalities:
    input:
        - text
        - image
        - audio
    output:
        - text
mode: chat
model: thinkingmachines/Inkling-Small
provisioning: serverless
sources:
    - https://deepinfra.com/thinkingmachines/Inkling-Small
status: active
supportedModes:
    - chat
thinking: true
