costs:
    - cache_read_input_token_cost: 2.4e-7
      input_cost_per_token: 1.2e-6
      output_cost_per_token: 4e-6
      region: "*"
features:
    - prompt_caching
    - function_calling
    - json_output
limits:
    context_window: 1048576
    max_tokens: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/GLM-5.3
params:
    - key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://deepinfra.com/zai-org/GLM-5.3
status: active
supportedModes:
    - chat
thinking: true
