costs:
    - cache_read_input_token_cost: 2.4e-7
      input_cost_per_token: 0.0000012
      output_cost_per_token: 0.000006
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4.8e-7
                from: 32000
              - cost_per_token: 6e-7
                from: 128000
          input:
              - cost_per_token: 0.0000024
                from: 32000
              - cost_per_token: 0.000003
                from: 128000
          output:
              - cost_per_token: 0.000012
                from: 32000
              - cost_per_token: 0.000015
                from: 128000
features:
    - function_calling
    - json_output
    - prompt_caching
limits:
    context_window: 256000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Qwen/Qwen3-Max-Thinking
provisioning: serverless
sources:
    - https://deepinfra.com/Qwen/Qwen3-Max-Thinking
status: active
supportedModes:
    - chat
thinking: true
