costs:
    - cache_read_input_token_cost: 2.4e-7
      input_cost_per_token: 0.0000012
      output_cost_per_token: 0.000006
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4.8e-7
                from: 32000
              - cost_per_token: 6.e-7
                from: 128000
          input:
              - cost_per_token: 0.0000024
                from: 32000
              - cost_per_token: 0.000003
                from: 128000
          output:
              - cost_per_token: 0.000012
                from: 32000
              - cost_per_token: 0.000015
                from: 128000
features:
    - chat
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 256000
    max_output_tokens: 16384
    max_tokens: 16384
mode: completion
model: Qwen/Qwen3-Max-Thinking
sources:
    - https://deepinfra.com/Qwen/Qwen3-Max-Thinking
    - https://deepinfra.com/docs/advanced/max_tokens_limit
thinking: true
