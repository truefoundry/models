costs:
    - input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: databricks-gpt-5
sources:
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference
status: active
supportedModes:
    - chat
thinking: true
