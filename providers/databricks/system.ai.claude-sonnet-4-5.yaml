costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - tool_choice
    - assistant_prefill
    - prompt_caching
    - cache_control
    - system_messages
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: system.ai.claude-sonnet-4-5
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.databricks.com/aws/en/machine-learning/model-serving/function-calling
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits
    - https://docs.databricks.com/aws/en/machine-learning/model-serving/structured-outputs
status: active
supportedModes:
    - chat
thinking: true
