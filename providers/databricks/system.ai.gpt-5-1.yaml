costs:
    - cache_creation_input_token_cost: 0.00000125
      cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - system_messages
    - function_calling
    - structured_output
    - json_output
    - tool_choice
    - prompt_caching
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: system.ai.gpt-5-1
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference
    - https://docs.databricks.com/aws/en/machine-learning/retired-models-policy
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits
    - https://www.databricks.com/product/pricing/proprietary-foundation-model-serving-1
    - https://developers.openai.com/api/docs/models/gpt-5.1
status: active
supportedModes:
    - chat
    - responses
thinking: true
