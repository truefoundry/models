costs:
    - input_cost_per_token: 5e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - tool_choice
    - function_calling
    - structured_output
    - json_output
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: system.ai.meta-llama-3-3-70b-instruct
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits
    - https://docs.databricks.com/aws/en/machine-learning/model-serving/function-calling
status: active
supportedModes:
    - chat
