costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 128000
    max_output_tokens: 25000
    max_tokens: 25000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: system.ai.gpt-oss-120b
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference
    - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/limits
    - https://www.databricks.com/product/pricing/foundation-model-serving
status: active
supportedModes:
    - chat
thinking: true
