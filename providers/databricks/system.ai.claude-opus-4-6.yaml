costs:
    - cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_per_hour: 0.00001
      cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      input_cost_per_token_batches: 0.0000025
      output_cost_per_token: 0.000025
      output_cost_per_token_batches: 0.0000125
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
    - cache_control
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 497
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: system.ai.claude-opus-4-6
params:
    - key: max_tokens
      maxValue: 128000
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - max
      type: string
provisioning: serverless
retirementDate: "2027-02-05"
sources:
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://platform.claude.com/docs/en/about-claude/models/overview
    - https://platform.claude.com/docs/en/about-claude/model-deprecations
    - https://www.databricks.com/product/pricing/proprietary-foundation-model-serving
status: active
supportedModes:
    - chat
thinking: true
