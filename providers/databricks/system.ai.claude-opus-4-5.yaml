costs:
    - cache_creation_input_token_cost: 6.25e-6
      cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      region: "*"
features:
    - function_calling
    - tool_choice
    - assistant_prefill
    - prompt_caching
    - system_messages
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 32000
    max_tokens: 32000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: system.ai.claude-opus-4-5
provisioning: serverless
sources:
    - https://www.databricks.com/product/pricing/proprietary-foundation-model-serving
    - https://learn.microsoft.com/en-us/azure/databricks/machine-learning/foundation-model-apis/limits
status: active
supportedModes:
    - chat
thinking: true
