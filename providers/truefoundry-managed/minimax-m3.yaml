canonical_model: minimax/minimax-m3
costs:
    - cache_read_input_token_cost: 7e-8
      input_cost_per_token: 6e-7
      output_cost_per_token: 2.4e-6
      region: "*"
external_ids:
    artificial_analysis_id: 277f939a-985b-4b37-859d-b3eabc7c0b26
    artificial_analysis_slug: minimax-m3
features:
    - function_calling
    - json_output
    - prompt_caching
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 1048576
    max_output_tokens: 512000
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: minimax-m3
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 512000
      minValue: 1
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://openrouter.ai/minimax/minimax-m3
status: active
supportedModes:
    - chat
thinking: true
