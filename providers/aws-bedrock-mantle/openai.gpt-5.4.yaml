extra_configuration:
    bedrock_mantle_adhoc_prefix: /openai
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: openai.gpt-5.4
params:
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-54.html
    - https://developers.openai.com/api/docs/models/gpt-5.4
    - https://aws.amazon.com/blogs/aws/get-started-with-openai-gpt-5-5-gpt-5-4-models-and-codex-on-amazon-bedrock/
status: active
supportedModes:
    - responses
    - chat
thinking: true
