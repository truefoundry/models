      tiered_pricing:
          cache_read:
              - cost_per_token: 0.0000011
                from: 272000
          input:
              - cost_per_token: 0.000011
                from: 272000
          output:
              - cost_per_token: 0.0000495
                from: 272000
          pricing_mode: cumulative
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 0.0000055
      output_cost_per_token: 0.000033
