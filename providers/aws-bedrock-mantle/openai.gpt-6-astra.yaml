costs:
    - region: us-west-2
      # AWS Bedrock has not yet published pricing for GPT-6 Astra
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_input_tokens: 922000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: openai.gpt-6-astra
params:
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-6-astra
    - https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-astra-on-amazon-bedrock/
status: active
supportedModes:
    - chat
    - responses
thinking: true
