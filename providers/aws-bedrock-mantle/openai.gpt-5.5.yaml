costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: us-east-2
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.1e-6
                from: 272000
          input:
              - cost_per_token: 1.1e-5
                from: 272000
          output:
              - cost_per_token: 4.95e-5
                from: 272000
          pricing_mode: cumulative
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 3.3e-5
      region: us-east-1
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.1e-6
                from: 272000
          input:
              - cost_per_token: 1.1e-5
                from: 272000
          output:
              - cost_per_token: 4.95e-5
                from: 272000
          pricing_mode: cumulative
extra_configuration:
    bedrock_mantle_adhoc_prefix: /openai
features:
    - function_calling
    - prompt_caching
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: openai.gpt-5.5
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-55.html
status: active
supportedModes:
    - responses
    - chat
thinking: true
