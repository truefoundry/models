costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: us-west-2
features:
    - function_calling
    - structured_output
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: xai.grok-4.3
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-3.html
    - https://docs.x.ai/developers/models/grok-4.3
status: active
supportedModes:
    - chat
    - responses
thinking: true
