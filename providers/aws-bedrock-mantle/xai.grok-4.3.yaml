extra_configuration:
    bedrock_mantle_adhoc_prefix: /openai
features:
    - function_calling
    - structured_output
    - prompt_caching
    - system_messages
    - tool_choice
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: xai.grok-4.3
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
    - defaultValue: 0.7
      key: temperature
      type: number
    - defaultValue: 0.95
      key: top_p
      type: number
    - defaultValue: 131072
      key: max_completion_tokens
      type: number
preferChatCompletions: true
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-3.html
    - https://docs.x.ai/developers/models/grok-4.3
status: active
supportedModes:
    - chat
    - responses
thinking: true
