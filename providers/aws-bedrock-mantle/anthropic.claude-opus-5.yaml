extra_configuration:
    bedrock_mantle_adhoc_prefix: /anthropic
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - assistant_prefill
    - mid_conversation_system_messages
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 406
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: anthropic.claude-opus-5
params:
    - defaultValue: 4096
      key: max_tokens
      type: number
    - defaultValue: 1
      key: temperature
      maxValue: 1
      minValue: 0
      type: number
    - key: top_p
      maxValue: 1
      minValue: 0
      type: number
    - key: top_k
      minValue: 0
      type: number
    - key: stop
      type: array-of-strings
    - defaultValue: false
      key: stream
      type: boolean
    - key: tool_choice
      type: json
    - key: thinking
      type: json
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html
    - https://platform.claude.com/docs/en/about-claude/pricing
status: active
supportedModes:
    - chat
thinking: true
