costs:
    - input_cost_per_token: 5.9e-7
      output_cost_per_token: 7.9e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
    - system_messages
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 32768
    max_tokens: 32768
mode: chat
model: llama-3.3-70b-versatile
params:
    - key: max_tokens
      maxValue: 32768
    - defaultValue: null
      key: tool_choice
      options:
          - name: None
            value: none
          - name: Auto
            value: auto
          - name: Required
            value: required
          - name: Custom
            schema:
                type: json
            value: custom
      rule:
          default:
              condition: tools
              else: null
              then: auto
      skipValues:
          - null
          - []
      type: non-view-manage-data
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
      skipValues:
          - null
      type: string
sources:
    - https://console.groq.com/docs/tool-use
    - https://console.groq.com/docs/structured-outputs
    - https://console.groq.com/docs/prompt-caching
