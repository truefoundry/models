features:
    - chat
    - system_messages
limits:
    context_window: 131072
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: groq/compound
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
removeParams:
    - stop
sources:
    - https://console.groq.com/docs/compound
