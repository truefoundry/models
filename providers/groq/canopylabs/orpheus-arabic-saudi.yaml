costs:
    - input_cost_per_character: 0.00004
      region: "*"
features:
    - audio_output
limits:
    context_window: 4000
    max_output_tokens: 50000
    max_tokens: 50000
mode: text_to_speech
model: canopylabs/orpheus-arabic-saudi
removeParams:
    - max_tokens
    - temperature
    - top_p
    - stop
sources:
    - https://console.groq.com/docs/audio_speech
