costs:
    - input_cost_per_character: 0.00004
      region: "*"
limits:
    context_window: 4000
    max_output_tokens: 50000
    max_tokens: 50000
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: canopylabs/orpheus-arabic-saudi
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - stop
sources:
    - https://console.groq.com/docs/text-to-speech
status: preview
supportedModes:
    - text_to_speech
