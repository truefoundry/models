costs:
    - input_cost_per_character: 0.000022
      region: "*"
limits:
    max_input_tokens: 200 # 200 characters per request per official docs
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: canopylabs/orpheus-v1-english
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - stop
    - stream
sources:
    - https://console.groq.com/docs/text-to-speech
    - https://console.groq.com/docs/model/canopylabs/orpheus-v1-english
status: preview
supportedModes:
    - text_to_speech
