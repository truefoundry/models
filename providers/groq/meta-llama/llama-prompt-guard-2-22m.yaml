costs:
    - input_cost_per_token: 3.e-8
      output_cost_per_token: 3.e-8
      region: "*"
limits:
    context_window: 512
    max_output_tokens: 512
    max_tokens: 512
mode: classification
model: meta-llama/llama-prompt-guard-2-22m
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 512
      minValue: 1
