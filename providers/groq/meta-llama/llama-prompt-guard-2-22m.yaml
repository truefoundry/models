costs:
    - input_cost_per_token: 3e-8
      output_cost_per_token: 3e-8
      region: "*"
limits:
    context_window: 512
    max_input_tokens: 512
    max_output_tokens: 512
    max_tokens: 512
modalities:
    input:
        - text
    output:
        - text
mode: moderation
model: meta-llama/llama-prompt-guard-2-22m
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 512
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://console.groq.com/docs/model/meta-llama/llama-prompt-guard-2-22m
status: preview
supportedModes:
    - moderation
