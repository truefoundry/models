costs:
    - input_cost_per_token: 1.1e-7
      input_cost_per_token_batches: 5.5e-8
      output_cost_per_token: 3.4e-7
      output_cost_per_token_batches: 1.7e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - json_output
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: meta-llama/llama-4-scout-17b-16e-instruct
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://console.groq.com/docs/model/meta-llama/llama-4-scout-17b-16e-instruct
    - https://console.groq.com/docs/tool-use
    - https://console.groq.com/docs/vision
    - https://console.groq.com/docs/structured-outputs
    - https://console.groq.com/docs/batch
    - https://console.groq.com/docs/api-reference#chat-create
    - https://console.groq.com/docs/prompt-caching
    - https://console.groq.com/docs/reasoning
status: preview
supportedModes:
    - chat
