costs:
    - cache_read_input_token_cost: 3.75e-8
      input_cost_per_token: 7.5e-8
      output_cost_per_token: 3.e-7
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - prompt_caching
    - response_schema
limits:
    context_window: 131072
    max_input_tokens: 65536
    max_output_tokens: 65536
    max_tokens: 65536
mode: chat
model: openai/gpt-oss-safeguard-20b
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
sources:
    - https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
    - https://groq.com/pricing/
thinking: true
