costs:
    - cache_read_input_token_cost: 3.7e-8
      input_cost_per_token: 7.5e-8
      output_cost_per_token: 3e-7
      region: "*"
features:
    - function_calling
    - system_messages
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 131072
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai/gpt-oss-safeguard-20b
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: default
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
status: preview
supportedModes:
    - chat
thinking: true
