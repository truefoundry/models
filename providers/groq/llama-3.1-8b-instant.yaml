costs:
    - input_cost_per_token: 5e-8
      output_cost_per_token: 8e-8
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - json_output
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
