      key: tool_choice
    - defaultValue: null
      key: response_format
      type: string
pricing:
    standard:
        - input_cost_per_token: 5e-8
          output_cost_per_token: 8e-8
          region: "*"
provisioning: serverless
sources:
    - https://console.groq.com/docs/tool-use
