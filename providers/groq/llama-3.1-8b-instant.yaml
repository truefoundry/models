costs:
    - input_cost_per_token: 5.e-8
      output_cost_per_token: 8.e-8
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
    - response_schema
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
    max_tokens: 131072
mode: chat
model: llama-3.1-8b-instant
params:
    - key: max_tokens
      maxValue: 131072
    - defaultValue: null
      key: tool_choice
      skipValues:
          - null
          - []
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
sources:
    - https://console.groq.com/docs/tool-use
