costs:
    - input_cost_per_token: 0.00000225
      output_cost_per_token: 0.00000275
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - response_schema
    - prompt_caching
limits:
    context_window: 131072
    max_output_tokens: 40960
    max_tokens: 40960
mode: chat
model: zai-glm-4.7
params:
    - defaultValue: 1024
      key: max_tokens
      maxValue: 40960
      minValue: 1
    - defaultValue: false
      key: disable_reasoning
      type: boolean
    - defaultValue: true
      key: clear_thinking
      type: boolean
    - defaultValue: parsed
      key: reasoning_format
      type: string
sources:
    - https://inference-docs.cerebras.ai/models/zai-glm-47
    - https://inference-docs.cerebras.ai/capabilities/reasoning
    - https://inference-docs.cerebras.ai/capabilities/prompt-caching
    - https://inference-docs.cerebras.ai/capabilities/structured-outputs
thinking: true
