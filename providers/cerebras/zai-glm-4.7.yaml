      maxValue: 40000
sources:
    - https://inference-docs.cerebras.ai/models/zai-glm-47
    - https://inference-docs.cerebras.ai/resources/glm-47-migration
    - https://inference-docs.cerebras.ai/capabilities/prompt-caching
thinking: true
