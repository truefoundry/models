costs:
    - input_cost_per_token: 0.00000225
      output_cost_per_token: 0.00000275
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
limits:
    context_window: 131072
    max_output_tokens: 40000
    max_tokens: 40000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-glm-4.7
params:
    - defaultValue: 1
      key: temperature
    - defaultValue: 0.95
      key: top_p
    - key: max_tokens
      maxValue: 40000
    - key: reasoning_effort
      type: string
sources:
    - https://inference-docs.cerebras.ai/models/zai-glm-47
    - https://inference-docs.cerebras.ai/resources/glm-47-migration
    - https://inference-docs.cerebras.ai/capabilities/tool-use
    - https://inference-docs.cerebras.ai/capabilities/reasoning
status: preview
supportedModes:
    - chat
thinking: true
