costs:
    - cache_read_input_token_cost: 3.5e-7
      input_cost_per_token: 3.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - prompt_caching
    - system_messages
limits:
    context_window: 131000
    max_input_tokens: 131000
    max_output_tokens: 40000
    max_tokens: 40000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-oss-120b
params:
    - key: max_tokens
      maxValue: 40000
    - defaultValue: medium
      key: reasoning_effort
removeParams:
    - stream
sources:
    - https://inference-docs.cerebras.ai/models/openai-oss
    - https://inference-docs.cerebras.ai/capabilities/reasoning
    - https://inference-docs.cerebras.ai/capabilities/prompt-caching
    - https://inference-docs.cerebras.ai/support/deprecation
status: active
thinking: true
