model: gpt-oss-120b
costs:
    - region: "*"
      input_cost_per_token: 3.5e-7
      output_cost_per_token: 7.5e-7
limits:
    max_input_tokens: 131072
    max_output_tokens: 32768
features:
    [
        chat,
        function_calling,
        parallel_function_calling,
        tool_choice,
        response_schema,
    ]
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - stream
mode: chat
