costs:
    - input_cost_per_token: 3.5e-7
      output_cost_per_token: 7.5e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tool_choice
    - response_schema
limits:
    max_input_tokens: 131072
    max_output_tokens: 32768
mode: chat
model: gpt-oss-120b
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - stream
