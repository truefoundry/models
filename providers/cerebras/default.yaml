documentation:
    - https://inference-docs.cerebras.ai
    - https://inference-docs.cerebras.ai/support/deprecation
    - https://cerebras.ai/pricing
    - https://inference-docs.cerebras.ai/models/overview
    - https://inference-docs.cerebras.ai/api-reference/versions
messages:
    options:
        - system
        - user
        - assistant
params:
    - defaultValue: 1024
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: true
      key: stream
      type: boolean
