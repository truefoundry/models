costs:
    - input_cost_per_token: 4.e-7
      output_cost_per_token: 8.e-7
      region: "*"
features:
    - function_calling
    - chat
    - tools
    - tool_choice
isDeprecated: true
limits:
    max_input_tokens: 128000
    max_output_tokens: 128000
mode: chat
model: qwen-3-32b
params:
