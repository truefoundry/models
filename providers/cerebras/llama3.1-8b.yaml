costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 1.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 32000
    max_output_tokens: 8000
    max_tokens: 8000
mode: completion
model: llama3.1-8b
params:
    - key: max_tokens
      maxValue: 8000
sources:
    - https://inference-docs.cerebras.ai/models/llama-31-8b
    - https://inference-docs.cerebras.ai/capabilities/tool-use
    - https://inference-docs.cerebras.ai/capabilities/structured-outputs
    - https://inference-docs.cerebras.ai/capabilities/prompt-caching
    - https://inference-docs.cerebras.ai/api-reference/chat-completions
