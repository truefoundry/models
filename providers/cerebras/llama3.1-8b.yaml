costs:
    - input_cost_per_token: 1e-7
      output_cost_per_token: 1e-7
      region: "*"
deprecationDate: "2026-05-27"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - system_messages
    - json_output
isDeprecated: true
limits:
    context_window: 32000
    max_output_tokens: 8000
    max_tokens: 8000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: llama3.1-8b
params:
    - key: max_tokens
      maxValue: 8000
provisioning: serverless
sources:
    - https://inference-docs.cerebras.ai/models/llama-31-8b
    - https://inference-docs.cerebras.ai/capabilities/tool-use
    - https://inference-docs.cerebras.ai/capabilities/structured-outputs
    - https://inference-docs.cerebras.ai/capabilities/prompt-caching
    - https://inference-docs.cerebras.ai/api-reference/chat-completions
status: deprecated
supportedModes:
    - chat
    - completion
