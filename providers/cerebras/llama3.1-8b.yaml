costs:
    - input_cost_per_token: 1.e-7
      output_cost_per_token: 1.e-7
      region: "*"
features:
    - function_calling
    - chat
    - tools
    - tool_choice
    - response_schema
limits:
    context_window: 32768
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: llama3.1-8b
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://inference-docs.cerebras.ai/models/llama-31-8b
