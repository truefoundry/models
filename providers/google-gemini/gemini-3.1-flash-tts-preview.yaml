costs:
    - input_cost_per_token: 0.000001
      input_cost_per_token_batches: 5e-7
      output_cost_per_audio_token: 0.00002
      output_cost_per_token_batches: 0.00001
      region: "*"
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: gemini-3.1-flash-tts-preview
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
removeParams:
    - tool_choice
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-tts-preview
status: preview
supportedModes:
    - text_to_speech
