costs:
    - cache_creation_input_token_cost_per_hour: 0.000001
      cache_read_input_audio_token_cost: 5e-8
      cache_read_input_token_cost: 2.5e-8
      input_cost_per_audio_token: 5e-7
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 0.0000015
      output_cost_per_token_batches: 7.5e-7
      region: "*"
deprecationDate: "2027-05-07"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - structured_output
    - json_output
    - prompt_caching
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
        - pdf
    output:
        - text
mode: chat
model: gemini-3.1-flash-lite
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
status: active
supportedModes:
    - chat
thinking: true
