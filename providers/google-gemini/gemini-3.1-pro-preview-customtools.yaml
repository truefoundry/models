costs:
    - cache_creation_input_token_cost_per_hour: 0.0000045
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.000012
      output_cost_per_token_batches: 0.000006
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000018
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: gemini-3.1-pro-preview-customtools
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
    - https://ai.google.dev/gemini-api/docs/thinking
status: preview
supportedModes:
    - chat
thinking: true
