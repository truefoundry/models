costs:
    - cache_read_input_token_cost: 2.e-7
      cache_storage_cost_per_token_per_hour: 0.0000045
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.000012
      output_cost_per_token_batches: 0.000006
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4.e-7
                from: 200000
          input:
              - cost_per_token: 0.000004
                from: 200000
          output:
              - cost_per_token: 0.000018
                from: 200000
features:
    - function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - pdf
        - doc
        - code
    output:
        - text
        - code
mode: chat
model: gemini-3.1-pro-preview-customtools
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
    - defaultValue: null
      key: thinking
      properties:
          budget_tokens:
              maxValue: 32768
              minValue: 128
              type: number
          type:
              enum:
                  - enabled
              type: string
      skipValues:
          - null
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
    - https://ai.google.dev/gemini-api/docs/thinking
thinking: true
