costs:
    - cache_creation_input_token_cost_per_hour: 4.5e-6
      cache_read_input_token_cost: 2e-7
      flex_pricing:
          cache_read_input_token_cost: 2e-7
          input_cost_per_token: 1e-6
          output_cost_per_token: 6e-6
      input_cost_per_token: 2e-6
      input_cost_per_token_batches: 1e-6
      output_cost_per_token: 1.2e-5
      output_cost_per_token_batches: 6e-6
      priority_pricing:
          cache_read_input_token_cost: 3.6e-7
          input_cost_per_token: 3.6e-6
          output_cost_per_token: 2.16e-5
          tiered_pricing:
              cache_read:
                  - cost_per_token: 7.2e-7
                    from: 200000
              input:
                  - cost_per_token: 7.2e-6
                    from: 200000
              output:
                  - cost_per_token: 3.24e-5
                    from: 200000
              pricing_mode: cumulative
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 4e-6
                from: 200000
          output:
              - cost_per_token: 1.8e-5
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: gemini-3.1-pro-preview-customtools
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview
    - https://ai.google.dev/gemini-api/docs/thinking
status: preview
supportedModes:
    - chat
thinking: true
