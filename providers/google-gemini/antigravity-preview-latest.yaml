costs:
    - cache_creation_input_token_cost_per_hour: 5e-7
      cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 7.5e-7
      input_cost_per_token_batches: 3.75e-7
      output_cost_per_token: 3.75e-6
      output_cost_per_token_batches: 1.875e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - structured_output
    - system_messages
    - tool_choice
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: antigravity-preview-latest
params:
    - defaultValue: 65536
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/antigravity-preview-09-2026
    - https://ai.google.dev/gemini-api/docs/antigravity-agent
status: preview
supportedModes:
    - chat
thinking: true
