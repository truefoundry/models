features:
    - chat
    - vision
    - image_input
    - function_calling
    - system_messages
    - text
limits:
    context_window: 128000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gemma-3-4b-it
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://ai.google.dev/gemma/docs/core
    - https://huggingface.co/google/gemma-3-4b-it
