costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gemma-3-4b-it
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
sources:
    - https://ai.google.dev/gemma/docs/core
    - https://huggingface.co/google/gemma-3-4b-it
status: active
