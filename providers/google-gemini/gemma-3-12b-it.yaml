costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - chat
    - function_calling
    - response_schema
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
        - code
    output:
        - text
        - code
mode: chat
model: gemma-3-12b-it
sources:
    - https://huggingface.co/google/gemma-3-12b-it
