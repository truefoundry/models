costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - chat
    - vision
    - image_input
    - system_messages
    - text
    - code
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gemma-3-12b-it
sources:
    - https://huggingface.co/google/gemma-3-12b-it
