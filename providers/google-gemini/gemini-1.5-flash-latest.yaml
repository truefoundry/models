costs:
    - input_cost_per_token: 7.5e-8
      output_cost_per_token: 3e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 1.5e-7
                from: 128000
          output:
              - cost_per_token: 6e-7
                from: 128000
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
isDeprecated: true
limits:
    max_input_tokens: 1048576
    max_output_tokens: 8192
modalities:
    input:
        - doc
        - image
        - pdf
mode: chat
model: gemini-1.5-flash-latest
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
