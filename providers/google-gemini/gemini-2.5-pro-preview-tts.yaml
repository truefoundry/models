      maxValue: 16384
provisioning: serverless
removeParams:
    - tool_choice
sources:
    - https://ai.google.dev/gemini-api/docs/speech-generation
    - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-pro-preview-tts
status: preview
supportedModes:
    - text_to_speech
