model: gemini-pro-latest
costs:
    - region: "*"
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token_batches: 0.000005
      cache_read_input_token_cost: 1.25e-7
      cache_storage_cost_per_token_per_hour: 0.0000045
      tiered_pricing:
          cache_read:
              - from: 200000
                cost_per_token: 2.5e-7
          input:
              - from: 200000
                cost_per_token: 0.0000025
          output:
              - from: 200000
                cost_per_token: 0.000015
limits:
    max_tokens: 65535
    max_input_tokens: 1048576
    max_output_tokens: 65535
features: [function_calling, vision, audio_input]
mode: chat
