costs:
    - input_cost_per_audio_token: 0.0000065
      input_cost_per_image: 0.00012
      input_cost_per_image_token: 4.5e-7
      input_cost_per_second: 0.00016
      input_cost_per_token: 2.e-7
      input_cost_per_token_batches: 1.e-7
      input_cost_per_video_token: 0.000012
      region: "*"
features:
    - vision
    - image_input
    - audio_input
    - pdf_input
    - embedding_image_input
limits:
    max_input_tokens: 8192
mode: embedding
model: gemini-embedding-2-preview
removeParams:
    - max_tokens
    - temperature
    - top_p
    - top_k
    - stop
    - stream
    - tool_choice
sources:
    - https://ai.google.dev/gemini-api/docs/embeddings
