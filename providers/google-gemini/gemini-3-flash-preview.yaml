costs:
    - cache_read_input_audio_token_cost: 1.e-7
      cache_read_input_token_cost: 5.e-8
      cache_storage_cost_per_token_per_hour: 0.000001
      input_cost_per_audio_token: 0.000001
      input_cost_per_token: 5.e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_token: 0.000003
      output_cost_per_token_batches: 0.0000015
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: gemini-3-flash-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3-flash-preview
    - https://ai.google.dev/gemini-api/docs/thinking
status: preview
supportedModes:
    - chat
thinking: true
