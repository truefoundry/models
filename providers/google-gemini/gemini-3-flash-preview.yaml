canonical_model: google/gemini-3-flash-preview
costs:
    - cache_creation_input_token_cost_per_hour: 1e-6
      cache_read_input_audio_token_cost: 1e-7
      cache_read_input_token_cost: 5e-8
      flex_pricing:
          cache_read_input_token_cost: 5e-8
          input_cost_per_token: 2.5e-7
          output_cost_per_token: 1.5e-6
      input_cost_per_audio_token: 1e-6
      input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_token: 3e-6
      output_cost_per_token_batches: 1.5e-6
      priority_pricing:
          cache_read_input_token_cost: 9e-8
          input_cost_per_audio_token: 1.8e-6
          input_cost_per_token: 9e-7
          output_cost_per_token: 5.4e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - audio
        - image
        - pdf
        - text
        - video
    output:
        - text
mode: chat
model: gemini-3-flash-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: thinking
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3-flash-preview
    - https://ai.google.dev/gemini-api/docs/thinking
    - https://ai.google.dev/gemini-api/docs/generate-content/thinking
status: preview
supportedModes:
    - chat
thinking: true
