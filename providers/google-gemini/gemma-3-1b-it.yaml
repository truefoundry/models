costs:
    - cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0
      input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - tools
    - structured_output
limits:
    max_input_tokens: 32768
    max_output_tokens: 8192
mode: chat
model: gemma-3-1b-it
sources:
    - https://ai.google.dev/gemma/docs/core
