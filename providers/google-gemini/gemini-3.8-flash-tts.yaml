costs:
    - flex_pricing:
          input_cost_per_token: 2.5e-7
          output_cost_per_token: 4.5e-6
      input_cost_per_token: 5e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_audio_token: 9e-6
      output_cost_per_token_batches: 4.5e-6
      priority_pricing:
          input_cost_per_token: 9e-7
          output_cost_per_token: 1.62e-5
      region: "*"
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: gemini-3.8-flash-tts
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
removeParams:
    - tool_choice
    - reasoning_effort
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash-tts
status: active
supportedModes:
    - text_to_speech
