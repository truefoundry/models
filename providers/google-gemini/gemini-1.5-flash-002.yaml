costs:
    - cache_creation_input_token_cost: 0.000001
      cache_read_input_token_cost: 1.875e-8
      input_cost_per_token: 7.5e-8
      output_cost_per_token: 3.e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 1.5e-7
                from: 128000
          output:
              - cost_per_token: 6.e-7
                from: 128000
features:
    - function_calling
    - vision
    - chat
    - image
    - pdf
    - doc
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
isDeprecated: true
limits:
    max_input_tokens: 1048576
    max_output_tokens: 8192
mode: chat
model: gemini-1.5-flash-002
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
