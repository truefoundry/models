costs:
    - cache_creation_input_token_cost_per_hour: 5e-7
      cache_read_input_token_cost: 7.5e-8
      input_cost_per_audio_token: 3e-6
      input_cost_per_image_token: 1e-6
      input_cost_per_token: 7.5e-7
      input_cost_per_video_token: 1e-6
      output_cost_per_audio_token: 1.2e-5
      output_cost_per_token: 4.5e-6
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - system_messages
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
    output:
        - text
        - audio
mode: realtime
model: gemini-3.8-live
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://ai.google.dev/gemini-api/docs/live
status: active
supportedModes:
    - realtime
