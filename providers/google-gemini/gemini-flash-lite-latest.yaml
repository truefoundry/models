costs:
    - cache_creation_input_token_cost_per_hour: 1e-6
      cache_read_input_audio_token_cost: 5e-8
      cache_read_input_token_cost: 2.5e-8
      flex_pricing:
          cache_read_input_token_cost: 1.66666666666667e-8
          input_cost_per_token: 1.25e-7
          output_cost_per_token: 1.04166666666667e-6
      input_cost_per_audio_token: 5e-7
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 1.5e-6
      output_cost_per_token_batches: 7.5e-7
      priority_pricing:
          cache_read_input_token_cost: 4.16666666666667e-8
          input_cost_per_token: 4.5e-7
          output_cost_per_token: 3.75e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: gemini-flash-lite-latest
params:
    - key: max_tokens
      maxValue: 65536
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
status: active
supportedModes:
    - chat
thinking: true
