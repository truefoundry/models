model: gemini-flash-lite-latest
costs:
  - region: '*'
    input_cost_per_token: 1.e-7
    output_cost_per_token: 4.e-7
    cache_read_input_token_cost: 1.e-8
    input_cost_per_audio_token: 3.e-7
limits:
  max_tokens: 65535
  max_input_tokens: 1048576
  max_output_tokens: 65535
features: [function_calling, parallel_function_calling, vision, system_messages, tool_choice, prompt_caching, response_schema, pdf_input]
mode: chat
