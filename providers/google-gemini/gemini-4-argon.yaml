costs:
    - cache_read_input_token_cost: 1e-7
      input_cost_per_token: 2e-6
      output_cost_per_token: 1e-5
      region: "*"
features:
    - code_execution
    - function_calling
    - prompt_caching
    - structured_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
        - pdf
    output:
        - text
mode: chat
model: gemini-4-argon
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
sources:
    - https://deepmind.google/models/gemini/
    - https://deepmind.google/models/gemini/cyber/
    - https://deepmind.google/models/evals-methodology/gemini-4-argon
status: preview
supportedModes:
    - chat
thinking: true
