costs:
    - input_cost_per_token: 5.e-7
      input_cost_per_token_batches: 2.5e-7
      output_cost_per_audio_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
limits:
    max_input_tokens: 8192
    max_output_tokens: 16384
modalities:
    output:
        - audio
mode: text_to_speech
model: gemini-2.5-flash-preview-tts
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-preview-tts
    - https://ai.google.dev/gemini-api/docs/speech-generation
