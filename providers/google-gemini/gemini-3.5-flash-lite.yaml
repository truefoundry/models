costs:
    - cache_creation_input_token_cost_per_hour: 1e-6
      cache_read_input_token_cost: 3e-8
      input_cost_per_token: 3e-7
      input_cost_per_token_batches: 1.5e-7
      output_cost_per_token: 2.5e-6
      output_cost_per_token_batches: 1.25e-6
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: gemini-3.5-flash-lite
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
    - defaultValue: minimal
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash-lite
status: active
supportedModes:
    - chat
thinking: true
