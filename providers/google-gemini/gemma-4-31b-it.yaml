costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - system_messages
    - structured_output
    - json_output
    - tool_choice
limits:
    context_window: 262144
    max_input_tokens: 262144
    max_output_tokens: 32768
    max_tokens: 32768
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: gemma-4-31b-it
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
sources:
    - https://ai.google.dev/gemma/docs/core/model_card_4
    - https://ai.google.dev/gemma/docs/core/prompt-formatting-gemma4
status: active
thinking: true
