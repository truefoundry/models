costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
features:
    - function_calling
    - json_output
    - structured_output
    - system_messages
    - tool_choice
limits:
    context_window: 256000
    max_input_tokens: 256000
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: gemma-4-31b-it
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
pricing:
    standard:
        - input_cost_per_token: 0
          output_cost_per_token: 0
          region: "*"
provisioning: serverless
sources:
    - https://ai.google.dev/gemma/docs/core/model_card_4
    - https://ai.google.dev/gemma/docs/core/prompt-formatting-gemma4
status: active
supportedModes:
    - chat
thinking: true
