costs:
    - input_cost_per_audio_token: 0.000002
      input_cost_per_token: 0.000001
      input_cost_per_token_batches: 5e-7
      output_cost_per_token: 0.000005
      output_cost_per_token_batches: 0.0000025
      region: "*"
features:
    - function_calling
    - structured_output
    - code_execution
    - prompt_caching
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
    output:
        - text
mode: chat
model: gemini-robotics-er-1.6-preview
params:
    - key: max_tokens
      maxValue: 65536
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-1.6-preview
status: preview
supportedModes:
    - chat
thinking: true
