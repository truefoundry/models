costs:
    -
        input_cost_per_token: 7.5e-8
        input_cost_per_token_batches: 3.75e-8
        output_cost_per_token: 3.e-7
        output_cost_per_token_batches: 1.5e-7
        region: "*"
features:
    - function_calling
    - vision
    - audio_output
    - chat
    - image
    - pdf
    - doc
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    max_input_tokens: 1048576
    max_output_tokens: 8192
    max_tokens: 4096
mode: chat
model: gemini-2.0-flash-lite
