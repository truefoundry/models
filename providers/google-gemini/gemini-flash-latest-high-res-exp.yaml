features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - video
        - audio
        - pdf
    output:
        - text
mode: chat
model: gemini-flash-latest-high-res-exp
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/latest-model
    - https://ai.google.dev/gemini-api/docs/media-resolution
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
status: preview
supportedModes:
    - chat
thinking: true
