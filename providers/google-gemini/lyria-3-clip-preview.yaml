costs:
    - input_cost_per_request: 0.04
      region: "*"
modalities:
    input:
        - text
        - image
    output:
        - text
        - audio
mode: unsupported # Music generation model
model: lyria-3-clip-preview
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
provisioning: serverless
removeParams:
    - stop
    - tool_choice
    - max_tokens
    - reasoning_effort
sources:
    - https://ai.google.dev/gemini-api/docs/music-generation
status: preview
supportedModes:
    - text_to_speech
