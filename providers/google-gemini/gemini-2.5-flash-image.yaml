costs:
    - cache_read_input_token_cost: 3.e-8
      cache_storage_cost_per_token_per_hour: 0.000001
      input_cost_per_token: 3.e-7
      input_cost_per_token_batches: 1.5e-7
      output_cost_per_image_1k: 0.039
      output_cost_per_image_token: 0.00003
      region: "*"
features:
    - prompt_caching
    - structured_output
limits:
    max_input_tokens: 65536
    max_output_tokens: 32768
modalities:
    input:
        - image
mode: image
model: gemini-2.5-flash-image
params:
    - key: max_tokens
      maxValue: 32768
removeParams:
    - tool_choice
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash-image
    - https://ai.google.dev/gemini-api/docs/image-generation
