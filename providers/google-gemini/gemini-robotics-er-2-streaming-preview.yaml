costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 65536
    max_tokens: 65536
modalities:
    input:
        - text
        - image
        - audio
        - video
    output:
        - text
mode: realtime
model: gemini-robotics-er-2-streaming-preview
params:
    - defaultValue: 1
      key: temperature
      maxValue: 2
    - defaultValue: 0.95
      key: top_p
    - defaultValue: 64
      key: top_k
    - defaultValue: 65536
      key: max_tokens
      maxValue: 65536
      minValue: 1
provisioning: serverless
sources:
    - https://ai.google.dev/gemini-api/docs/robotics-overview
    - https://ai.google.dev/gemini-api/docs/models/gemini-robotics-er-2-preview
status: preview
supportedModes:
    - realtime
    - chat
thinking: true
