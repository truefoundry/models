---
model: gemini-2.0-flash
costs:
  - region: '*'
    input_cost_per_token: 1.e-7
    output_cost_per_token: 4.e-7
    input_cost_per_token_batches: 5.e-8
    output_cost_per_token_batches: 2.e-7
    cache_read_input_token_cost: 2.5e-8
    cache_read_input_audio_token_cost: 1.75e-7
    cache_storage_cost_per_token_per_hour: 0.000001
    input_cost_per_audio_token: 7.e-7
    output_cost_per_image_1k: 0.039
limits:
  max_input_tokens: 1048576
  max_output_tokens: 8192
features:
  - function_calling
  - vision
  - audio_input
  - audio_output
  - chat
  - image
params:
  - key: max_tokens
    maxValue: 8192
  - key: response_format
    defaultValue:
    options:
      - value:
        name: Text
      - value: json_object
        name: JSON Object
        schema:
          type: object
          properties:
            type:
              type: string
              value: json_object
      - value: json_schema
        name: JSON Schema
        schema:
          type: object
          properties:
            type:
              type: string
              value: json_schema
            json_schema:
              type: object
        params:
          key: json_schema
          defaultValue:
          type: json
          skipValues: [null]
    skipValues: [null]
    type: string
mode: chat
