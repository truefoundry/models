costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_audio_token: 7.e-7
      input_cost_per_token: 1.e-7
      output_cost_per_token: 4.e-7
      region: "*"
features:
    - chat
    - image
    - tools
    - function_calling
    - vision
    - audio_input
    - audio_output
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    max_input_tokens: 1048576
    max_output_tokens: 8192
mode: chat
model: gemini-2.0-flash
params:
    - key: max_tokens
      maxValue: 8192
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
