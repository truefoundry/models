costs:
    - input_cost_per_token: 5.e-8
      output_cost_per_token: 2.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - structured_output
    - tool_choice
limits:
    context_window: 128000
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: openai/gpt-oss-20b
sources:
    - https://www.together.ai/models/gpt-oss-20b
    - https://docs.together.ai/docs/gpt-oss
    - https://docs.together.ai/docs/function-calling
    - https://docs.together.ai/docs/json-mode
supportedModes:
    - chat
thinking: true
