costs:
    - input_cost_per_second: 0.000025
      region: "*"
modalities:
    input:
        - audio
    output:
        - text
mode: audio_transcription
model: openai/whisper-large-v3
params:
    - defaultValue: 0
      key: temperature
      maxValue: 1
      minValue: 0
      type: number
    - defaultValue: json
      key: response_format
      type: string
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.together.ai/reference/audio-transcriptions
    - https://docs.together.ai/reference/audio-translations
status: active
supportedModes:
    - audio_transcription
    - audio_translation
