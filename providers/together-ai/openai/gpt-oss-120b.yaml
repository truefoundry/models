costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 128000
mode: completion
model: openai/gpt-oss-120b
sources:
    - https://docs.together.ai/docs/serverless-models
