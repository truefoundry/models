costs:
    - cache_read_input_token_cost: 1.7e-7
      input_cost_per_token: 1e-6
      output_cost_per_token: 4.05e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
limits:
    context_window: 524288
modalities:
