costs:
    - cache_read_input_token_cost: 2.6e-7
      input_cost_per_token: 1.4e-6
      output_cost_per_token: 4.4e-6
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/GLM-5.3-FP8
params:
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://www.together.ai/models/glm-5-3
supportedModes:
    - chat
thinking: true
