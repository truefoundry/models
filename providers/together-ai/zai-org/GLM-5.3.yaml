costs:
    - cache_read_input_token_cost: 2.6e-7
      input_cost_per_token: 1.4e-6
      output_cost_per_token: 4.4e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - prompt_caching
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: zai-org/GLM-5.3
params:
    - defaultValue: max
      key: reasoning_effort
      supportedValues:
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://www.together.ai/models/glm-5-3
    - https://docs.z.ai/guides/llm/glm-5.3
status: active
supportedModes:
    - chat
thinking: true
