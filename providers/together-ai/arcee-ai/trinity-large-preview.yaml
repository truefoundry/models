features:
    - function_calling
    - system_messages
    - structured_output
    - json_output
limits:
    context_window: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: arcee-ai/trinity-large-preview
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.arcee.ai/language-models/trinity-large-preview
    - https://huggingface.co/arcee-ai/Trinity-Large-Preview
    - https://www.arcee.ai/trinity
    - https://www.arcee.ai/blog/trinity-large
status: preview
supportedModes:
    - chat
