costs:
    - cache_read_input_token_cost: 1.5e-7
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 4.25e-6
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - tool_choice
    - system_messages
    - json_output
    - prompt_caching
limits:
    context_window: 1048576
modalities:
    input:
        - text
        - image
        - audio
        - video
        - pdf
    output:
        - text
mode: chat
model: meta-models/Muse-Spark-Open-816B-A42B
params:
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
sources:
    - https://www.together.ai/models/muse-spark-open
    - https://www.together.ai/pricing
    - https://openrouter.ai/api/v1/models
status: active
supportedModes:
    - chat
thinking: true
