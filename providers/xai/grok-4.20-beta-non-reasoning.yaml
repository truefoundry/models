costs:
    - cache_read_input_token_cost: 2.e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: "*"
features:
    - chat
    - function_calling
    - response_schema
    - system_messages
    - tool_choice
limits:
    context_window: 2000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.20-beta-non-reasoning
sources:
    - https://docs.x.ai/developers/models#models-and-pricing
