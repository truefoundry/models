costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 2e-7
      input_cost_per_token_batches: 1e-7
      output_cost_per_token: 5e-7
      output_cost_per_token_batches: 2.5e-7
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 4e-7
                from: 128000
          output:
              - cost_per_token: 1e-6
                from: 128000
          pricing_mode: marginal
features:
    - function_calling
    - tool_choice
    - structured_output
    - prompt_caching
limits:
    context_window: 2000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4-fast-non-reasoning
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.x.ai/developers/models/grok-4-fast-non-reasoning
status: active
supportedModes:
    - chat
