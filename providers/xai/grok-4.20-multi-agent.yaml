costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_image_token: 1.25e-6
      input_cost_per_token: 1.25e-6
      output_cost_per_token: 2.5e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: grok-4.20-multi-agent
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - max_tokens
    - max_completion_tokens
status: active
supportedModes:
    - responses
thinking: true
