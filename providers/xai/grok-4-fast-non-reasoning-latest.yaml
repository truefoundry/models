model: grok-4-fast-non-reasoning-latest
costs:
    - region: us-east-1
      input_cost_per_token: 2.e-7
      output_cost_per_token: 5.e-7
      cache_read_input_token_cost: 5.e-8
      tiered_pricing:
          input:
              - from: 128000
                cost_per_token: 4.e-7
          output:
              - from: 128000
                cost_per_token: 0.000001
    - region: eu-west-1
      input_cost_per_token: 2.e-7
      output_cost_per_token: 5.e-7
      cache_read_input_token_cost: 5.e-8
      tiered_pricing:
          input:
              - from: 128000
                cost_per_token: 4.e-7
          output:
              - from: 128000
                cost_per_token: 0.000001
    - region: "*"
      input_cost_per_token: 2.e-7
      output_cost_per_token: 5.e-7
      cache_read_input_token_cost: 5.e-8
      tiered_pricing:
          input:
              - from: 128000
                cost_per_token: 4.e-7
          output:
              - from: 128000
                cost_per_token: 0.000001
      input_cost_per_image: 2.e-7
      input_cost_per_query: 0.025
limits:
    max_tokens: 4096
    max_input_tokens: 2000000
    max_output_tokens: 2000000
features:
    - function_calling
    - chat
mode: chat
