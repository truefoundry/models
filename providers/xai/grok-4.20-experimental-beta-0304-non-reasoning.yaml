costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.0000025
      output_cost_per_token_batches: 0.00000125
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.0000025
                from: 200000
          output:
              - cost_per_token: 0.000005
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - structured_output
    - system_messages
    - json_output
    - prompt_caching
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.20-experimental-beta-0304-non-reasoning
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://docs.x.ai/developers/models#models-and-pricing
status: active
supportedModes:
    - chat
