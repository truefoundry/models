        - text
        - image
    output:
        - text
mode: chat
model: grok-4.20-multi-agent-beta-latest
removeParams:
    - reasoning_effort
sources:
    - https://docs.x.ai/developers/models#models-and-pricing
status: preview
supportedModes:
    - chat
thinking: true
