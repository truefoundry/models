costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_image_token: 0.00000125
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.0000025
      output_cost_per_token_batches: 0.000002
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 200000
          input:
              - cost_per_token: 0.0000025
                from: 200000
          output:
              - cost_per_token: 0.000005
                from: 200000
          pricing_mode: cumulative
features:
    - function_calling
    - prompt_caching
    - structured_output
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: grok-4.20-multi-agent-latest
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - max_tokens
    - max_completion_tokens
status: active
supportedModes:
    - responses
thinking: true
