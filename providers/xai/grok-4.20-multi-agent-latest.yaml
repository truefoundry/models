costs:
    - cache_read_input_token_cost: 2.e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 2000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: grok-4.20-multi-agent-latest
removeParams:
    - max_tokens
    - max_completion_tokens
supportedModes:
    - responses
thinking: true
