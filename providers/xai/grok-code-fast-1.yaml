costs:
    - cache_read_input_token_cost: 2.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 0.0000015
      region: "*"
features:
    - function_calling
    - chat
    - tool_choice
    - response_schema
    - prompt_caching
limits:
    context_window: 256000
mode: chat
model: grok-code-fast-1
removeParams:
    - stop
sources:
    - https://docs.x.ai/docs/guides/reasoning
    - https://docs.x.ai/developers/advanced-api-usage/grok-code-prompt-engineering
    - https://docs.x.ai/docs/key-information/consumption-and-rate-limits
thinking: true
