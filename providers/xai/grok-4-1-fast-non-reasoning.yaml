costs:
    - cache_read_input_token_cost: 5.e-8
      input_cost_per_token: 2.e-7
      input_cost_per_token_batches: 1.e-7
      output_cost_per_token: 5.e-7
      output_cost_per_token_batches: 2.5e-7
      region: "*"
features:
    - function_calling
    - vision
    - image_input
    - chat
    - tool_choice
    - response_schema
    - prompt_caching
limits:
    context_window: 2000000
    max_input_tokens: 2000000
mode: chat
model: grok-4-1-fast-non-reasoning
sources:
    - https://docs.x.ai/docs/guides/structured-outputs
    - https://docs.x.ai/docs/guides/batch-api
    - https://docs.oracle.com/en-us/iaas/Content/generative-ai/xai-grok-4-1-fast.htm
