costs:
    - cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.0000025
      output_cost_per_token_batches: 0.00000125
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - system_messages
limits:
    context_window: 1000000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4.20-experimental-beta-non-reasoning-latest
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 131072
      minValue: 1
provisioning: serverless
removeParams:
    - reasoning_effort
status: preview
supportedModes:
    - chat
