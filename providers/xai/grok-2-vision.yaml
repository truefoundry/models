model: grok-2-vision
costs:
    - region: us-east-1
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      input_cost_per_image: 0.000002
    - region: eu-west-1
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      input_cost_per_image: 0.000002
    - region: "*"
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      input_cost_per_image: 0.000002
      cache_read_input_token_cost: 0
      input_cost_per_query: 0
limits:
    max_tokens: 4096
    max_input_tokens: 32768
    max_output_tokens: 32768
features:
    - function_calling
    - vision
    - chat
    - tool_choice
mode: chat
