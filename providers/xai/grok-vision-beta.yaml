costs:
    - input_cost_per_image: 0.000005
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015
      region: "*"
features:
    - function_calling
    - vision
    - chat
    - image
    - tool_choice
limits:
    max_input_tokens: 8192
    max_output_tokens: 8192
mode: chat
model: grok-vision-beta
params:
    - key: max_tokens
      maxValue: 4096
