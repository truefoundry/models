costs:
    - input_cost_per_token: 0.001
      output_cost_per_token: 0.002
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: test-model-cleanup
