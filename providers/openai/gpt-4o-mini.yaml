costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 1.5e-7
      input_cost_per_token_batches: 7.5e-8
      output_cost_per_token: 6.e-7
      output_cost_per_token_batches: 3.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - chat
    - image
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    max_input_tokens: 128000
    max_output_tokens: 16384
mode: chat
model: gpt-4o-mini
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
