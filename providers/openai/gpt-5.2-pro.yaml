costs:
    - input_cost_per_token: 0.000021
      output_cost_per_token: 0.000168
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5.2-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - key: reasoning_effort
provisioning: serverless
removeParams:
    - max_tokens
    - max_completion_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2-pro
status: active
supportedModes:
    - responses
thinking: true
