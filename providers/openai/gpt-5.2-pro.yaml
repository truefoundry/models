costs:
    - cache_read_input_token_cost: 0.0000021
      input_cost_per_token: 0.000021
      input_cost_per_token_batches: 0.0000105
      output_cost_per_token: 0.000168
      output_cost_per_token_batches: 0.000084
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.2-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - key: reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2-pro
thinking: true
