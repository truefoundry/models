costs:
    - cache_read_input_token_cost: 0.0000021
      input_cost_per_token: 0.000021
      output_cost_per_token: 0.000168
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.2-pro
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2-pro
    - https://langcopilot.com/llm-pricing/openai/gpt-5.2-pro
    - https://llm-stats.com/models/gpt-5.2-pro-2025-12-11
thinking: true
