costs:
    - cache_read_input_token_cost: 0.0000015
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000012
      region: "*"
features:
    - prompt_caching
    - function_calling
isDeprecated: true
limits:
    max_input_tokens: 128000
    max_output_tokens: 65536
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - image
        - pdf
mode: chat
model: o1-mini-2024-09-12
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 65536
      minValue: 1
removeParams:
    - temperature
    - top_p
    - "n"
    - stream
    - max_tokens
    - stop
