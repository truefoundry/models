costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - image
        - pdf
mode: chat
model: gpt-5-2025-08-07
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
    - defaultValue: null
      enum:
          - low
          - medium
          - high
          - null
      key: verbosity
      skipValues:
          - null
    - defaultValue: null
      key: reasoning
      nestedOptions:
          - value:
                effort: minimal
            view: minimal
          - value:
                effort: low
            view: low
          - value:
                effort: medium
            view: medium
          - value:
                effort: high
            view: high
      skipValues:
          - null
removeParams:
    - temperature
    - top_p
    - "n"
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - max_tokens
sources:
    - https://developers.openai.com/docs/models/gpt-5
    - https://developers.openai.com/docs/pricing
    - https://developers.openai.com/docs/deprecations
thinking: true
