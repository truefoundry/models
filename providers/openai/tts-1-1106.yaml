costs:
    - input_cost_per_character: 0.000015
      region: "*"
features:
    - audio_output
mode: audio_speech
model: tts-1-1106
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/guides/text-to-speech
    - https://developers.openai.com/api/docs/pricing
    - https://developers.openai.com/docs/api-reference/audio/createSpeech
    - https://developers.openai.com/api/docs/deprecations/
