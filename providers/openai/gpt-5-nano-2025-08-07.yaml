costs:
    - cache_read_input_token_cost: 5.e-9
      input_cost_per_token: 5.e-8
      input_cost_per_token_batches: 2.5e-8
      output_cost_per_token: 4.e-7
      output_cost_per_token_batches: 2.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5-nano-2025-08-07
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-nano
thinking: true
