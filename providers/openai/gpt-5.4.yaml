costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 0.0000025
      input_cost_per_token_batches: 0.00000125
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5.e-7
                from: 272000
          input:
              - cost_per_token: 0.000005
                from: 272000
          output:
              - cost_per_token: 0.0000225
                from: 272000
features:
    - chat
    - text
    - vision
    - image_input
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - response_schema
    - prompt_caching
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.4
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      options:
          - name: None
            value: none
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
          - name: Extra High
            value: xhigh
      type: string
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4
    - https://developers.openai.com/api/docs/pricing
thinking: true
