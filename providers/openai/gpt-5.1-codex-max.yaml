costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - chat
    - system_messages
    - tool_choice
    - response_schema
    - prompt_caching
    - text
    - code
    - tools
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.1-codex-max
params:
    - defaultValue: medium
      key: reasoning_effort
      options:
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
          - name: Extra High
            value: xhigh
removeParams:
    - max_tokens
    - temperature
    - top_p
    - frequency_penalty
    - presence_penalty
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.1-codex-max
    - https://developers.openai.com/api/docs/pricing
    - https://developers.openai.com/codex/models/
    - https://openrouter.ai/openai/gpt-5.1-codex-max/api
thinking: true
