model: gpt-4-32k-0314
costs:
    - region: "*"
      input_cost_per_token: 0.00006
      output_cost_per_token: 0.00012
limits:
    max_input_tokens: 32768
    max_output_tokens: 4096
features: [chat, system_messages, tool_choice, prompt_caching]
params:
  - key: max_tokens
    maxValue: 32768
mode: chat
