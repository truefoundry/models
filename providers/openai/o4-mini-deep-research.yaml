costs:
    - cache_read_input_token_cost: 5.e-7
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000008
      region: "*"
features:
    - chat
    - system_messages
    - prompt_caching
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - image
mode: completion
model: o4-mini-deep-research
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/guides/deep-research
    - https://developers.openai.com/api/docs/models/o4-mini-deep-research
    - https://openrouter.ai/openai/o4-mini-deep-research/api
thinking: true
