costs:
    - input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.e-7
      region: "*"
features:
    - system_messages
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: gpt-4o-mini-search-preview-2025-03-11
removeParams:
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/models/gpt-4o-mini-search-preview
    - https://developers.openai.com/docs/deprecations
