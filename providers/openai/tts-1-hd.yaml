costs:
    - input_cost_per_character: 0.00003
      region: "*"
limits:
    max_tokens: 4096
modalities:
    output:
        - audio
mode: audio_speech
model: tts-1-hd
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - tool_choice
    - parallel_tool_calls
    - logit_bias
    - stream
sources:
    - https://developers.openai.com/api/docs/models/tts-1-hd
    - https://developers.openai.com/docs/guides/text-to-speech
    - https://developers.openai.com/docs/api-reference/audio/createSpeech
