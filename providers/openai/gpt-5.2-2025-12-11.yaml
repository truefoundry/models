costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      input_cost_per_token_batches: 8.75e-7
      output_cost_per_token: 0.000014
      output_cost_per_token_batches: 0.000007
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.2-2025-12-11
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 272000
      minValue: 1
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
removeParams:
    - temperature
    - top_p
    - "n"
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2
    - https://developers.openai.com/api/docs/pricing
thinking: true
