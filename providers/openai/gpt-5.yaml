canonical_model: openai/gpt-5
costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 1.25e-6
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 1e-5
      output_cost_per_token_batches: 5e-6
      priority_pricing:
          cache_read_input_token_cost: 2.5e-7
          input_cost_per_token: 2.5e-6
          output_cost_per_token: 2e-5
      region: "*"
external_ids:
    artificial_analysis_id: 48e50f00-1fd1-4acc-b337-61078aa341e6
    artificial_analysis_slug: gpt-5
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue:
      key: response_format
      type: string
    - defaultValue:
      key: verbosity
    - defaultValue:
      key: reasoning
    - defaultValue:
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
preferChatCompletions: true
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - n
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5
status: active
supportedModes:
    - chat
    - responses
thinking: true
