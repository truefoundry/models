model: gpt-5.3-chat-latest
costs:
  - region: '*'
    input_cost_per_token: 0.00000175
    output_cost_per_token: 0.000014
    cache_read_input_token_cost: 1.75e-7
limits:
  max_tokens: 16384
  max_input_tokens: 128000
  max_output_tokens: 16384
features: [function_calling, parallel_function_calling, vision, system_messages, tool_choice, prompt_caching, response_schema, pdf_input]
mode: chat
