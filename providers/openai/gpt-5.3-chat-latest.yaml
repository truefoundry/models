costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - chat
    - function_calling
    - tool_choice
    - system_messages
    - structured_output
    - prompt_caching
limits:
    context_window: 128000
    max_input_tokens: 111616
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: completion
model: gpt-5.3-chat-latest
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.3-chat-latest
