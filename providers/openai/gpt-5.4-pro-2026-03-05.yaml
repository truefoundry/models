costs:
    - input_cost_per_token: 0.00003
      input_cost_per_token_batches: 0.000015
      output_cost_per_token: 0.00018
      output_cost_per_token_batches: 0.00009
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.00006
                from: 272000
          output:
              - cost_per_token: 0.00027
                from: 272000
features:
    - chat
    - function_calling
    - vision
    - image_input
    - system_messages
    - tool_choice
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.4-pro-2026-03-05
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      options:
          - name: Medium
            value: medium
          - name: High
            value: high
          - name: Extra High
            value: xhigh
      type: string
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-pro
    - https://developers.openai.com/api/docs/pricing
    - https://developers.openai.com/api/docs/guides/latest-model
thinking: true
