costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - chat
    - tools
    - system_messages
    - prompt_caching
    - response_schema
    - tool_choice
    - pdf_input
    - text
    - code
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: gpt-5-chat-latest
params:
    - defaultValue: 4096
      key: max_completion_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
removeParams:
    - max_tokens
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-chat-latest
    - https://developers.openai.com/api/docs/deprecations/
    - https://developers.openai.com/api/docs/pricing
