costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      input_cost_per_token_batches: 6.25e-7
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - chat
    - function_calling
    - parallel_function_calling
    - tools
    - tool_choice
    - system_messages
    - prompt_caching
    - structured_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - image
mode: completion
model: gpt-5-chat-latest
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/docs/models/gpt-5-chat-latest
    - https://developers.openai.com/docs/pricing
    - https://developers.openai.com/docs/models/gpt-5
thinking: true
