costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      output_cost_per_token: 0.000002
      region: "*"
features:
    - chat
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - prompt_caching
    - response_schema
    - system_messages
    - tool_choice
    - text
    - code
    - tools
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.1-codex-mini
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      options:
          - name: None
            value: none
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.1-codex-mini
    - https://developers.openai.com/api/docs/pricing
thinking: true
