costs:
    - input_cost_per_second: 0.0001
      region: "*"
modalities:
    input:
        - audio
mode: audio_transcription
model: whisper-1
params:
    - defaultValue: 0
      key: temperature
      maxValue: 1
      minValue: 0
removeParams:
    - max_tokens
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/models/whisper-1
    - https://developers.openai.com/api/docs/pricing
