costs:
    - input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
isDeprecated: true
limits:
    max_input_tokens: 16385
    max_output_tokens: 4096
mode: chat
model: gpt-3.5-turbo-1106
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
supportedModes:
    - chat
    - responses
