costs:
    - cache_read_input_audio_token_cost: 3.e-7
      input_cost_per_audio_token: 0.00001
      input_cost_per_token: 6.e-7
      output_cost_per_audio_token: 0.00002
      output_cost_per_token: 0.0000024
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - audio
    output:
        - audio
mode: chat
model: gpt-audio-mini-2025-12-15
sources:
    - https://developers.openai.com/api/docs/models/gpt-audio-mini
    - https://developers.openai.com/api/docs/pricing
    - https://developers.openai.com/api/docs/deprecations
