costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      input_cost_per_token_batches: 8.75e-7
      output_cost_per_token: 0.000014
      output_cost_per_token_batches: 0.000007
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.2-chat-latest
params:
    - defaultValue: 16384
      key: max_completion_tokens
      maxValue: 16384
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2
    - https://developers.openai.com/api/docs/models/gpt-5.2-chat-latest
status: active
supportedModes:
    - chat
thinking: true
