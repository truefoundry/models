costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 0.000002
      output_cost_per_token_batches: 0.000001
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5.e-8
                from: 272000
          input:
              - cost_per_token: 5.e-7
                from: 272000
          output:
              - cost_per_token: 0.000003
                from: 272000
features:
    - function_calling
    - parallel_function_calling
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - image
        - pdf
mode: chat
model: gpt-5-mini
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: verbosity
    - defaultValue: null
      key: reasoning
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-mini
    - https://developers.openai.com/api/docs/pricing
thinking: true
