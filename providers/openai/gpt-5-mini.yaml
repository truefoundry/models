costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 2.5e-7
      input_cost_per_token_batches: 1.25e-7
      output_cost_per_token: 0.000002
      output_cost_per_token_batches: 0.000001
      priority_pricing:
          cache_read_input_token_cost: 4.5e-8
          input_cost_per_token: 4.5e-7
          output_cost_per_token: 0.0000036
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-5-mini
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: null
      key: reasoning
    - defaultValue: null
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
    - defaultValue: null
      key: verbosity
      type: string
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-mini
    - https://developers.openai.com/docs/guides/reasoning
    - https://developers.openai.com/api/docs/guides/pdf-files/
status: active
supportedModes:
    - chat
    - responses
thinking: true
