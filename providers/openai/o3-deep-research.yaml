costs:
    - cache_read_input_token_cost: 0.0000025
      input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00004
      output_cost_per_token_batches: 0.00002
      region: "*"
features:
    - system_messages
    - prompt_caching
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: o3-deep-research
params:
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - tool_choice
    - parallel_tool_calls
    - temperature
    - top_p
    - stop
    - "n"
    - max_tokens
    - max_completion_tokens
sources:
    - https://developers.openai.com/api/docs/models/o3-deep-research
    - https://developers.openai.com/api/docs/guides/deep-research
status: active
supportedModes:
    - responses
thinking: true
