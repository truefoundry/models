model: gpt-4o-realtime-preview
costs:
  - region: '*'
    input_cost_per_token: 0.000005
    output_cost_per_token: 0.00002
    cache_read_input_token_cost: 2.5e-6
    input_cost_per_audio_token: 0.00004
    output_cost_per_audio_token: 0.00008
    cache_creation_input_audio_token_cost: 2.5e-6
limits:
  max_tokens: 4096
  max_input_tokens: 32000
  max_output_tokens: 4096
features: [function_calling, parallel_function_calling, audio_input, audio_output]
mode: chat
