costs:
    - cache_read_input_audio_token_cost: 4e-7
      cache_read_input_token_cost: 4e-7
      input_cost_per_audio_token: 0.000032
      input_cost_per_image_token: 0.000005
      input_cost_per_token: 0.000004
      output_cost_per_audio_token: 0.000064
      output_cost_per_token: 0.000016
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
limits:
    context_window: 32000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - audio
        - image
    output:
        - text
        - audio
mode: realtime
model: gpt-realtime
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-realtime
status: active
supportedModes:
    - realtime
