costs:
    - input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
      region: "*"
features:
    - system_messages
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 8192
    max_tokens: 8192
mode: chat
model: gpt-4
params:
    - key: max_tokens
      maxValue: 8192
sources:
    - https://developers.openai.com/api/docs/models/gpt-4
    - https://developers.openai.com/api/docs/deprecations
