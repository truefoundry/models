costs:
    - input_cost_per_token: 0.00003
      input_cost_per_token_batches: 0.00003
      output_cost_per_token: 0.00006
      output_cost_per_token_batches: 0.00006
      region: "*"
features:
    - system_messages
limits:
    context_window: 8192
    max_input_tokens: 8192
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-4
params:
    - key: max_tokens
      maxValue: 8192
provisioning: serverless
removeParams:
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/models/gpt-4
status: active
supportedModes:
    - chat
