costs:
    - input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
      region: "*"
features:
    - chat
    - tools
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
limits:
    max_input_tokens: 8192
    max_output_tokens: 4096
mode: chat
model: gpt-4
params:
    - key: max_tokens
      maxValue: 8192
