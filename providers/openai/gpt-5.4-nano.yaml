costs:
    - cache_read_input_token_cost: 2.e-8
      input_cost_per_token: 2.e-7
      output_cost_per_token: 0.00000125
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
    - system_messages
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.4-nano
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-nano
thinking: true
