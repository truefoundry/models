costs:
    - cache_read_input_token_cost: 2e-8
      input_cost_per_token: 2e-7
      input_cost_per_token_batches: 1e-7
      output_cost_per_token: 0.00000125
      output_cost_per_token_batches: 6.25e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
    - system_messages
    - prompt_caching
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.4-nano
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-nano
status: active
supportedModes:
    - chat
thinking: true
