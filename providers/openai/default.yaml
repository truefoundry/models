documentation:
    - https://platform.openai.com/docs
    - https://openai.com/api/pricing/
    - https://platform.openai.com/docs/models
    - https://platform.openai.com/docs/deprecations
    - https://developers.openai.com/api/docs/models
    - https://developers.openai.com/docs/pricing
    - https://developers.openai.com/docs/deprecations
messages:
    options:
        - system
        - user
        - assistant
        - developer
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: true
      key: parallel_tool_calls
      type: boolean
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
      type: string
