documentation:
    - https://platform.openai.com/docs
    - https://openai.com/api/pricing/
    - https://platform.openai.com/docs/models
    - https://platform.openai.com/docs/deprecations
    - https://developers.openai.com/api/docs/models
messages:
    options:
        - system
        - user
        - assistant
        - developer
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      skipValues:
          - null
          - []
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
      skipValues:
          - null
          - []
    - defaultValue: true
      key: parallel_tool_calls
      skipValues:
          - null
          - true
      type: boolean
type:
    primary: chat
    supported: []
