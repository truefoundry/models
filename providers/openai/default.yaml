params:
    - key: max_tokens
    defaultValue: 128
    minValue: 1
    maxValue: 4096
    - key: temperature
    defaultValue: 0.8
    minValue: 0
    maxValue: 2
    - key: stop
    defaultValue:
    type: array-of-strings
    skipValues:
        -
        - []
    - key: top_p
    defaultValue: 0.1
    minValue: 0
    maxValue: 1
    - key: n
    defaultValue: 1
    minValue: 1
    maxValue: 10
    - key: frequency_penalty
    defaultValue: 0
    minValue: -2
    maxValue: 2
    - key: presence_penalty
    defaultValue: 0
    minValue: -2
    maxValue: 2
    - key: stream
    defaultValue: true
    type: boolean
    - key: tool_choice
    type: non-view-manage-data
    defaultValue:
    options:
        - value: none
        name: None
        - value: auto
        name: Auto
        - value: required
        name: Required
        - value: custom
        name: Custom
        schema:
            type: json
    skipValues:
        -
        - []
    rule:
        default:
            condition: tools
            then: auto
            else:
    - key: parallel_tool_calls
    type: boolean
    defaultValue: true
    skipValues: [null, true]
    rule:
        default:
            condition: tools
            then: true
            else: true
    - key: logit_bias
    defaultValue:
    type: string
    skipValues: [null]
messages:
    options: [system, user, assistant, developer]
type:
    primary: chat
    supported: []
