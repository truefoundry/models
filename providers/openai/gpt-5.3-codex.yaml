costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      output_cost_per_token: 0.000014
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - chat
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - text
    - code
    - tools
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5.3-codex
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      options:
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
          - name: Extra High
            value: xhigh
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.3-codex
    - https://developers.openai.com/api/docs/pricing
thinking: true
