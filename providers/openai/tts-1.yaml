costs:
    - input_cost_per_character: 0.000015
      region: "*"
features:
    - audio_output
limits:
    max_tokens: 4096
mode: audio_speech
model: tts-1
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/models/tts-1
    - https://developers.openai.com/api/docs/guides/text-to-speech/
    - https://developers.openai.com/api/docs/deprecations/
