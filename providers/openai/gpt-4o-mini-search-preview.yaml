costs:
    - input_cost_per_query: 0.025
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
deprecationDate: "2026-07-23"
features:
    - system_messages
    - structured_output
limits:
    context_window: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: gpt-4o-mini-search-preview
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 16384
      minValue: 1
provisioning: serverless
removeParams:
    - tool_choice
    - parallel_tool_calls
    - temperature
sources:
    - https://developers.openai.com/api/docs/models/gpt-4o-mini-search-preview
status: preview
supportedModes:
    - chat
