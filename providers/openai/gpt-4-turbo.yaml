costs:
    - input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00003
      output_cost_per_token_batches: 0.000015
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-4-turbo
params:
    - key: max_tokens
      maxValue: 4096
    - defaultValue: null
      key: response_format
      type: string
sources:
    - https://developers.openai.com/api/docs/models/gpt-4-turbo
    - https://developers.openai.com/docs/guides/prompt-caching
supportedModes:
    - chat
