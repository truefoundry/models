costs:
    - input_cost_per_token: 0
      output_cost_per_token: 0
      region: "*"
limits:
    max_input_tokens: 32768
    max_output_tokens: 0
modalities:
    input:
        - image
mode: moderation
model: omni-moderation-latest
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/guides/moderation
    - https://developers.openai.com/docs/models
    - https://developers.openai.com/docs/deprecations
