    - temperature
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/guides/moderation
    - https://developers.openai.com/api/docs/models/omni-moderation-latest
