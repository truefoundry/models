costs:
    - input_cost_per_token: 0.000005
      input_cost_per_token_batches: 0.0000025
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-4o-2024-05-13
params:
    - defaultValue: null
      key: response_format
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/docs/models/gpt-4o
status: active
supportedModes:
    - chat
    - responses
