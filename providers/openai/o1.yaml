costs:
    -
        cache_read_input_token_cost: 0.0000075
        input_cost_per_token: 0.000015
        output_cost_per_token: 0.00006
        region: '*'
features: [chat, image, function_calling, vision, system_messages, tool_choice, prompt_caching, response_schema, pdf_input]
limits:
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 4096
messages:
    options:
        - user
        - assistant
        - developer
mode: chat
model: o1
params:
    -
        defaultValue: 1000
        key: max_completion_tokens
        maxValue: 100000
        minValue: 1
removeParams:
    - temperature
    - top_p
    - 'n'
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - stream
    - max_tokens
