model: o1
costs:
  - region: '*'
    input_cost_per_token: 0.000015
    output_cost_per_token: 0.00006
    cache_read_input_token_cost: 0.0000075
limits:
  max_tokens: 4096
  max_input_tokens: 200000
  max_output_tokens: 100000
features: [function_calling, vision, chat, image, system_messages, tool_choice, prompt_caching, response_schema, pdf_input]
messages:
  options:
    - user
    - assistant
    - developer
params:
  - key: max_completion_tokens
    defaultValue: 1000
    minValue: 1
    maxValue: 100000
removeParams:
  - temperature
  - top_p
  - 'n'
  - presence_penalty
  - frequency_penalty
  - logit_bias
  - stream
  - max_tokens
mode: chat
