costs:
    - cache_read_input_token_cost: 0.0000075
      input_cost_per_token: 0.000015
      input_cost_per_token_batches: 0.0000075
      output_cost_per_token: 0.00006
      output_cost_per_token_batches: 0.00003
      region: "*"
features:
    - function_calling
    - vision
    - chat
    - image_input
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
mode: chat
model: o1
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      options:
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
removeParams:
    - temperature
    - top_p
    - "n"
    - presence_penalty
    - frequency_penalty
    - logit_bias
    - stream
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/deprecations/
    - https://developers.openai.com/api/docs/guides/reasoning/
thinking: true
