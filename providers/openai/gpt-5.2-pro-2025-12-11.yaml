costs:
    - input_cost_per_token: 0.000021
      input_cost_per_token_batches: 0.0000105
      output_cost_per_token: 0.000168
      output_cost_per_token_batches: 0.000084
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - prompt_caching
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.2-pro-2025-12-11
params:
    - defaultValue: 128000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2-pro
thinking: true
