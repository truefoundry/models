features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.5
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      type: string
provisioning: serverless
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5
status: active
supportedModes:
    - chat
thinking: true
