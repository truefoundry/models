costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.00003
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - structured_output
    - prompt_caching
    - json_output
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5.5
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5
status: active
supportedModes:
    - responses
thinking: true
