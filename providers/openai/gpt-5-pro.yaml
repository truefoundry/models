costs:
    - input_cost_per_token: 0.000015
      input_cost_per_token_batches: 0.000015
      output_cost_per_token: 0.00012
      output_cost_per_token_batches: 0.00012
      region: "*"
features:
    - function_calling
    - structured_output
    - prompt_caching
limits:
    context_window: 400000
    max_output_tokens: 272000
    max_tokens: 272000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5-pro
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 272000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - parallel_tool_calls
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-pro
status: active
supportedModes:
    - responses
thinking: true
