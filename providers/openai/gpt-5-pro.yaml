costs:
    - input_cost_per_token: 1.5e-5
      input_cost_per_token_batches: 7.5e-6
      output_cost_per_token: 0.00012
      output_cost_per_token_batches: 6e-5
      region: "*"
features:
    - function_calling
    - structured_output
limits:
    context_window: 400000
    max_output_tokens: 272000
    max_tokens: 272000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5-pro
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 272000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - n
    - parallel_tool_calls
    - max_tokens
    - max_completion_tokens
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-pro
status: active
supportedModes:
    - responses
thinking: true
