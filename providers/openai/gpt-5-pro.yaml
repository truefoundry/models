costs:
    - input_cost_per_token: 0.000015
      output_cost_per_token: 0.00012
      region: "*"
features:
    - function_calling
    - response_schema
limits:
    context_window: 400000
    max_output_tokens: 272000
    max_tokens: 272000
modalities:
    input:
        - image
mode: chat
model: gpt-5-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 272000
      minValue: 1
removeParams:
    - temperature
    - top_p
    - frequency_penalty
    - presence_penalty
    - "n"
    - logit_bias
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/models/gpt-5-pro
thinking: true
