costs:
    - output_cost_per_second_1080p: 0.5
      output_cost_per_second_720p: 0.3
      region: "*"
features:
    - image
mode: video
model: sora-2-pro
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/models/sora-2-pro
    - https://developers.openai.com/api/docs/guides/video-generation
