costs:
    - output_cost_per_second_1024p: 0.5
      output_cost_per_second_1080p: 0.7
      output_cost_per_second_720p: 0.3
      region: "*"
modalities:
    input:
        - text
        - image
    output:
        - video
        - audio
mode: video
model: sora-2-pro
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/models/sora-2-pro
    - https://developers.openai.com/api/docs/guides/video-generation
