costs:
    - cache_read_input_token_cost: 1.75e-7
      input_cost_per_token: 0.00000175
      input_cost_per_token_batches: 8.75e-7
      output_cost_per_token: 0.000014
      output_cost_per_token_batches: 0.000007
      priority_pricing:
          cache_read_input_token_cost: 3.5e-7
          input_cost_per_token: 0.0000035
          output_cost_per_token: 0.000028
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.2
params:
    - defaultValue: 20000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - "n"
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.2
status: active
supportedModes:
    - chat
    - responses
thinking: true
