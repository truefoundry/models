costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - structured_output
    - system_messages
    - prompt_caching
limits:
    context_window: 400000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5-codex
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/docs/models/gpt-5-codex
status: active
supportedModes:
    - responses
thinking: true
