costs:
    - cache_read_input_token_cost: 1.25e-7
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
      region: "*"
features:
    - chat
    - text
    - code
    - function_calling
    - parallel_function_calling
    - tools
    - tool_choice
    - vision
    - image_input
    - system_messages
    - prompt_caching
limits:
    context_window: 400000
    max_input_tokens: 272000
    max_output_tokens: 128000
    max_tokens: 128000
mode: chat
model: gpt-5-codex
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      options:
          - name: Minimal
            value: minimal
          - name: Low
            value: low
          - name: Medium
            value: medium
          - name: High
            value: high
sources:
    - https://platform.openai.com/docs/models/gpt-5-codex
    - https://developers.openai.com/codex/pricing/
    - https://developers.openai.com/codex/models/
thinking: true
