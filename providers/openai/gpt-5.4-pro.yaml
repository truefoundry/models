costs:
    - input_cost_per_token: 0.00003
      input_cost_per_token_batches: 0.000015
      output_cost_per_token: 0.00018
      output_cost_per_token_batches: 0.00009
      region: "*"
      tiered_pricing:
          input:
              - cost_per_token: 0.00006
                from: 272000
          output:
              - cost_per_token: 0.00027
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5.4-pro
params:
    - defaultValue: 128000
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: high
      key: reasoning_effort
      type: string
pricing:
    - standard:
          - input_cost_per_token: 0.00003
            input_cost_per_token_batches: 0.000015
            output_cost_per_token: 0.00018
            output_cost_per_token_batches: 0.00009
            region: "*"
            tiered_pricing:
                input:
                    - cost_per_token: 0.00006
                      from: 272000
                output:
                    - cost_per_token: 0.00027
                      from: 272000
                pricing_mode: cumulative
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - "n"
    - stop
    - max_tokens
    - max_completion_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4-pro
status: active
supportedModes:
    - responses
    - chat
thinking: true
