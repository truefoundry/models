costs:
    - input_cost_per_token: 0.0000015
      output_cost_per_token: 0.000002
      region: "*"
features:
    - text
limits:
    context_window: 4096
    max_output_tokens: 4096
    max_tokens: 4096
messages:
    options: []
mode: completion
model: gpt-3.5-turbo-instruct
removeParams:
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/api/docs/models/gpt-3.5-turbo-instruct
