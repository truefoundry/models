model: chatgpt-4o-latest
costs:
  - region: '*'
    input_cost_per_token: 0.000005
    output_cost_per_token: 0.000015
limits:
  max_tokens: 4096
  max_input_tokens: 128000
  max_output_tokens: 4096
features: [chat, function_calling, parallel_function_calling, vision, system_messages, tool_choice, prompt_caching, pdf_input]
mode: chat
