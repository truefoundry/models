costs:
    - input_cost_per_token: 0.00015
      output_cost_per_token: 0.0006
      region: "*"
features:
    - function_calling
    - vision
    - image_input
    - chat
    - response_schema
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
mode: chat
model: o1-pro
params:
    - defaultValue: false
      key: stream
      type: boolean
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
sources:
    - https://developers.openai.com/api/docs/models/o1-pro
    - https://developers.openai.com/api/docs/deprecations
thinking: true
