costs:
    - input_cost_per_token: 0.00015
      input_cost_per_token_batches: 0.000075
      output_cost_per_token: 0.0006
      output_cost_per_token_batches: 0.0003
      region: "*"
features:
    - function_calling
    - vision
    - chat
    - image_input
    - response_schema
    - tool_choice
    - text
    - code
    - tools
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
mode: chat
model: o1-pro
params:
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - parallel_tool_calls
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/pricing
    - https://developers.openai.com/api/docs/models
    - https://developers.openai.com/api/docs/models/o1-pro
thinking: true
