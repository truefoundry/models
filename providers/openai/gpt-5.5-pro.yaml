costs:
    - input_cost_per_token: 0.00003
      input_cost_per_token_batches: 0.000015
      output_cost_per_token: 0.00018
      output_cost_per_token_batches: 0.00009
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - structured_output
    - json_output
    - code_execution
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5.5-pro
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 128000
      minValue: 1
provisioning: serverless
removeParams:
    - temperature
    - top_p
    - stream
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5-pro
status: active
supportedModes:
    - responses
    - chat
thinking: true
