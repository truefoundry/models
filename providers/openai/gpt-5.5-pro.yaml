costs:
    - input_cost_per_token: 0.00003
      input_cost_per_token_batches: 0.000015
      output_cost_per_token: 0.00018
      output_cost_per_token_batches: 0.00009
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - structured_output
    - system_messages
    - tool_choice
    - json_output
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: responses
model: gpt-5.5-pro
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - medium
          - high
          - xhigh
      type: string
    - defaultValue: medium
      key: verbosity
provisioning: serverless
removeParams:
    - stream
    - max_completion_tokens
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5-pro
status: active
supportedModes:
    - responses
thinking: true
