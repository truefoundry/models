costs:
    - cache_read_input_token_cost: 0.00000125
      input_cost_per_token: 0.0000025
      input_cost_per_token_batches: 0.00000125
      output_cost_per_token: 0.00001
      output_cost_per_token_batches: 0.000005
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - vision
    - image_input
    - chat
    - image
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
    - pdf_input
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
mode: chat
model: gpt-4o
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      options:
          - name: Text
            value: null
          - name: JSON Object
            schema:
                properties:
                    type:
                        type: string
                        value: json_object
                type: object
            value: json_object
          - name: JSON Schema
            params:
                defaultValue: null
                key: json_schema
                skipValues:
                    - null
                type: json
            schema:
                properties:
                    json_schema:
                        type: object
                    type:
                        type: string
                        value: json_schema
                type: object
            value: json_schema
      skipValues:
          - null
      type: string
sources:
    - https://platform.openai.com/docs/models/gpt-4o
    - https://developers.openai.com/api/docs/models/gpt-4o
    - https://platform.openai.com/docs/guides/prompt-caching
