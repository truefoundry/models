costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.000012
      region: "*"
features:
    - chat
    - function_calling
    - system_messages
    - tool_choice
    - tools
limits:
    context_window: 8192
    max_output_tokens: 1024
    max_tokens: 1024
modalities:
    input:
        - image
mode: chat
model: computer-use-preview
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 1024
      minValue: 1
removeParams:
    - stream
sources:
    - https://developers.openai.com/api/docs/models/computer-use-preview
    - https://developers.openai.com/api/docs/guides/tools-computer-use
thinking: true
