model: gpt-4-0314
costs:
    - region: "*"
      input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
limits:
    max_input_tokens: 8192
    max_output_tokens: 4096
features: [chat, system_messages, tool_choice, prompt_caching]
params:
  - key: max_tokens
    maxValue: 8192
mode: chat
isDeprecated: true
