costs:
    - cache_read_input_token_cost: 5.e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.000008
      output_cost_per_token_batches: 0.000004
      region: "*"
features:
    - function_calling
    - structured_output
    - prompt_caching
    - tool_choice
    - system_messages
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - image
mode: chat
model: o3-2025-04-16
params:
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: 1
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: medium
      key: reasoning_effort
      type: string
sources:
    - https://developers.openai.com/api/docs/models/o3
thinking: true
