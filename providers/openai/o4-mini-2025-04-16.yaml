costs:
    - cache_read_input_token_cost: 2.75e-7
      input_cost_per_token: 0.0000011
      input_cost_per_token_batches: 5.5e-7
      output_cost_per_token: 0.0000044
      output_cost_per_token_batches: 0.0000022
      region: "*"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
    - system_messages
    - json_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: o4-mini-2025-04-16
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
removeParams:
    - top_p
    - max_tokens
    - temperature
    - stop
sources:
    - https://developers.openai.com/api/docs/models/o4-mini
    - https://developers.openai.com/docs/deprecations
    - https://developers.openai.com/docs/pricing
status: active
thinking: true
