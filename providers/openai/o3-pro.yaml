costs:
    - input_cost_per_token: 0.00002
      output_cost_per_token: 0.00008
      region: "*"
features:
    - chat
    - function_calling
    - vision
    - image_input
    - system_messages
    - tool_choice
    - response_schema
    - text
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
mode: chat
model: o3-pro
params:
    - defaultValue: 100000
      key: max_tokens
      maxValue: 100000
      minValue: 1
removeParams:
    - temperature
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - logit_bias
    - stream
    - parallel_tool_calls
    - stop
sources:
    - https://developers.openai.com/api/docs/models/o3-pro
thinking: true
