costs:
    - input_cost_per_token: 0.00002
      output_cost_per_token: 0.00008
      region: "*"
features:
    - chat
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - response_schema
    - prompt_caching
limits:
    context_window: 200000
    max_output_tokens: 100000
    max_tokens: 100000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: o3-pro
params:
    - defaultValue: 100000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
removeParams:
    - max_tokens
    - temperature
    - top_p
    - frequency_penalty
    - presence_penalty
    - logit_bias
    - "n"
    - stream
    - stop
sources:
    - https://developers.openai.com/api/docs/models/o3-pro
    - https://developers.openai.com/api/docs/deprecations/
    - https://openrouter.ai/openai/o3-pro/api
thinking: true
