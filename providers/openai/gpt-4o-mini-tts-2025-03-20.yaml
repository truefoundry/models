costs:
    - input_cost_per_token: 6.e-7
      output_cost_per_audio_token: 0.000012
      output_cost_per_second: 0.00025
      output_cost_per_token: 0.00001
      region: "*"
limits:
    max_input_tokens: 2000
modalities:
    input:
        - text
    output:
        - audio
mode: text_to_speech
model: gpt-4o-mini-tts-2025-03-20
removeParams:
    - max_tokens
    - stop
    - top_p
    - "n"
    - tool_choice
    - parallel_tool_calls
sources:
    - https://developers.openai.com/docs/models/gpt-4o-mini-tts
    - https://developers.openai.com/docs/guides/text-to-speech
