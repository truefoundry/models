costs:
    - cache_read_input_token_cost: 5.e-8
      input_cost_per_token: 2.e-7
      input_cost_per_token_batches: 1.e-7
      output_cost_per_token: 8.e-7
      output_cost_per_token_batches: 4.e-7
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - chat
    - tools
    - system_messages
    - tool_choice
    - prompt_caching
    - response_schema
limits:
    context_window: 1047576
    max_input_tokens: 1047576
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - image
        - pdf
mode: chat
model: gpt-4.1-nano
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 32768
      minValue: 1
    - defaultValue: null
      key: response_format
      skipValues:
          - null
      type: string
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-4.1-nano
    - https://developers.openai.com/api/docs/pricing
