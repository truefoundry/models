costs:
    - cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 1.1e-6
      input_cost_per_token_batches: 5.5e-7
      output_cost_per_token: 4.4e-6
      output_cost_per_token_batches: 2.2e-6
      region: "*"
deprecationDate: "2026-04-22"
features:
    - function_calling
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
isDeprecated: true
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 100000
    max_tokens: 100000
messages:
    options:
        - user
        - assistant
        - developer
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: o3-mini
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 100000
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
    - defaultValue: medium
      key: reasoning_effort
      type: string
provisioning: serverless
removeParams:
