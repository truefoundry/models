costs:
    - input_cost_per_token: 1.e-7
      input_cost_per_token_batches: 5.e-8
      output_cost_per_token: 0
      region: "*"
limits:
    max_input_tokens: 8191
    output_vector_size: 1536
mode: embedding
model: text-embedding-ada-002
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
    - logit_bias
sources:
    - https://developers.openai.com/api/docs/models/text-embedding-ada-002
