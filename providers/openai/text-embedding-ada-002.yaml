costs:
    - input_cost_per_token: 1.e-7
      input_cost_per_token_batches: 5.e-8
      output_cost_per_token: 0
      output_cost_per_token_batches: 0
      region: "*"
limits:
    max_input_tokens: 8191
mode: embedding
model: text-embedding-ada-002
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - frequency_penalty
    - presence_penalty
    - stream
    - tool_choice
    - parallel_tool_calls
    - logit_bias
sources:
    - https://platform.openai.com/docs/models/text-embedding-ada-002
