costs:
    - input_cost_per_token: 0.000003
      output_cost_per_token: 0.0000045
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - structured_output
limits:
    context_window: 128000
messages:
    options:
        - system
        - user
        - assistant
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: DeepSeek-V3.1-Terminus
sources:
    - https://docs.sambanova.ai/docs/en/features/function-calling
    - https://docs.sambanova.ai/docs/en/features/openai-compatibility
    - https://docs.sambanova.ai/docs/api-reference/chat-completions/create-chat-based-completion
    - https://docs.sambanova.ai/docs/en/build/reasoning
