costs:
    - input_cost_per_token: "0.00000300"
      output_cost_per_token: "0.00000450"
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 131072
    max_output_tokens: 7168
mode: chat
model: DeepSeek-V3.1-Terminus
sources:
    - https://docs.sambanova.ai/docs/en/features/function-calling
    - https://docs.sambanova.ai/docs/en/features/openai-compatibility
