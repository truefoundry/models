costs:
    - cache_read_input_token_cost: 4.4e-8
      input_cost_per_token: 1.32e-6
      output_cost_per_token: 3.96e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
    - prompt_caching
limits:
    context_window: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: DeepSeek-V4-Pro
params:
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://pass.wafer.ai/v1/models
    - https://wafer.ai
status: active
supportedModes:
    - chat
    - responses
thinking: true
