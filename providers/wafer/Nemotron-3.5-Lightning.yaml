costs:
    - cache_read_input_token_cost: 2.5e-8
      input_cost_per_token: 5e-8
      output_cost_per_token: 2e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
limits:
    context_window: 262144
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Nemotron-3.5-Lightning
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - high
          - max
provisioning: serverless
sources:
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
