costs:
    - cache_read_input_token_cost: 0.0
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - structured_output
    - json_output
limits:
    context_window: 1048576
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: DeepSeek-V4.1-Flash-1017
params:
    - defaultValue: none
      key: reasoning_effort
      supportedValues: [none, low, high, max]
      type: string
provisioning: serverless
sources:
    - https://docs.wafer.ai/serverless/models
    - https://pass.wafer.ai/v1/models
supportedModes:
    - chat
thinking: true
