costs:
    - cache_read_input_token_cost: 1.5e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
      region: "*"
features:
    - function_calling
    - prompt_caching
    - system_messages
limits:
    context_window: 1048576
    max_output_tokens: 524288
    max_tokens: 524288
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: MiniMax-M3.1-Flash
provisioning: serverless
sources:
    - https://docs.wafer.ai/serverless/models.md
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
thinking: true
