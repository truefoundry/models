costs:
    - cache_read_input_token_cost: 3e-8
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 5e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - json_output
    - system_messages
    - prompt_caching
limits:
    context_window: 1048576
modalities:
    input:
        - text
        - image
        - video
    output:
        - text
mode: chat
model: GLM-5.3-Flash
provisioning: serverless
sources:
    - https://docs.z.ai/guides/vlm/glm-5.3-flash
    - https://docs.wafer.ai/serverless/setup
status: active
supportedModes:
    - chat
thinking: true
