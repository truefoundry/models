costs:
    - cache_read_input_token_cost: 2.1e-7
      input_cost_per_token: 2.1e-6
      output_cost_per_token: 6.6e-6
      region: "*"
features:
    - function_calling
    - structured_output
    - tool_choice
    - prompt_caching
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: glm5.2-fast
provisioning: serverless
sources:
    - https://vercel.com/ai-gateway/models/glm-5.2-fast
    - https://app.wafer.ai/models
status: active
supportedModes:
    - chat
thinking: true
