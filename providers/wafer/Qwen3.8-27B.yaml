costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1.2e-7
      output_cost_per_token: 2.5e-6
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
    - json_output
    - structured_output
    - prompt_caching
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: Qwen3.8-27B
params:
    - defaultValue: high
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - max
      type: string
provisioning: serverless
sources:
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
