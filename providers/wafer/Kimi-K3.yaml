costs:
    - cache_read_input_token_cost: 3e-7
      input_cost_per_token: 1.44e-6
      output_cost_per_token: 9e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - json_output
    - structured_output
limits:
    context_window: 1048576
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: Kimi-K3
params:
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - high
          - max
provisioning: serverless
sources:
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
