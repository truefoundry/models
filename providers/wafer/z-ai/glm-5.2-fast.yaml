costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.00001025
      region: "*"
features:
    - function_calling
    - prompt_caching
    - structured_output
    - json_output
    - system_messages
    - tool_choice
limits:
    context_window: 1048576
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: z-ai/glm-5.2-fast
provisioning: serverless
sources:
    - https://docs.z.ai/guides/llm/glm-5.2
    - https://vercel.com/changelog/glm-5-2-fast-via-wafer-now-available-on-ai-gateway
status: active
supportedModes:
    - chat
thinking: true
