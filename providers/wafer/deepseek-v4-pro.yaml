          - low
          - high
          - max
provisioning: serverless
sources:
    - https://docs.wafer.ai/serverless/api-reference
    - https://docs.wafer.ai/serverless/models
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
thinking: true
