costs:
    - cache_read_input_token_cost: 6e-8
      input_cost_per_token: 3e-7
      output_cost_per_token: 1.2e-6
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 1.2e-7
                from: 512000
          input:
              - cost_per_token: 6e-7
                from: 512000
          output:
              - cost_per_token: 2.4e-6
                from: 512000
features:
    - function_calling
    - prompt_caching
    - system_messages
limits:
    context_window: 1048576
    max_output_tokens: 512000
    max_tokens: 512000
modalities:
    input:
        - text
        - image
        - video
        - pdf
    output:
        - text
mode: chat
model: MiniMax-M3
provisioning: serverless
sources:
    - https://platform.minimax.io/docs/guides/pricing-paygo.md
    - https://platform.minimax.io/docs/guides/text-m3-function-call.md
    - https://www.minimax.io/blog/minimax-m3
    - https://platform.minimax.io/docs/guides/models-intro
    - https://platform.minimax.io/docs/api-reference/text-chat-openai.md
status: active
supportedModes:
    - chat
thinking: true
