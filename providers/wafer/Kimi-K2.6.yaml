costs:
    - cache_read_input_token_cost: 1.9e-7
      input_cost_per_token: 1.14e-6
      output_cost_per_token: 4.8e-6
      region: "*"
features:
    - function_calling
    - prompt_caching
    - json_output
    - structured_output
limits:
    context_window: 262144
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: Kimi-K2.6
params:
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
      type: string
provisioning: serverless
sources:
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
thinking: true
