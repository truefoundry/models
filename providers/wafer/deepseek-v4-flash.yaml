costs:
    - cache_read_input_token_cost: 5e-8
      input_cost_per_token: 1e-7
      output_cost_per_token: 2.5e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - json_output
    - structured_output
    - prompt_caching
    - system_messages
limits:
    context_window: 1048576
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: deepseek-v4-flash
params:
    - defaultValue: low
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - high
          - max
provisioning: serverless
sources:
    - https://docs.wafer.ai/serverless/setup
    - https://pass.wafer.ai/v1/models
status: active
supportedModes:
    - chat
    - responses
thinking: true
