costs:
    - input_cost_per_token: 0.00000125
      output_cost_per_token: 0.0000025
      region: global
features:
    - function_calling
    - system_messages
    - tool_choice
    - structured_output
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: grok-4.3
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/grok-4.3
    - https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/grok/
status: preview
supportedModes:
    - chat
thinking: true
