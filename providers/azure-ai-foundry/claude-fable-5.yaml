costs:
    - cache_creation_input_token_cost: 0.0000125
      cache_creation_input_token_cost_per_hour: 0.00002
      cache_read_input_token_cost: 0.000001
      input_cost_per_token: 0.00001
      input_cost_per_token_batches: 0.000005
      output_cost_per_token: 0.00005
      output_cost_per_token_batches: 0.000025
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - cache_control
    - structured_output
    - system_messages
    - json_output
limits:
    context_window: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-fable-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
    - https://platform.claude.com/docs/en/about-claude/pricing
status: preview
supportedModes:
    - chat
thinking: true
