costs:
    - cache_creation_input_token_cost: 6.25e-6
      cache_creation_input_token_cost_per_hour: 1e-5
      cache_read_input_token_cost: 5e-7
      input_cost_per_token: 5e-6
      output_cost_per_token: 2.5e-5
      region: global
    - cache_creation_input_token_cost: 6.875e-6
      cache_creation_input_token_cost_per_hour: 1.1e-5
      cache_read_input_token_cost: 5.5e-7
      input_cost_per_token: 5.5e-6
      output_cost_per_token: 2.75e-5
      region: datazone_us
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - structured_output
    - json_output
    - assistant_prefill
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
    tool_use_system_prompt_tokens: 286
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-opus-5
params:
    - defaultValue: 4096
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
    - https://platform.claude.com/docs/en/about-claude/pricing
status: active
supportedModes:
    - chat
thinking: true
