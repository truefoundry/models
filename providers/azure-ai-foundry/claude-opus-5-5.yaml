costs:
    - cache_creation_input_token_cost: 0.000005
      cache_creation_input_token_cost_per_hour: 0.000008
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000004
      input_cost_per_token_batches: 0.000002
      output_cost_per_token: 0.00002
      output_cost_per_token_batches: 0.00001
      region: global
    - cache_creation_input_token_cost: 0.000005
      cache_creation_input_token_cost_per_hour: 0.000008
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000004
      input_cost_per_token_batches: 0.000002
      output_cost_per_token: 0.00002
      output_cost_per_token_batches: 0.00001
      region: datazone_us
features:
    - function_calling
    - parallel_function_calling
    - cache_control
    - system_messages
    - mid_conversation_system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - json_output
limits:
    context_window: 1000000
    max_input_tokens: 1000000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-opus-5-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 1
      minValue: 0
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
provisioning: serverless
sources:
    - https://platform.claude.com/docs/en/models/opus-5-5/overview
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://ai.azure.com/catalog/models/claude-opus-5-5
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models-billing
status: active
supportedModes:
    - chat
thinking: true
