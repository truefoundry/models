costs:
    - input_cost_per_token: 2e-7
      output_cost_per_token: 4e-7
      region: "*"
features:
    - function_calling
    - json_output
    - system_messages
limits:
    context_window: 256000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: AI21-Jamba-1.5-Mini
provisioning: serverless
sources:
    - https://portkey.ai/models/azure-ai/AI21-Jamba-1.5-Mini
    - https://ai.azure.com/explore/models/AI21-Jamba-1.5-Mini/version/1/registry/azureml-ai21
status: active
supportedModes:
    - chat
