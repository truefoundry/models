costs:
    - cache_creation_input_token_cost: 0.00000125
      cache_creation_input_token_cost_per_hour: 0.000002
      cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000001
      input_cost_per_token_batches: 5e-7
      output_cost_per_token: 0.000005
      output_cost_per_token_batches: 0.0000025
      region: global
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - cache_control
    - assistant_prefill
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: claude-haiku-4-5-2
params:
    - defaultValue: 1024
      key: max_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry
    - https://platform.claude.com/docs/en/about-claude/pricing
status: active
supportedModes:
    - chat
thinking: true
