costs:
    - input_cost_per_token: 4e-8
      output_cost_per_token: 4e-8
      region: global
features:
    - function_calling
    - tool_choice
    - system_messages
    - json_output
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Ministral-3B
provisioning: serverless
sources:
    - https://ai.azure.com/explore/models/Ministral-3B/version/1/registry/azureml-mistral
    - https://learn.microsoft.com/en-us/azure/machine-learning/concept-models-featured?view=azureml-api-2
status: active
supportedModes:
    - chat
