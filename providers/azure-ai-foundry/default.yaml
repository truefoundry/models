documentation:
    - https://learn.microsoft.com/en-us/azure/ai-foundry/
    - https://azure.microsoft.com/en-us/pricing/details/microsoft-foundry/
    - https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/foundry-models-overview
    - https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/model-lifecycle-retirement
    - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
messages:
    options:
        - system
        - user
        - assistant
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
