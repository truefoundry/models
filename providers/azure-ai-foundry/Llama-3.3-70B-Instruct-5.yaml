costs:
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 7.1e-7
      region: "*"
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Llama-3.3-70B-Instruct-5
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/Llama-3.3-70B-Instruct
    - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-deploy-models-llama?view=azureml-api-2
status: active
supportedModes:
    - chat
