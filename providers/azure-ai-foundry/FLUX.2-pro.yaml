costs:
    - region: global
      # Pricing is per megapixel — schema has no per-MP field.
      # Generated images: $0.03/MP for the first MP, $0.015/MP for each subsequent MP.
      # Reference images: $0.015/MP.
limits:
    context_window: 131072
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: FLUX.2-pro
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - top_p
    - "n"
    - stop
    - stream
sources:
    - https://ai.azure.com/catalog/models/FLUX.2-pro
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/black-forest-labs/
status: active
supportedModes:
    - image
