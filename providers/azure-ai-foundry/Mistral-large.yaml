features:
    - function_calling
    - json_output
    - system_messages
    - tool_choice
limits:
    context_window: 32768
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Mistral-large
provisioning: serverless
# costs not found in official docs — Azure Foundry Models pricing page shows placeholder values for Mistral-large
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/models-from-partners
status: active
supportedModes:
    - chat
