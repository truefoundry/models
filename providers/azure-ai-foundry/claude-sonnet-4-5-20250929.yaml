costs:
    - cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_per_hour: 0.000006
      cache_read_input_token_cost: 3e-7
      input_cost_per_token: 0.000003
      input_cost_per_token_batches: 0.0000015
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      region: global
features:
    - function_calling
    - parallel_function_calling
    - prompt_caching
    - system_messages
    - tool_choice
    - structured_output
    - assistant_prefill
    - cache_control
limits:
    context_window: 200000
    max_output_tokens: 64000
    max_tokens: 64000
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-sonnet-4-5-20250929
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 64000
      minValue: 1
provisioning: serverless
sources:
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/claude-models
    - https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/use-foundry-models-claude
    - https://platform.claude.com/docs/en/build-with-claude/claude-in-microsoft-foundry
    - https://platform.claude.com/docs/en/about-claude/pricing
    - https://ai.azure.com/catalog/models/claude-sonnet-4-5
status: active
supportedModes:
    - chat
thinking: true
