costs:
    - input_cost_per_annotated_page: 0.005
      input_cost_per_page: 0.004
      region: global
limits:
    context_window: 128000
    max_output_tokens: 4096
    max_tokens: 4096
modalities:
    input:
        - image
        - pdf
        - doc
    output:
        - text
mode: unknown
model: mistral-ocr-4-0
provisioning: serverless
removeParams:
    - max_tokens
    - temperature
    - stop
    - top_p
    - "n"
    - stream
sources:
    - https://ai.azure.com/catalog/models/mistral-ocr-4-0
    - https://mistral.ai/news/ocr-4/
    - https://docs.mistral.ai/models/model-cards/ocr-4-0
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/mistral-ai/
status: preview
supportedModes:
    - unknown
