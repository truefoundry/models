costs:
    - input_cost_per_token: 7.1e-7
      output_cost_per_token: 7.1e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - system_messages
limits:
    context_window: 128000
    max_output_tokens: 2048
    max_tokens: 2048
modalities:
    input:
        - text
    output:
        - text
mode: chat
model: Llama-3.3-70B-Instruct-2
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/Llama-3.3-70B-Instruct
    - https://techcommunity.microsoft.com/blog/azure-ai-foundry-blog/microsoft-azure-ai-foundry-welcomes-meta-llama-3-3-70b-model/4355199
status: preview
supportedModes:
    - chat
