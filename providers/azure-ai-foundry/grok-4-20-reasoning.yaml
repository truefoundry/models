costs:
    - input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
    - json_output
limits:
    context_window: 262000
    max_output_tokens: 8192
    max_tokens: 8192
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4-20-reasoning
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 8192
      minValue: 1
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/grok-4-20-reasoning
    - https://docs.x.ai/developers/models/grok-4.20
status: preview
supportedModes:
    - chat
    - responses
thinking: true
