model: gpt-oss-120b
costs:
    - region: "*"
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6e-7
limits:
    max_tokens: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
features: [function_calling, parallel_function_calling, tool_choice, response_schema]
mode: chat
