costs:
    - input_cost_per_token: 2e-7
      output_cost_per_token: 5e-7
      region: "*"
features:
    - function_calling
    - tool_choice
    - structured_output
    - system_messages
limits:
    context_window: 131072
    max_input_tokens: 131072
    max_output_tokens: 131072
    max_tokens: 131072
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: grok-4-1-fast-reasoning
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 131072
      minValue: 1
provisioning: serverless
sources:
    - https://ai.azure.com/catalog/models/grok-4-1-fast-reasoning
    - https://azure.microsoft.com/en-us/pricing/details/ai-foundry-models/grok/
status: active
supportedModes:
    - chat
thinking: true
